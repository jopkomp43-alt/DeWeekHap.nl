let activeTab='ingredients', mobileMenuOpen=false, currentUser=null, view='info', servings=2, currentMenu=[], lastGeneratedIds=[], deferredPrompt=null, mealDBCache=[], mealDBLoading=false;
const RECIPES=[{id:'r1',title:'Spaghetti Carbonara',img:'https://images.unsplash.com/photo-1612874742237-6526221588e3?w=800&auto=format&fit=crop',ingr:'400g spaghetti\n200g bacon\n4 eggs\n100g parmesan\nSalt and pepper',steps:'Cook the pasta according to the package\nCook bacon until crispy\nWhisk eggs with parmesan\nMix hot pasta with bacon and egg mixture\nSeason with pepper',cat:'Italian',author:'admin'},{id:'r2',title:'Thai Red Curry',img:'https://images.unsplash.com/photo-1455619452474-d2be8b1e70cd?w=800&auto=format&fit=crop',ingr:'400ml coconut milk\n3 tbsp red curry paste\n300g chicken\n1 bell pepper\n100g bean sprouts\nBasmati rice',steps:'Cook curry paste briefly\nAdd coconut milk\nBring to a simmer\nAdd chicken and vegetables\nSimmer for 15 minutes\nServe with rice',cat:'Asian',author:'admin'},{id:'r3',title:'Classic Lasagna',img:'https://images.unsplash.com/photo-1574894709920-11b28e7367e3?w=800&auto=format&fit=crop',ingr:'12 lasagna sheets\n500g ground beef\n1 onion\n2 cans tomato sauce\n500ml béchamel\n200g cheese\nOlive oil',steps:'Cook beef with onion\nAdd tomato sauce\nLayer pasta sheets, meat sauce and béchamel\nRepeat layers\nFinish with cheese\nBake 40 minutes at 180°C',cat:'Italian',author:'admin'},{id:'r4',title:'Grilled Salmon',img:'https://images.unsplash.com/photo-1467003909585-2f8a72700288?w=800&auto=format&fit=crop',ingr:'4 salmon fillets\n2 lemons\n3 tbsp olive oil\nFresh dill\n500g potatoes\nBroccoli',steps:'Marinate salmon with lemon, oil and dill\nGrill 6 to 8 minutes per side\nBoil potatoes\nSteam broccoli\nServe together',cat:'Fish',author:'admin'},{id:'r5',title:'Vegetarian Chili',img:'https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?w=800&auto=format&fit=crop',ingr:'2 cans kidney beans\n1 can corn\n2 bell peppers\n1 onion\n3 garlic cloves\nChili powder\n1 can diced tomatoes',steps:'Cook onion and garlic\nAdd peppers, beans and corn\nAdd tomatoes\nSeason with chili\nSimmer for 20 minutes\nServe with rice',cat:'Vegetarian',author:'admin'}];
const db={get(k){try{return JSON.parse(localStorage.getItem(k))??null}catch{return null}},set(k,v){localStorage.setItem(k,JSON.stringify(v))},get users(){return this.get('users')||[]},get approvedRecipes(){return this.get('approvedRecipes')||[]},get recipes(){return [...RECIPES,...this.approvedRecipes,...mealDBCache]},get pendingRecipes(){return this.get('pendingRecipes')||[]},get reviews(){return this.get('reviews')||{}},get savedMenus(){return this.get('savedMenus')||{}},get savedRecipes(){return this.get('savedRecipes')||{}},get preferences(){return this.get('userPreferences')||{}}};
function shuffleArray(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}

function savePrefs(){const wel=document.getElementById('prefWel')?.value.trim()||'';const niet=document.getElementById('prefNiet')?.value.trim()||'';const all=db.preferences;all[currentUser?currentUser.email:'guest']={wel,niet};db.set('userPreferences',all);alert('Preferences saved!');render()}
function filterByPrefs(recipes, extra=''){const key=currentUser?currentUser.email:'guest';const prefs=db.preferences[key]||{};return recipes.filter(r=>{const txt=`${r.title} ${r.cat} ${r.ingr}`.toLowerCase();if(extra && !txt.includes(extra.toLowerCase())) return false;if(prefs.niet && prefs.niet.toLowerCase().split(/\s+/).some(w=>w&&txt.includes(w))) return false;if(prefs.wel){const wanted=prefs.wel.toLowerCase().split(/\s+/).filter(Boolean);if(wanted.length && !wanted.some(w=>txt.includes(w))) return false}return true})}
async function fetchMealDBRecipes(count=8){if(mealDBLoading) return []; mealDBLoading=true; try{const calls=Array.from({length:count},()=>fetch('https://www.themealdb.com/api/json/v1/1/random.php')); const responses=await Promise.all(calls); const data=await Promise.all(responses.map(r=>r.json())); const meals=data.filter(d=>d.meals&&d.meals[0]).map(d=>d.meals[0]).map(meal=>{const ingredients=[]; for(let i=1;i<=20;i++){const ing=meal[`strIngredient${i}`], meas=meal[`strMeasure${i}`]; if(ing&&ing.trim()) ingredients.push(`${meas||''} ${ing}`.trim())} return {id:`mdb-${meal.idMeal}`,title:meal.strMeal,img:meal.strMealThumb,ingr:ingredients.join('\n'),steps:(meal.strInstructions||'').split('.').map(s=>s.trim()).filter(Boolean).slice(0,7).join('\n')||'Follow the original recipe instructions.',cat:meal.strCategory||'International',author:'TheMealDB'}}); meals.forEach(m=>{if(!mealDBCache.find(x=>x.id===m.id)) mealDBCache.push(m)}); return meals}catch(e){console.error(e);return []}finally{mealDBLoading=false}}
function showGenerateDialog(){const modal=document.createElement('div');modal.className='fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4';modal.onclick=e=>{if(e.target===modal) modal.remove()};modal.innerHTML=`<div class="bg-white rounded-3xl p-6 md:p-8 max-w-md w-full" onclick="event.stopPropagation()"><h2 class="text-2xl md:text-3xl font-black mb-4 text-center">Any special wishes?</h2><p class="text-sm md:text-base text-slate-600 mb-6 text-center">Optional: type what you feel like eating today.</p><input id="extraWish" type="text" placeholder="For example: chicken, pasta, fish..." class="w-full p-3 md:p-4 mb-4 border-2 rounded-xl text-sm md:text-base" /><div class="flex gap-3"><button onclick="this.closest('.fixed').remove()" class="flex-1 bg-slate-200 text-slate-700 p-3 md:p-4 rounded-xl font-bold">Cancel</button><button id="btnGenerate" class="flex-1 bg-orange-600 text-white p-3 md:p-4 rounded-xl font-bold">Generate</button></div></div>`;document.body.appendChild(modal);document.getElementById('btnGenerate').addEventListener('click',async()=>{const extraWish=document.getElementById('extraWish').value.trim();modal.remove();await generateMenu(extraWish)})}
async function generateMenu(extra=''){const loading=document.createElement('div');loading.className='fixed top-20 right-4 bg-orange-600 text-white px-6 py-3 rounded-xl font-bold shadow-xl z-50';loading.textContent=extra?`Searching for ${extra}...`:'Generating meal plan...';document.body.appendChild(loading);let filtered=filterByPrefs(db.recipes,extra);if(filtered.length<7){await fetchMealDBRecipes(10);filtered=filterByPrefs(db.recipes,extra)}if(filtered.length<3){loading.remove();alert('Not enough recipes found. Try a broader search.');return}const days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];let selected=shuffleArray(filtered).slice(0,Math.min(7,filtered.length));currentMenu=selected.map((r,i)=>({...r,day:days[i]}));lastGeneratedIds=selected.map(r=>r.id);loading.textContent='Meal plan ready!';setTimeout(()=>loading.remove(),900);render()}
function saveMenu(){if(!currentUser){changeView('login');return}const menus=db.savedMenus;menus[currentUser.email]={recipes:currentMenu,date:new Date().toISOString()};db.set('savedMenus',menus);render()}
function copyShoppingList(){const saved=currentUser?(db.savedMenus[currentUser.email]?.recipes||[]):[];const menu=saved.length?saved:currentMenu;if(!menu.length) return alert('No meal plan to copy.');const items=[];menu.forEach(r=>r.ingr.split('\n').forEach(i=>items.push(i)));navigator.clipboard.writeText('SHOPPING LIST\n\n'+items.map((i,n)=>`${n+1}. ${i}`).join('\n')).then(()=>alert('Copied to clipboard!'))}
function login(){const email=document.getElementById('email').value.trim();const password=document.getElementById('password').value.trim();if(!email||!password)return alert('Please fill in all fields.');const users=db.users;const idx=users.findIndex(u=>u.email===email&&u.password===password);if(idx===-1)return alert('Incorrect login details.');users[idx].lastLogin=new Date().toISOString();users[idx].loginCount=(users[idx].loginCount||0)+1;db.set('users',users);currentUser=users[idx];localStorage.setItem('currentUser',JSON.stringify(currentUser));view='home';render()}
function register(){const name=document.getElementById('regName').value.trim();const email=document.getElementById('regEmail').value.trim();const password=document.getElementById('regPassword').value.trim();if(!name||!email||!password)return alert('Please fill in all fields.');const users=db.users;if(users.find(u=>u.email===email))return alert('Email already in use.');const user={name,email,password,isAdmin:false,registeredAt:new Date().toISOString(),lastLogin:new Date().toISOString(),loginCount:1};users.push(user);db.set('users',users);currentUser=user;localStorage.setItem('currentUser',JSON.stringify(user));view='home';render()}

function render(){document.getElementById('bootStatus')?.remove();const app=document.getElementById('app');if(view==='login'){app.innerHTML=`<div class="min-h-screen flex items-center justify-center p-4"><div class="bg-white rounded-3xl p-6 md:p-10 shadow-2xl max-w-md w-full"><img src="./logo.jpg" alt="DeWeekhap logo" class="w-48 max-w-full h-auto mx-auto mb-6 rounded-2xl object-contain" loading="eager"><h1 class="text-3xl md:text-4xl font-black text-center mb-8">DeWeekhap</h1><div id="loginForm"><input id="email" type="email" placeholder="Email" class="w-full p-3 md:p-4 mb-3 border-2 rounded-xl text-sm md:text-base"><input id="password" type="password" placeholder="Password" class="w-full p-3 md:p-4 mb-4 border-2 rounded-xl text-sm md:text-base"><button onclick="login()" class="w-full bg-orange-600 text-white p-3 md:p-4 rounded-xl font-bold mb-3">Login</button><button onclick="showRegister()" class="w-full bg-slate-200 text-slate-700 p-3 md:p-4 rounded-xl font-bold">Register</button></div><div id="registerForm" class="hidden"><input id="regName" type="text" placeholder="Name" class="w-full p-3 md:p-4 mb-3 border-2 rounded-xl text-sm md:text-base"><input id="regEmail" type="email" placeholder="Email" class="w-full p-3 md:p-4 mb-3 border-2 rounded-xl text-sm md:text-base"><input id="regPassword" type="password" placeholder="Password" class="w-full p-3 md:p-4 mb-4 border-2 rounded-xl text-sm md:text-base"><button onclick="register()" class="w-full bg-orange-600 text-white p-3 md:p-4 rounded-xl font-bold mb-3">Create Account</button><button onclick="showLogin()" class="w-full bg-slate-200 text-slate-700 p-3 md:p-4 rounded-xl font-bold">Back to Login</button></div><button onclick="changeView('info')" class="w-full mt-4 text-orange-600 font-bold hover:underline text-sm md:text-base">How does it work?</button></div></div>`} else if(view==='info'){const guestPrefs=db.preferences['guest']||{};app.innerHTML=`${renderGuestNav()}<div class="max-w-4xl mx-auto p-4 py-8 md:py-12"><div class="bg-white rounded-3xl p-6 md:p-8 shadow-xl mb-6"><img src="./logo.jpg" alt="DeWeekhap logo" class="w-56 max-w-full h-auto mx-auto mb-6 rounded-2xl object-contain" loading="eager"><h1 class="text-3xl md:text-5xl font-black mb-4 text-center">Welcome to DeWeekhap</h1><p class="text-lg md:text-xl text-center text-slate-600 mb-8">Your smart meal planner</p><div class="bg-orange-50 p-4 md:p-6 rounded-2xl mb-8"><h2 class="text-2xl md:text-3xl font-black mb-4 text-center">Try it for free</h2><p class="text-sm md:text-base text-slate-600 mb-4 text-center">No account needed. Generate a meal plan instantly.</p><div class="max-w-lg mx-auto mb-4"><p class="text-xs md:text-sm text-slate-600 mb-2">Optional preferences</p><input id="prefWel" placeholder="INCLUDE, for example chicken pasta" value="${guestPrefs.wel||''}" class="w-full p-3 mb-2 border-2 rounded-xl text-sm"><input id="prefNiet" placeholder="EXCLUDE, for example fish nuts" value="${guestPrefs.niet||''}" class="w-full p-3 mb-3 border-2 rounded-xl text-sm"><button onclick="savePrefs()" class="bg-green-600 text-white px-6 py-2 rounded-xl font-bold text-sm">Save</button></div><div class="flex justify-center items-center gap-4 mb-6"><span class="text-base md:text-lg font-bold">People</span><button onclick="servings=Math.max(1,servings-1);render()" class="w-12 h-12 bg-white rounded-xl font-bold text-xl">−</button><span class="text-2xl md:text-3xl font-black">${servings}</span><button onclick="servings++;render()" class="w-12 h-12 bg-white rounded-xl font-bold text-xl">+</button></div><div class="text-center"><button onclick="showGenerateDialog()" class="bg-orange-600 text-white px-8 md:px-12 py-4 md:py-6 rounded-2xl font-black text-base md:text-xl shadow-xl">Generate Meal Plan</button></div></div>${currentMenu.length?renderMenu():''}</div></div>`} else if(view==='home'){const prefs=db.preferences[currentUser.email]||{};app.innerHTML=`${renderNav()}<div class="max-w-6xl mx-auto p-4 py-8 md:py-12"><div class="text-center py-8 md:py-12 bg-white rounded-3xl shadow-xl mb-8 md:mb-12"><h1 class="text-3xl md:text-5xl font-black mb-4 px-4">Welcome, ${currentUser.name}!</h1><div class="max-w-2xl mx-auto mb-8 px-4"><p class="text-xs md:text-sm text-slate-600 mb-2">Type what you do and do not want to eat</p><input id="prefWel" placeholder="INCLUDE, for example chicken pasta" value="${prefs.wel||''}" class="w-full p-3 mb-2 border-2 rounded-xl text-sm"><input id="prefNiet" placeholder="EXCLUDE, for example fish nuts" value="${prefs.niet||''}" class="w-full p-3 mb-3 border-2 rounded-xl text-sm"><button onclick="savePrefs()" class="bg-green-600 text-white px-6 py-2 rounded-xl font-bold text-sm">Save</button></div><div class="flex justify-center items-center gap-4 mb-8"><span class="text-base md:text-lg font-bold">People</span><button onclick="servings=Math.max(1,servings-1);render()" class="w-12 h-12 bg-orange-100 rounded-xl font-bold text-xl">−</button><span class="text-2xl md:text-3xl font-black">${servings}</span><button onclick="servings++;render()" class="w-12 h-12 bg-orange-100 rounded-xl font-bold text-xl">+</button></div><button onclick="showGenerateDialog()" class="bg-orange-600 text-white px-8 md:px-12 py-4 md:py-6 rounded-2xl font-black text-base md:text-xl shadow-xl mx-4">Generate Meal Plan</button></div>${currentMenu.length?renderMenu():''}</div>`} else if(view==='saved'){const saved=db.savedMenus[currentUser.email]?.recipes||[];app.innerHTML=`${renderNav()}<div class="max-w-6xl mx-auto p-4 py-8 md:py-12"><h1 class="text-3xl md:text-4xl font-black mb-8">Saved Meal Plan</h1>${saved.length?`<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6">${saved.map(renderRecipeCard).join('')}</div>`:`<div class="bg-white rounded-3xl p-8 md:p-12 text-center"><p class="text-lg md:text-xl text-slate-500">No saved meal plan yet.</p></div>`}</div>`} else if(view==='shopping'){const saved=db.savedMenus[currentUser.email]?.recipes||[];const menu=saved.length?saved:currentMenu;if(!menu.length){app.innerHTML=`${renderNav()}<div class="max-w-4xl mx-auto p-4 py-8 md:py-12"><div class="bg-white rounded-3xl p-8 md:p-12 text-center"><h1 class="text-3xl md:text-4xl font-black mb-4">Shopping List</h1><p class="text-lg md:text-xl text-slate-500 mb-6">Generate a meal plan first.</p><button onclick="changeView('home')" class="bg-orange-600 text-white px-6 md:px-8 py-3 md:py-4 rounded-xl font-bold">Go to Home</button></div></div>`;return}const all=[];menu.forEach(r=>r.ingr.split('\n').forEach(i=>all.push(i)));app.innerHTML=`${renderNav()}<div class="max-w-4xl mx-auto p-4 py-8 md:py-12"><div class="bg-white rounded-3xl p-6 md:p-8 shadow-xl"><div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 mb-6"><div><h1 class="text-3xl md:text-4xl font-black mb-2">Shopping List</h1><p class="text-sm md:text-base text-slate-600">For ${servings} people · ${menu.length} recipes</p></div><button onclick="copyShoppingList()" class="w-full md:w-auto bg-orange-600 text-white px-6 py-3 rounded-xl font-bold whitespace-nowrap">Copy</button></div><div class="bg-slate-50 p-4 md:p-6 rounded-2xl"><h2 class="text-lg md:text-xl font-bold mb-4">All ingredients (${all.length})</h2><ul class="space-y-2">${all.map(i=>`<li class="flex items-start gap-3 p-2 hover:bg-white rounded-lg transition-colors"><input type="checkbox" class="w-5 h-5 mt-0.5 accent-orange-600 flex-shrink-0"><span class="flex-1 text-sm md:text-base">${i}</span></li>`).join('')}</ul></div></div></div>`} else if(view==='myrecipes'){app.innerHTML=`${renderNav()}<div class="max-w-6xl mx-auto p-4 py-8 md:py-12"><div class="bg-white rounded-3xl p-8 md:p-12 text-center"><p class="text-lg md:text-xl text-slate-500">Favorite recipes are not enabled in this safe test build.</p></div></div>`}bindHelpers()}
function bindHelpers(){window.showLogin=()=>{document.getElementById('loginForm')?.classList.remove('hidden');document.getElementById('registerForm')?.classList.add('hidden')};window.showRegister=()=>{document.getElementById('loginForm')?.classList.add('hidden');document.getElementById('registerForm')?.classList.remove('hidden')}}
function setupPWA(){window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('installContainer')?.classList.remove('hidden')});document.getElementById('installBtn')?.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById('installContainer')?.classList.add('hidden')});if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(console.error)}
(function init(){try{document.getElementById('bootStatus').textContent='Starting app…'}catch{}const users=db.users;if(!users.find(u=>u.email==='admin@mealplanner.app')){users.push({name:'Admin',email:'admin@mealplanner.app',password:'admin123',isAdmin:true,registeredAt:new Date().toISOString(),lastLogin:new Date().toISOString(),loginCount:0});db.set('users',users)}try{currentUser=JSON.parse(localStorage.getItem('currentUser')||'null')}catch(e){currentUser=null;localStorage.removeItem('currentUser')}view=currentUser?'home':'info';setupPWA();render()})()
</script>
</body>
