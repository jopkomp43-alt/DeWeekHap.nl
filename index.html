<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>De Weekhap - Weekmenu Generator</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;900&display=swap');
body { font-family: 'Outfit', sans-serif; }
</style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-200 min-h-screen">

<div id="app"></div>

<script>
const RECIPES = [
  {id:'r1',title:'Spaghetti Carbonara',img:'https://images.unsplash.com/photo-1612874742237-6526221588e3?w=400',ingr:'400g spaghetti||200g spek||4 eieren||100g parmezaan||Zout en peper',steps:'Kook pasta volgens verpakking||Bak spek krokant||Klop eieren met kaas||Meng warme pasta met spek en ei-mengsel||Breng op smaak met peper',cat:'Italiaans',author:'admin'},
  {id:'r2',title:'Thaise Rode Curry',img:'https://images.unsplash.com/photo-1455619452474-d2be8b1e70cd?w=400',ingr:'400ml kokosmelk||3el currypasta||300g kip||1 paprika||100g taugé||Basmati rijst',steps:'Bak currypasta in pan||Voeg kokosmelk toe||Breng aan de kook||Voeg kip en groenten toe||Laat 15 min sudderen||Serveer met rijst',cat:'Aziatisch',author:'admin'},
  {id:'r3',title:'Klassieke Lasagne',img:'https://images.unsplash.com/photo-1574894709920-11b28e7367e3?w=400',ingr:'12 lasagne vellen||500g rundergehakt||1 ui||2 blikjes tomatensaus||500ml bechamel||200g kaas||Olijfolie',steps:'Bak gehakt met ui||Voeg tomatensaus toe||Laag lasagnevellen, gehaktsaus, bechamel||Herhaal lagen||Eindig met kaas||Bak 40 min op 180°C',cat:'Italiaans',author:'admin'},
  {id:'r4',title:'Gegrilde Zalm',img:'https://images.unsplash.com/photo-1467003909585-2f8a72700288?w=400',ingr:'4 zalmfilets||2 citroenen||3 el olijfolie||Verse dille||500g aardappelen||Broccoli',steps:'Marineer zalm met citroen, olie en dille||Gril 6-8 min per kant||Kook aardappelen||Stoom broccoli||Serveer samen',cat:'Vis',author:'admin'},
  {id:'r5',title:'Vegetarische Chili',img:'https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?w=400',ingr:'2 blikken kidneybonen||1 blik maïs||2 paprikas||1 ui||3 teentjes knoflook||Chilipoeder||1 blik tomatenblokjes',steps:'Fruit ui en knoflook||Voeg paprika, bonen, maïs toe||Voeg tomaat toe||Kruid met chili||Laat 20 min sudderen||Serveer met rijst',cat:'Vegetarisch',author:'admin'},
  {id:'r6',title:'Kippensoep',img:'https://images.unsplash.com/photo-1547592166-23ac45744acd?w=400',ingr:'500g kip||2 liter bouillon||3 wortels||2 preistengels||Vermicelli||Verse peterselie',steps:'Kook kip in bouillon tot gaar||Voeg gesneden groenten toe||Kook 15 min||Voeg vermicelli toe laatste 5 min||Garneer met peterselie',cat:'Soep',author:'admin'},
  {id:'r7',title:'Caesar Salade',img:'https://images.unsplash.com/photo-1546793665-c74683f339c1?w=400',ingr:'1 krop romaine sla||200g kipfilet||100g croutons||50g parmezaan||Caesar dressing||Ansjovis',steps:'Gril kipfilet en snijd in plakken||Was en snijd sla||Meng sla met dressing||Voeg kip, croutons toe||Rasp parmezaan erover||Garneer met ansjovis',cat:'Salade',author:'admin'},
  {id:'r8',title:'Nasi Goreng',img:'https://images.unsplash.com/photo-1603133872878-684f208fb84b?w=400',ingr:'400g rijst||2 eieren||200g kip||1 ui||2 teentjes knoflook||Nasi kruiden||Sambal||Atjar',steps:'Kook rijst en laat afkoelen||Bak roerei, haal eruit||Bak kip met ui en knoflook||Voeg rijst en kruiden toe||Meng alles||Serveer met ei en atjar',cat:'Aziatisch',author:'admin'}
];

let mealDBCache = [];
let mealDBLoading = false;

async function fetchMealDBRecipes() {
  if (mealDBLoading) return;
  mealDBLoading = true;
  try {
    const promises = [];
    for (let i = 0; i < 20; i++) {
      promises.push(fetch('https://www.themealdb.com/api/json/v1/1/random.php'));
    }
    const responses = await Promise.all(promises);
    const data = await Promise.all(responses.map(r => r.json()));
    const meals = data.filter(d => d.meals && d.meals[0]).map(d => d.meals[0]).map(meal => {
      const ingredients = [];
      for (let i = 1; i <= 20; i++) {
        const ingredient = meal[`strIngredient${i}`];
        const measure = meal[`strMeasure${i}`];
        if (ingredient && ingredient.trim()) ingredients.push(`${measure || ''} ${ingredient}`.trim());
      }
      const steps = meal.strInstructions.split('.').map(s => s.trim()).filter(s => s.length > 10).slice(0, 7);
      return {id: 'mdb' + meal.idMeal, title: meal.strMeal, img: meal.strMealThumb, ingr: ingredients.join('||'), steps: steps.join('||'), cat: meal.strCategory || 'Internationaal', author: 'TheMealDB', source: 'mealdb'};
    });
    mealDBCache = meals;
    mealDBLoading = false;
    return meals;
  } catch (error) {
    console.error('Fout bij laden TheMealDB:', error);
    mealDBLoading = false;
    return [];
  }
}

const db = {
  get: (key) => JSON.parse(localStorage.getItem(key) || 'null'),
  set: (key, val) => localStorage.setItem(key, JSON.stringify(val)),
  users: () => db.get('users') || [],
  recipes: () => {
    const approved = db.get('approvedRecipes') || [];
    return [...RECIPES, ...approved, ...mealDBCache];
  },
  pendingRecipes: () => db.get('pendingRecipes') || [],
  reviews: () => db.get('reviews') || {},
  savedMenus: () => db.get('savedMenus') || {},
  savedRecipes: () => db.get('savedRecipes') || {},
  preferences: () => db.get('userPreferences') || {}
};

let currentUser = db.get('currentUser');
let view = currentUser ? 'home' : 'login';
let servings = 2;
let currentMenu = [];
let lastGeneratedIds = [];
let mobileMenuOpen = false;

function shuffleArray(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function filterByPrefs(recipes) {
  const prefs = db.preferences()[currentUser.email];
  if (!prefs || (!prefs.wel && !prefs.niet)) return recipes;
  
  return recipes.filter(r => {
    const txt = `${r.title} ${r.cat} ${r.ingr}`.toLowerCase();
    if (prefs.niet && prefs.niet.split(' ').some(w => txt.includes(w.toLowerCase()))) return false;
    if (prefs.wel && !prefs.wel.split(' ').some(w => txt.includes(w.toLowerCase()))) return false;
    return true;
  });
}

function render() {
  const app = document.getElementById('app');
  
  if (view === 'login') {
    app.innerHTML = `
      <div class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 md:p-10 shadow-2xl max-w-md w-full">
          <div class="w-20 h-20 bg-orange-600 rounded-2xl flex items-center justify-center mx-auto mb-6 text-white text-3xl font-black">W</div>
          <h1 class="text-3xl md:text-4xl font-black text-center mb-8">De Weekhap</h1>
          <div id="loginForm">
            <input id="email" type="email" placeholder="Email" class="w-full p-4 mb-3 border-2 rounded-xl" />
            <input id="password" type="password" placeholder="Wachtwoord" class="w-full p-4 mb-4 border-2 rounded-xl" />
            <button onclick="login()" class="w-full bg-orange-600 text-white p-4 rounded-xl font-bold mb-3 hover:bg-orange-700">Inloggen</button>
            <button onclick="showRegister()" class="w-full bg-slate-200 text-slate-700 p-4 rounded-xl font-bold hover:bg-slate-300">Registreren</button>
          </div>
          <div id="registerForm" class="hidden">
            <input id="regName" type="text" placeholder="Naam" class="w-full p-4 mb-3 border-2 rounded-xl" />
            <input id="regEmail" type="email" placeholder="Email" class="w-full p-4 mb-3 border-2 rounded-xl" />
            <input id="regPassword" type="password" placeholder="Wachtwoord" class="w-full p-4 mb-4 border-2 rounded-xl" />
            <button onclick="register()" class="w-full bg-orange-600 text-white p-4 rounded-xl font-bold mb-3 hover:bg-orange-700">Account Aanmaken</button>
            <button onclick="showLogin()" class="w-full bg-slate-200 text-slate-700 p-4 rounded-xl font-bold hover:bg-slate-300">Terug</button>
          </div>
          <p class="text-center mt-6 text-sm text-slate-500">Admin: admin@weekhap.nl | admin123</p>
        </div>
      </div>
    `;
  } else if (view === 'home') {
    const prefs = db.preferences()[currentUser.email] || {};
    const allRecipes = db.recipes();
    const filtered = filterByPrefs(allRecipes);
    
    app.innerHTML = `
      ${renderNav()}
      <div class="max-w-6xl mx-auto p-4 py-12">
        <div class="text-center py-12 bg-white rounded-3xl shadow-xl mb-12">
          <h1 class="text-5xl font-black mb-4">Welkom! 👋</h1>
          
          <!-- VOORKEUREN VELD -->
          <div class="max-w-2xl mx-auto mb-8 px-4">
            <p class="text-sm text-slate-600 mb-2">💡 Typ wat je WEL/NIET wilt eten (bijv: "kip pasta", "geen vis noten")</p>
            <input 
              id="prefWel" 
              placeholder="Wat wil je WEL? (bijv: kip vegetarisch)" 
              value="${prefs.wel || ''}" 
              class="w-full p-3 mb-2 border-2 rounded-xl text-sm"
            />
            <input 
              id="prefNiet" 
              placeholder="Wat wil je NIET? (bijv: vis garnalen)" 
              value="${prefs.niet || ''}" 
              class="w-full p-3 mb-3 border-2 rounded-xl text-sm"
            />
            <button onclick="savePrefs()" class="bg-green-600 text-white px-6 py-2 rounded-xl font-bold hover:bg-green-700 text-sm">💾 Opslaan</button>
          </div>
          
          <p class="text-xl text-slate-600 mb-8">Kies uit <span class="text-orange-600 font-black">${filtered.length} recepten</span></p>
          
          <div class="flex justify-center items-center gap-4 mb-8">
            <span class="text-lg font-bold">Personen:</span>
            <button onclick="servings=Math.max(1,servings-1);render()" class="w-12 h-12 bg-orange-100 rounded-xl font-bold text-xl hover:bg-orange-200">−</button>
            <span class="text-3xl font-black">${servings}</span>
            <button onclick="servings++;render()" class="w-12 h-12 bg-orange-100 rounded-xl font-bold text-xl hover:bg-orange-200">+</button>
          </div>
          
          <button onclick="generateMenu()" class="bg-gradient-to-r from-orange-600 to-orange-700 text-white px-12 py-6 rounded-2xl font-black text-xl shadow-xl hover:scale-105 transition-all">🍽️ Genereer Weekmenu</button>
        </div>
        ${currentMenu.length > 0 ? renderMenu() : ''}
      </div>
    `;
  }
}

function savePrefs() {
  const wel = document.getElementById('prefWel').value.trim();
  const niet = document.getElementById('prefNiet').value.trim();
  const allPrefs = db.preferences();
  allPrefs[currentUser.email] = {wel, niet};
  db.set('userPreferences', allPrefs);
  alert('✅ Voorkeuren opgeslagen!');
  render();
}

function renderNav() {
  return `
    <nav class="bg-white/90 backdrop-blur border-b sticky top-0 z-50">
      <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-orange-600 rounded-xl flex items-center justify-center text-white font-black">W</div>
          <span class="font-black text-xl">De Weekhap</span>
        </div>
        <button onclick="logout()" class="px-4 py-2 rounded-lg font-bold bg-slate-200 hover:bg-slate-300">Uitloggen</button>
      </div>
    </nav>
  `;
}

function renderMenu() {
  return `
    <div>
      <h2 class="text-4xl font-black mb-8">Jouw Weekmenu 📅</h2>
      <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
        ${currentMenu.map(r => `
          <div class="bg-white rounded-2xl p-4 shadow-xl">
            <img src="${r.img}" class="w-full h-40 object-cover rounded-xl mb-3" />
            <h3 class="font-black text-lg mb-1">${r.title}</h3>
            <span class="bg-orange-100 text-orange-800 px-2 py-1 rounded-full text-xs font-semibold">${r.cat}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function showLogin() {
  document.getElementById('loginForm').classList.remove('hidden');
  document.getElementById('registerForm').classList.add('hidden');
}

function showRegister() {
  document.getElementById('loginForm').classList.add('hidden');
  document.getElementById('registerForm').classList.remove('hidden');
}

function login() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  if (!email || !password) return alert('⚠️ Vul alle velden in');
  const users = db.users();
  const user = users.find(u => u.email === email && u.password === password);
  if (!user) return alert('❌ Verkeerde inloggegevens');
  currentUser = user;
  db.set('currentUser', user);
  view = 'home';
  fetchMealDBRecipes().then(() => render());
}

function register() {
  const name = document.getElementById('regName').value;
  const email = document.getElementById('regEmail').value;
  const password = document.getElementById('regPassword').value;
  if (!name || !email || !password) return alert('⚠️ Vul alle velden in');
  const users = db.users();
  if (users.find(u => u.email === email)) return alert('❌ Email al in gebruik');
  const newUser = { name, email, password, isAdmin: false };
  users.push(newUser);
  db.set('users', users);
  currentUser = newUser;
  db.set('currentUser', newUser);
  view = 'home';
  fetchMealDBRecipes().then(() => render());
}

function logout() {
  currentUser = null;
  db.set('currentUser', null);
  view = 'login';
  render();
}

async function generateMenu() {
  const days = ['Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag','Zondag'];
  const filtered = filterByPrefs(db.recipes());
  if (filtered.length < 7) return alert(`⚠️ Niet genoeg recepten met jouw voorkeuren (${filtered.length} beschikbaar)`);
  const shuffled = shuffleArray(filtered);
  currentMenu = shuffled.slice(0, 7).map((r,i) => ({...r, day: days[i]}));
  render();
}

const users = db.users();
if (!users.find(u => u.email === 'admin@weekhap.nl')) {
  users.push({ name: 'Admin', email: 'admin@weekhap.nl', password: 'admin123', isAdmin: true });
  db.set('users', users);
}

if (currentUser) {
  fetchMealDBRecipes().then(() => render());
} else {
  render();
}
</script>
</body>
</html>
