<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uit Werking | Deel & Plan Je Menu</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .recipe-gradient { background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.8) 100%); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .animate-pop { animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body class="bg-gray-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- ICON COMPONENT ---
        const Icon = ({ name, size = 20, className = "", fill = "none" }) => {
            useEffect(() => { lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size, strokeWidth: 2.5 }}></i>;
        };

        const SUBSCRIPTION_PRICE = 2.99;

        // --- DATA ---
        const recipesPool = {
            italian: [
                { title: "Romige Pesto Penne", ingredients: ["200g Penne", "100g Pesto", "Kipblokjes", "Cherrytomatjes"], instructions: ["Kook de pasta.", "Bak de kip.", "Meng alles met pesto."], image: "https://images.unsplash.com/photo-1551183053-bf91a1d81141?w=600&q=80" },
                { title: "Snelle Gnocchi Bak", ingredients: ["500g Gnocchi", "Spinazie", "Gorgonzola", "Walnoten"], instructions: ["Bak gnocchi goudbruin.", "Voeg spinazie toe.", "Smelt de kaas erover."], image: "https://images.unsplash.com/photo-1626844131082-256783844137?w=600&q=80" }
            ],
            asian: [
                { title: "Teriyaki Wok", ingredients: ["Rijst", "Wokgroenten", "Biefstukreepjes", "Teriyaki saus"], instructions: ["Kook rijst.", "Wok vlees en groente.", "Blus af met saus."], image: "https://images.unsplash.com/photo-1585032226651-759b368d7246?w=600&q=80" }
            ]
        };

        function App() {
            const [view, setView] = useState('home');
            const [user, setUser] = useState(() => JSON.parse(localStorage.getItem('uw_user')) || null);
            const [generated, setGenerated] = useState(() => JSON.parse(localStorage.getItem('uw_gen')) || []);
            const [saved, setSaved] = useState(() => JSON.parse(localStorage.getItem('uw_fav')) || []);
            const [community, setCommunity] = useState(() => JSON.parse(localStorage.getItem('uw_comm')) || []);
            const [wallet, setWallet] = useState(() => parseFloat(localStorage.getItem('uw_wallet')) || 0.0);
            const [selected, setSelected] = useState(null);
            const [loading, setLoading] = useState(false);

            // Form State
            const [formData, setFormData] = useState({ title: '', category: 'italian', ingredients: '', instructions: '', image: '' });

            useEffect(() => { localStorage.setItem('uw_user', JSON.stringify(user)); }, [user]);
            useEffect(() => { localStorage.setItem('uw_gen', JSON.stringify(generated)); }, [generated]);
            useEffect(() => { localStorage.setItem('uw_fav', JSON.stringify(saved)); }, [saved]);
            useEffect(() => { localStorage.setItem('uw_comm', JSON.stringify(community)); }, [community]);
            useEffect(() => { localStorage.setItem('uw_wallet', wallet.toString()); }, [wallet]);

            const generateMenu = () => {
                setLoading(true);
                setTimeout(() => {
                    const keys = Object.keys(recipesPool);
                    const results = Array.from({length: 3}, () => {
                        const cat = keys[Math.floor(Math.random() * keys.length)];
                        const pool = recipesPool[cat];
                        const r = pool[Math.floor(Math.random() * pool.length)];
                        return { ...r, id: Math.random().toString(36).substr(2, 9), category: cat, time: "15-20 min", price: (Math.random() * 5 + 3).toFixed(2) };
                    });
                    setGenerated(results);
                    setLoading(false);
                }, 1000);
            };

            const toggleFav = (r) => {
                if (saved.find(s => s.id === r.id)) setSaved(saved.filter(s => s.id !== r.id));
                else setSaved([...saved, r]);
            };

            const handleShare = (e) => {
                e.preventDefault();
                const newRecipe = {
                    ...formData,
                    id: Math.random().toString(36).substr(2, 9),
                    ingredients: formData.ingredients.split(',').map(i => i.trim()),
                    instructions: formData.instructions.split('\n').map(i => i.trim()),
                    image: formData.image || "https://images.unsplash.com/photo-1495521821757-a1efb6729352?w=600&q=80",
                    isCommunity: true,
                    author: user ? user.name : "Anoniem",
                    time: "30 min",
                    price: "4.50"
                };
                setCommunity([newRecipe, ...community]);
                setWallet(prev => prev + 1.00);
                setFormData({ title: '', category: 'italian', ingredients: '', instructions: '', image: '' });
                setView('home');
                alert('Bedankt! Je recept is gedeeld. Er is €1,00 toegevoegd aan je wallet.');
            };

            return (
                <div className="max-w-md mx-auto min-h-screen bg-white shadow-2xl flex flex-col relative overflow-hidden">
                    
                    {/* Header */}
                    <header className="px-6 py-4 flex justify-between items-center bg-white/80 backdrop-blur-md sticky top-0 z-30 border-b border-gray-100">
                        <div className="flex items-center gap-2" onClick={() => setView('home')}>
                            <div className="bg-green-600 text-white p-1.5 rounded-lg shadow-sm">
                                <Icon name="utensils" size={18} />
                            </div>
                            <span className="font-extrabold text-lg tracking-tight text-slate-800">Uit Werking</span>
                        </div>
                        <div className="flex items-center gap-3">
                            <div className="flex items-center gap-1 bg-blue-50 px-2 py-1 rounded-full border border-blue-100">
                                <Icon name="wallet" size={12} className="text-blue-500" />
                                <span className="text-[10px] font-bold text-blue-600">€{wallet.toFixed(2)}</span>
                            </div>
                            {!user && <button onClick={() => setView('login')} className="text-xs font-bold text-green-600">Login</button>}
                        </div>
                    </header>

                    {/* Views */}
                    <main className="flex-1 pb-28">
                        {view === 'home' && (
                            <div className="animate-fade-in">
                                <div className="p-6 bg-slate-900 text-white rounded-b-[2.5rem] shadow-xl mb-8 relative overflow-hidden">
                                    <div className="absolute top-0 right-0 w-32 h-32 bg-green-500/20 blur-3xl rounded-full -mr-16 -mt-16"></div>
                                    <h1 className="text-3xl font-extrabold mb-2 relative z-10">Lekker & Simpel.</h1>
                                    <p className="text-slate-400 text-sm mb-6 relative z-10 leading-relaxed">Deel je eigen creaties of laat ons je week plannen.</p>
                                    <div className="flex gap-3">
                                        <button onClick={generateMenu} className="flex-1 bg-green-500 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 flex items-center justify-center gap-2">
                                            <Icon name="zap" fill="currentColor" size={18} /> Plan Menu
                                        </button>
                                        <button onClick={() => setView('share')} className="bg-white/10 text-white font-bold py-4 px-6 rounded-2xl border border-white/20 active:scale-95">
                                            <Icon name="plus" size={20} />
                                        </button>
                                    </div>
                                </div>

                                {/* Community Sectie */}
                                {community.length > 0 && (
                                    <div className="px-6 mb-8">
                                        <h2 className="font-bold text-slate-800 mb-4 flex items-center gap-2">
                                            <Icon name="users" size={16} className="text-blue-500" />
                                            Nieuw van de Community
                                        </h2>
                                        <div className="flex gap-4 overflow-x-auto no-scrollbar pb-2">
                                            {community.map(r => (
                                                <div key={r.id} onClick={() => setSelected(r)} className="min-w-[140px] bg-white border border-slate-100 rounded-2xl overflow-hidden shadow-sm">
                                                    <img src={r.image} className="w-full h-24 object-cover" />
                                                    <div className="p-2">
                                                        <h3 className="font-bold text-[11px] truncate">{r.title}</h3>
                                                        <p className="text-[9px] text-slate-400">Door {r.author}</p>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <div className="px-6 space-y-4">
                                    {generated.length > 0 && (
                                        <>
                                            <div className="flex justify-between items-center">
                                                <h2 className="font-bold text-slate-800">Suggesties voor jou</h2>
                                            </div>
                                            {generated.map(r => (
                                                <div key={r.id} onClick={() => setSelected(r)} className="bg-white border border-slate-100 rounded-3xl overflow-hidden flex items-center p-2 gap-4 cursor-pointer hover:border-green-200 shadow-sm">
                                                    <img src={r.image} className="w-20 h-20 rounded-2xl object-cover" />
                                                    <div className="flex-1 min-w-0">
                                                        <h3 className="font-bold text-sm text-slate-800 truncate">{r.title}</h3>
                                                        <div className="flex items-center gap-2 mt-1">
                                                            <div className="text-[10px] font-bold text-green-600">€{r.price}</div>
                                                        </div>
                                                    </div>
                                                    <button onClick={(e) => { e.stopPropagation(); toggleFav(r); }} className="p-3">
                                                        <Icon name="heart" size={20} className={saved.find(s => s.id === r.id) ? "text-red-500 fill-red-500" : "text-slate-200"} />
                                                    </button>
                                                </div>
                                            ))}
                                        </>
                                    )}
                                </div>
                            </div>
                        )}

                        {view === 'share' && (
                            <div className="p-6 animate-fade-in">
                                <div className="flex items-center gap-3 mb-6">
                                    <button onClick={() => setView('home')} className="p-2 bg-slate-100 rounded-full text-slate-500"><Icon name="chevron-left" /></button>
                                    <h2 className="text-2xl font-extrabold text-slate-800">Recept Delen</h2>
                                </div>
                                <div className="bg-blue-50 border border-blue-100 p-4 rounded-2xl mb-6 flex gap-3 items-center">
                                    <div className="bg-blue-500 text-white p-2 rounded-xl"><Icon name="gift" size={18} /></div>
                                    <p className="text-blue-700 text-xs font-bold leading-tight">Verdien €1,00 korting per goedgekeurd recept!</p>
                                </div>
                                <form onSubmit={handleShare} className="space-y-4">
                                    <div>
                                        <label className="text-[10px] font-bold uppercase text-slate-400 ml-1">Titel</label>
                                        <input required value={formData.title} onChange={e => setFormData({...formData, title: e.target.value})} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:border-green-500 outline-none" placeholder="Bijv. Oma's Gehaktballen" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-[10px] font-bold uppercase text-slate-400 ml-1">Keuken</label>
                                            <select value={formData.category} onChange={e => setFormData({...formData, category: e.target.value})} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm outline-none">
                                                <option value="italian">Italiaans</option>
                                                <option value="asian">Aziatisch</option>
                                                <option value="mexican">Mexicaans</option>
                                                <option value="dutch">Hollands</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-bold uppercase text-slate-400 ml-1">Foto Link (Optioneel)</label>
                                            <input value={formData.image} onChange={e => setFormData({...formData, image: e.target.value})} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm outline-none" placeholder="URL naar afbeelding" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold uppercase text-slate-400 ml-1">Ingrediënten (gescheiden door komma's)</label>
                                        <input required value={formData.ingredients} onChange={e => setFormData({...formData, ingredients: e.target.value})} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm outline-none" placeholder="200g kip, 1 ui, etc." />
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold uppercase text-slate-400 ml-1">Bereidingswijze (stap voor stap)</label>
                                        <textarea required value={formData.instructions} onChange={e => setFormData({...formData, instructions: e.target.value})} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm outline-none h-32" placeholder="Stap 1: Snijd de ui...&#10;Stap 2: Bak de kip..."></textarea>
                                    </div>
                                    <button type="submit" className="w-full bg-green-600 text-white font-extrabold py-4 rounded-2xl shadow-lg active:scale-95 transition-all">Deel Recept & Ontvang €1,00</button>
                                </form>
                            </div>
                        )}

                        {view === 'favorites' && (
                            <div className="p-6 animate-fade-in">
                                <h2 className="text-2xl font-extrabold text-slate-800 mb-6">Mijn Kookboek</h2>
                                {saved.length > 0 ? (
                                    <div className="grid grid-cols-1 gap-4">
                                        {saved.map(r => (
                                            <div key={r.id} onClick={() => setSelected(r)} className="bg-white border border-slate-100 rounded-3xl overflow-hidden shadow-sm flex p-2 gap-4">
                                                <img src={r.image} className="w-16 h-16 rounded-2xl object-cover" />
                                                <div className="flex-1 flex flex-col justify-center">
                                                    <h3 className="font-bold text-sm text-slate-800">{r.title}</h3>
                                                    <span className="text-[10px] text-slate-400 uppercase font-bold">{r.category}</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="text-center py-20 bg-slate-50 rounded-[2rem] border-2 border-dashed border-slate-100">
                                        <Icon name="heart" size={40} className="mx-auto text-slate-200 mb-4" />
                                        <p className="text-slate-400 text-sm font-medium">Je kookboek is nog leeg.</p>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* Modal */}
                    {selected && (
                        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
                            <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onClick={() => setSelected(null)}></div>
                            <div className="bg-white rounded-t-[3rem] sm:rounded-[3rem] w-full max-w-sm relative overflow-hidden animate-pop max-h-[90vh] flex flex-col">
                                <div className="h-56 relative shrink-0">
                                    <img src={selected.image} className="w-full h-full object-cover" />
                                    <div className="absolute inset-0 recipe-gradient"></div>
                                    <button onClick={() => setSelected(null)} className="absolute top-6 right-6 bg-black/20 backdrop-blur-md text-white p-2 rounded-full">
                                        <Icon name="x" size={20} />
                                    </button>
                                    <div className="absolute bottom-6 left-6 right-6">
                                        <h2 className="text-2xl font-extrabold text-white leading-tight">{selected.title}</h2>
                                        {selected.isCommunity && <p className="text-green-400 text-[10px] font-bold uppercase mt-1">Gedeeld door {selected.author}</p>}
                                    </div>
                                </div>
                                <div className="p-8 overflow-y-auto no-scrollbar">
                                    <div className="flex gap-4 mb-6 border-b pb-4 border-slate-50">
                                        <div className="flex flex-col items-center flex-1">
                                            <span className="text-[9px] font-bold text-slate-400 uppercase tracking-tighter">Bereiding</span>
                                            <span className="text-xs font-bold text-slate-700">{selected.time}</span>
                                        </div>
                                        <div className="flex flex-col items-center flex-1">
                                            <span className="text-[9px] font-bold text-slate-400 uppercase tracking-tighter">Prijs p.p.</span>
                                            <span className="text-xs font-bold text-green-600">€{selected.price}</span>
                                        </div>
                                    </div>
                                    <h3 className="font-bold text-slate-800 mb-3 text-sm">Ingrediënten</h3>
                                    <ul className="space-y-2 mb-6">
                                        {selected.ingredients.map((ing, i) => (
                                            <li key={i} className="flex items-center gap-3 text-slate-600 text-xs">
                                                <div className="w-1 h-1 rounded-full bg-slate-300"></div>{ing}
                                            </li>
                                        ))}
                                    </ul>
                                    <h3 className="font-bold text-slate-800 mb-3 text-sm">Bereiding</h3>
                                    <div className="space-y-4 mb-8">
                                        {selected.instructions && selected.instructions.map((step, i) => (
                                            <div key={i} className="flex gap-3 text-xs leading-relaxed text-slate-500">
                                                <span className="font-bold text-green-600">{i+1}.</span>
                                                <p>{step}</p>
                                            </div>
                                        ))}
                                    </div>
                                    <button 
                                        onClick={() => { alert('Je wordt doorgestuurd naar de supermarkt! (Link via LinkPizza)'); setSelected(null); }}
                                        className="w-full bg-slate-900 text-white font-extrabold py-4 rounded-2xl flex items-center justify-center gap-2 active:scale-95 transition-all"
                                    >
                                        Bestel Ingrediënten <Icon name="arrow-right" size={18}/>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Navigation */}
                    <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/95 backdrop-blur-lg border-t border-slate-100 p-4 px-8 flex justify-between items-center z-40">
                        <button onClick={() => setView('home')} className={`flex flex-col items-center gap-1 transition-all ${view === 'home' ? 'text-green-600 scale-110' : 'text-slate-300'}`}>
                            <Icon name="home" size={22} fill={view === 'home' ? "currentColor" : "none"} />
                            <span className="text-[9px] font-bold uppercase">Ontdek</span>
                        </button>
                        <button onClick={() => setView('share')} className={`flex flex-col items-center -mt-10 transition-all`}>
                            <div className={`w-14 h-14 rounded-full flex items-center justify-center shadow-lg border-4 border-white active:scale-90 transition-all ${view === 'share' ? 'bg-green-600 text-white rotate-45' : 'bg-slate-900 text-white'}`}>
                                <Icon name="plus" size={28} />
                            </div>
                            <span className="text-[9px] font-extrabold mt-1 text-slate-500 uppercase">Delen</span>
                        </button>
                        <button onClick={() => setView('favorites')} className={`flex flex-col items-center gap-1 transition-all ${view === 'favorites' ? 'text-red-500 scale-110' : 'text-slate-300'}`}>
                            <Icon name="heart" size={22} fill={view === 'favorites' ? "currentColor" : "none"} />
                            <span className="text-[9px] font-bold uppercase">Bewaard</span>
                        </button>
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
