<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weekly Meal Planner PWA</title>
  <meta name="description" content="Generate a weekly meal plan with recipes, shopping lists, saved menus, reviews, and community recipe sharing." />
  <meta name="theme-color" content="#ea580c" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Meal Planner" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #ea580c;
      --accent-dark: #c2410c;
      --line: #e2e8f0;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; font-family: Inter, system-ui, sans-serif; background: linear-gradient(135deg,#f8fafc,#e2e8f0); color: var(--text); }
    .recipe-card { animation: slideIn .25s ease-out; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .mobile-menu { display: none; }
    .mobile-menu.active { display: block; }
    .modal-inner { display: flex; flex-direction: column; max-height: 90vh; overflow: hidden; }
    .modal-scrollable { overflow-y: auto; flex: 1; }
    .tab-navigation { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.95); backdrop-filter: blur(12px); }
    .install-pill { position: fixed; right: 16px; bottom: 16px; z-index: 60; }
    .modal-close-btn { min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: #f1f5f9; font-size: 1.5rem; color: #64748b; border: none; }
    .modal-tab-btn { flex: 1; min-width: 0; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: .75rem; padding: .65rem .35rem; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(12px);} to { opacity: 1; transform: translateY(0);} }
    @media (min-width: 769px){ .mobile-menu-btn { display:none!important; } }
    @media (max-width: 768px){ .desktop-nav { display:none!important; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="installContainer" class="install-pill hidden">
    <button id="installBtn" class="bg-orange-600 hover:bg-orange-700 text-white px-5 py-3 rounded-2xl shadow-xl font-bold">Install app</button>
  </div>

<script>
let activeTab = 'ingredients';
let mobileMenuOpen = false;
let currentUser = null;
let view = 'info';
let servings = 2;
let currentMenu = [];
let lastGeneratedIds = [];
let deferredPrompt = null;
let mealDBCache = [];
let mealDBLoading = false;

const db = {
  get(key){ try { return JSON.parse(localStorage.getItem(key)) ?? null; } catch { return null; } },
  set(key,val){ localStorage.setItem(key, JSON.stringify(val)); },
  get users(){ return this.get('users') || []; },
  get approvedRecipes(){ return this.get('approvedRecipes') || []; },
  get recipes(){ return [...RECIPES, ...this.approvedRecipes, ...mealDBCache]; },
  get pendingRecipes(){ return this.get('pendingRecipes') || []; },
  get reviews(){ return this.get('reviews') || {}; },
  get savedMenus(){ return this.get('savedMenus') || {}; },
  get savedRecipes(){ return this.get('savedRecipes') || {}; },
  get preferences(){ return this.get('userPreferences') || {}; }
};

const TRANSLATION_MAP = {
  chicken:'chicken', fish:'fish', salmon:'salmon', tuna:'tuna', shrimp:'shrimp', beef:'beef', pork:'pork', lamb:'lamb',
  pasta:'pasta', rice:'rice', potato:'potato', vegetables:'vegetables', vegetarian:'vegetarian', soup:'soup', salad:'salad',
  pizza:'pizza', taco:'taco', noodles:'noodles', curry:'curry', casserole:'casserole', stew:'stew'
};

const RECIPES = [
  {id:'r1',title:'Spaghetti Carbonara',img:'https://images.unsplash.com/photo-1612874742237-6526221588e3?w=800&auto=format&fit=crop',ingr:'400g spaghetti\n200g bacon\n4 eggs\n100g parmesan\nSalt and pepper',steps:'Cook the pasta according to the package\nCook bacon until crispy\nWhisk eggs with parmesan\nMix hot pasta with bacon and egg mixture\nSeason with pepper',cat:'Italian',author:'admin'},
  {id:'r2',title:'Thai Red Curry',img:'https://images.unsplash.com/photo-1455619452474-d2be8b1e70cd?w=800&auto=format&fit=crop',ingr:'400ml coconut milk\n3 tbsp red curry paste\n300g chicken\n1 bell pepper\n100g bean sprouts\nBasmati rice',steps:'Cook curry paste briefly\nAdd coconut milk\nBring to a simmer\nAdd chicken and vegetables\nSimmer for 15 minutes\nServe with rice',cat:'Asian',author:'admin'},
  {id:'r3',title:'Classic Lasagna',img:'https://images.unsplash.com/photo-1574894709920-11b28e7367e3?w=800&auto=format&fit=crop',ingr:'12 lasagna sheets\n500g ground beef\n1 onion\n2 cans tomato sauce\n500ml béchamel\n200g cheese\nOlive oil',steps:'Cook beef with onion\nAdd tomato sauce\nLayer pasta sheets, meat sauce and béchamel\nRepeat layers\nFinish with cheese\nBake 40 minutes at 180°C',cat:'Italian',author:'admin'},
  {id:'r4',title:'Grilled Salmon',img:'https://images.unsplash.com/photo-1467003909585-2f8a72700288?w=800&auto=format&fit=crop',ingr:'4 salmon fillets\n2 lemons\n3 tbsp olive oil\nFresh dill\n500g potatoes\nBroccoli',steps:'Marinate salmon with lemon, oil and dill\nGrill 6 to 8 minutes per side\nBoil potatoes\nSteam broccoli\nServe together',cat:'Fish',author:'admin'},
  {id:'r5',title:'Vegetarian Chili',img:'https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?w=800&auto=format&fit=crop',ingr:'2 cans kidney beans\n1 can corn\n2 bell peppers\n1 onion\n3 garlic cloves\nChili powder\n1 can diced tomatoes',steps:'Cook onion and garlic\nAdd peppers, beans and corn\nAdd tomatoes\nSeason with chili\nSimmer for 20 minutes\nServe with rice',cat:'Vegetarian',author:'admin'},
  {id:'r6',title:'Chicken Soup',img:'https://images.unsplash.com/photo-1547592166-23ac45744acd?w=800&auto=format&fit=crop',ingr:'500g chicken\n2 liters broth\n3 carrots\n2 leeks\nVermicelli\nFresh parsley',steps:'Cook chicken in broth until done\nAdd chopped vegetables\nCook for 15 minutes\nAdd vermicelli for the last 5 minutes\nFinish with parsley',cat:'Soup',author:'admin'},
  {id:'r7',title:'Caesar Salad',img:'https://images.unsplash.com/photo-1546793665-c74683f339c1?w=800&auto=format&fit=crop',ingr:'1 romaine lettuce\n200g chicken breast\n100g croutons\n50g parmesan\nCaesar dressing\nAnchovies',steps:'Grill the chicken and slice it\nWash and chop the lettuce\nToss lettuce with dressing\nAdd chicken and croutons\nTop with parmesan and anchovies',cat:'Salad',author:'admin'},
  {id:'r8',title:'Nasi Goreng',img:'https://images.unsplash.com/photo-1603133872878-684f208fb84b?w=800&auto=format&fit=crop',ingr:'400g rice\n2 eggs\n200g chicken\n1 onion\n2 garlic cloves\nNasi seasoning\nSambal\nPickles',steps:'Cook the rice and let it cool\nMake scrambled eggs and set aside\nCook chicken with onion and garlic\nAdd rice and seasoning\nMix everything together\nServe with egg and pickles',cat:'Asian',author:'admin'},
  {id:'r9',title:'Spare Ribs',img:'https://images.unsplash.com/photo-1544025162-d76694265947?w=800&auto=format&fit=crop',ingr:'1kg spare ribs\nBBQ sauce\nHoney\nGarlic powder\nPaprika powder\nSalt\nPepper',steps:'Marinate the ribs with BBQ sauce and spices\nRest for 2 hours\nBake 1.5 hours at 160°C\nBrush regularly with marinade\nServe with fries',cat:'BBQ',author:'admin'},
  {id:'r10',title:'Quiche Lorraine',img:'https://images.unsplash.com/photo-1601001815894-4bb6c81416d7?w=800&auto=format&fit=crop',ingr:'1 pie crust\n200g bacon\n200ml cream\n3 eggs\n150g cheese\n1 onion\nSalt and pepper',steps:'Place crust in dish\nCook bacon and onion\nWhisk eggs with cream\nSpread bacon over crust\nPour egg mixture on top\nAdd cheese and bake for 35 minutes at 180°C',cat:'French',author:'admin'}
];

function formatDate(dateString){
  const date = new Date(dateString);
  return date.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
}
function formatDateTime(dateString){
  const date = new Date(dateString);
  return date.toLocaleString('en-GB', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
function shuffleArray(array){ const arr=[...array]; for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]];} return arr; }
function closeMobileMenu(){ mobileMenuOpen=false; document.getElementById('mobileMenu')?.classList.remove('active'); }
function toggleMobileMenu(){ mobileMenuOpen=!mobileMenuOpen; document.getElementById('mobileMenu')?.classList.toggle('active', mobileMenuOpen); }
function changeView(v){ view=v; closeMobileMenu(); render(); }
function expandSearchTerm(term){ const lower = (term||'').toLowerCase(); return TRANSLATION_MAP[lower] || term; }
function filterByPrefs(recipes, extraFilter=''){
  const key = currentUser ? currentUser.email : 'guest';
  const prefs = db.preferences[key] || {};
  return recipes.filter(r=>{
    const txt = `${r.title} ${r.cat} ${r.ingr}`.toLowerCase();
    if(extraFilter && !extraFilter.toLowerCase().split(/\s+/).some(word=>txt.includes(expandSearchTerm(word).toLowerCase()))) return false;
    if(prefs.niet && prefs.niet.toLowerCase().split(/\s+/).some(word=>word && txt.includes(expandSearchTerm(word).toLowerCase()))) return false;
    if(prefs.wel){
      const wanted = prefs.wel.toLowerCase().split(/\s+/).filter(Boolean);
      if(wanted.length && !wanted.some(word=>txt.includes(expandSearchTerm(word).toLowerCase()))) return false;
    }
    return true;
  });
}

async function fetchMealDBRecipes(count=20){
  if(mealDBLoading) return [];
  mealDBLoading = true;
  try {
    const calls = Array.from({length: count}, ()=>fetch('https://www.themealdb.com/api/json/v1/1/random.php'));
    const responses = await Promise.all(calls);
    const data = await Promise.all(responses.map(r=>r.json()));
    const meals = data.filter(d=>d.meals && d.meals[0]).map(d=>d.meals[0]).map(meal=>{
      const ingredients=[];
      for(let i=1;i<=20;i++){
        const ingredient = meal[`strIngredient${i}`];
        const measure = meal[`strMeasure${i}`];
        if(ingredient && ingredient.trim()) ingredients.push(`${measure || ''} ${ingredient}`.trim());
      }
      const steps = (meal.strInstructions || '').split('.').map(s=>s.trim()).filter(Boolean).slice(0,7).join('\n');
      return { id:`mdb-${meal.idMeal}`, title:meal.strMeal, img:meal.strMealThumb, ingr:ingredients.join('\n'), steps:steps || 'Follow the original recipe instructions.', cat:meal.strCategory || 'International', author:'TheMealDB', source:'mealdb' };
    });
    meals.forEach(meal=>{ if(!mealDBCache.find(m=>m.id===meal.id)) mealDBCache.push(meal); });
    return meals;
  } catch(e){ console.error('MealDB load failed', e); return []; }
  finally { mealDBLoading = false; }
}

function savePrefs(){
  const wel = document.getElementById('prefWel')?.value.trim() || '';
  const niet = document.getElementById('prefNiet')?.value.trim() || '';
  const all = db.preferences;
  all[currentUser ? currentUser.email : 'guest'] = { wel, niet };
  db.set('userPreferences', all);
  alert('Preferences saved!');
  render();
}

function showGenerateDialog(){
  const modal=document.createElement('div');
  modal.className='fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4';
  modal.onclick=e=>{ if(e.target===modal) modal.remove(); };
  modal.innerHTML=`<div class="bg-white rounded-3xl p-6 md:p-8 max-w-md w-full" onclick="event.stopPropagation()">
    <h2 class="text-2xl md:text-3xl font-black mb-4 text-center">Any special wishes?</h2>
    <p class="text-sm md:text-base text-slate-600 mb-6 text-center">Optional: type what you feel like eating today.</p>
    <div class="bg-orange-50 p-4 rounded-2xl mb-4">
      <p class="text-xs md:text-sm font-bold text-orange-800 mb-2">Examples</p>
      <div class="flex flex-wrap gap-2">
        <button onclick="document.getElementById('extraWish').value='chicken'" class="bg-white px-3 py-1 rounded-full text-xs font-semibold">Chicken</button>
        <button onclick="document.getElementById('extraWish').value='pasta'" class="bg-white px-3 py-1 rounded-full text-xs font-semibold">Pasta</button>
        <button onclick="document.getElementById('extraWish').value='fish'" class="bg-white px-3 py-1 rounded-full text-xs font-semibold">Fish</button>
        <button onclick="document.getElementById('extraWish').value='vegetarian'" class="bg-white px-3 py-1 rounded-full text-xs font-semibold">Vegetarian</button>
        <button onclick="document.getElementById('extraWish').value='soup'" class="bg-white px-3 py-1 rounded-full text-xs font-semibold">Soup</button>
      </div>
    </div>
    <input id="extraWish" type="text" placeholder="For example: chicken, pasta, fish..." class="w-full p-3 md:p-4 mb-4 border-2 rounded-xl text-sm md:text-base" />
    <div class="flex gap-3">
      <button onclick="this.closest('.fixed').remove()" class="flex-1 bg-slate-200 text-slate-700 p-3 md:p-4 rounded-xl font-bold">Cancel</button>
      <button id="btnGenerate" class="flex-1 bg-orange-600 text-white p-3 md:p-4 rounded-xl font-bold">Generate</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
  document.getElementById('btnGenerate').addEventListener('click', async ()=>{ const extraWish=document.getElementById('extraWish').value.trim(); modal.remove(); await generateMenu(extraWish); });
}

async function generateMenu(extraFilter=''){
  const loading=document.createElement('div');
  loading.className='fixed top-20 right-4 bg-orange-600 text-white px-6 py-3 rounded-xl font-bold shadow-xl z-50';
  loading.textContent=extraFilter ? `Searching for ${extraFilter}...` : 'Generating weekly menu...';
  document.body.appendChild(loading);
  let attempts=0;
  while(attempts<10){
    const filtered = filterByPrefs(db.recipes, extraFilter);
    if(filtered.length >= 14) break;
    loading.textContent = 'Loading more recipes...';
    await fetchMealDBRecipes(20);
    attempts++;
  }
  const filtered = filterByPrefs(db.recipes, extraFilter);
  if(filtered.length < 7){ loading.remove(); alert('Not enough recipes found. Try a broader search or different preferences.'); return; }
  const days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  let selected = shuffleArray(filtered).slice(0,7);
  if(lastGeneratedIds.length && filtered.length >= 14 && selected.some(r=>lastGeneratedIds.includes(r.id))) selected = shuffleArray(filtered.filter(r=>!lastGeneratedIds.includes(r.id))).slice(0,7);
  currentMenu = selected.map((r,i)=>({ ...r, day: days[i] }));
  lastGeneratedIds = selected.map(r=>r.id);
  loading.textContent='Weekly menu ready!';
  setTimeout(()=>loading.remove(),1200);
  render();
}

function saveMenu(){
  if(!currentUser){ changeView('login'); return; }
  const menus=db.savedMenus; menus[currentUser.email]={ recipes: currentMenu, date: new Date().toISOString() }; db.set('savedMenus',menus); render();
}
function copyShoppingList(){
  const saved=currentUser ? (db.savedMenus[currentUser.email]?.recipes || []) : [];
  const menu=saved.length ? saved : currentMenu;
  if(!menu.length) return alert('No weekly menu to copy.');
  const items=[]; menu.forEach(r=>r.ingr.split('\n').forEach(ing=>items.push(ing)));
  const text='SHOPPING LIST\n\n'+items.map((ing,i)=>`${i+1}. ${ing}`).join('\n');
  navigator.clipboard.writeText(text).then(()=>alert('Copied to clipboard!'));
}
function copyRecipeIngredients(recipeId){
  const recipe = db.recipes.find(r=>r.id===recipeId); if(!recipe) return;
  const text=`SHOPPING LIST - ${recipe.title}\n\n` + recipe.ingr.split('\n').map((ing,i)=>`${i+1}. ${ing}`).join('\n');
  navigator.clipboard.writeText(text).then(()=>alert('Shopping list copied!'));
}
function toggleSaveRecipe(recipeId,e){
  e.stopPropagation();
  if(!currentUser){ changeView('login'); return; }
  const saved=db.savedRecipes; if(!saved[currentUser.email]) saved[currentUser.email]=[];
  const arr=saved[currentUser.email]; const i=arr.indexOf(recipeId); if(i>-1) arr.splice(i,1); else arr.push(recipeId); db.set('savedRecipes',saved); render();
}
function login(){
  const email=document.getElementById('email').value.trim(); const password=document.getElementById('password').value.trim();
  if(!email||!password) return alert('Please fill in all fields.');
  const users=db.users; const idx=users.findIndex(u=>u.email===email && u.password===password);
  if(idx===-1) return alert('Incorrect login details.');
  users[idx].lastLogin=new Date().toISOString(); users[idx].loginCount=(users[idx].loginCount||0)+1; db.set('users',users);
  currentUser=users[idx]; localStorage.setItem('currentUser', JSON.stringify(currentUser)); view='home'; fetchMealDBRecipes().then(render);
}
function register(){
  const name=document.getElementById('regName').value.trim(); const email=document.getElementById('regEmail').value.trim(); const password=document.getElementById('regPassword').value.trim();
  if(!name||!email||!password) return alert('Please fill in all fields.');
  const users=db.users; if(users.find(u=>u.email===email)) return alert('Email already in use.');
  const user={name,email,password,isAdmin:false,registeredAt:new Date().toISOString(),lastLogin:new Date().toISOString(),loginCount:1}; users.push(user); db.set('users',users); currentUser=user; localStorage.setItem('currentUser', JSON.stringify(user)); view='home'; fetchMealDBRecipes().then(render);
}
function logout(){ currentUser=null; localStorage.removeItem('currentUser'); view='info'; closeMobileMenu(); render(); }
function uploadRecipe(){
  const title=document.getElementById('title').value.trim();
  const category=document.getElementById('category').value.trim();
  const image=document.getElementById('image').value.trim() || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=800&auto=format&fit=crop';
  const ingredients=document.getElementById('ingredients').value.trim();
  const steps=document.getElementById('steps').value.trim();
  if(!title||!category||!ingredients||!steps) return alert('Please fill in all fields.');
  const pending=db.pendingRecipes;
  pending.push({id:'p'+Date.now(),title,cat:category,img:image,ingr:ingredients.split('\n').filter(Boolean).join('\n'),steps:steps.split('\n').filter(Boolean).join('\n'),author:currentUser.name});
  db.set('pendingRecipes',pending); alert('Recipe sent for approval!'); changeView('home');
}
function approveRecipe(id){ const pending=db.pendingRecipes; const recipe=pending.find(r=>r.id===id); if(!recipe) return; const approved=db.approvedRecipes; approved.push({...recipe,id:'a'+Date.now()}); db.set('approvedRecipes',approved); db.set('pendingRecipes', pending.filter(r=>r.id!==id)); alert('Recipe approved!'); render(); }
function rejectRecipe(id){ if(!confirm('Are you sure you want to reject this recipe?')) return; db.set('pendingRecipes', db.pendingRecipes.filter(r=>r.id!==id)); alert('Recipe rejected.'); render(); }
function deleteUser(email){ if(!confirm('Are you sure you want to delete this user?')) return; db.set('users', db.users.filter(u=>u.email!==email)); render(); }
function addReview(recipeId){ if(!currentUser){ changeView('login'); return; } const rating=parseInt(document.getElementById('rating').value,10); const comment=document.getElementById('comment').value.trim(); if(!comment) return alert('Write a review first.'); const reviews=db.reviews; if(!reviews[recipeId]) reviews[recipeId]=[]; reviews[recipeId].push({user:currentUser.name,rating,comment,date:new Date().toISOString()}); db.set('reviews',reviews); document.querySelector('.fixed.inset-0.bg-black\/80')?.remove(); render(); }
function switchTab(tabName){ activeTab=tabName; document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active')); document.querySelectorAll('.tab-btn').forEach(btn=>{ btn.classList.remove('bg-orange-600','text-white'); btn.classList.add('bg-slate-100','text-slate-700'); }); document.getElementById('tab-'+tabName)?.classList.add('active'); const activeBtn=Array.from(document.querySelectorAll('.tab-btn')).find(btn=>btn.dataset.tab===tabName); if(activeBtn){ activeBtn.classList.remove('bg-slate-100','text-slate-700'); activeBtn.classList.add('bg-orange-600','text-white'); } }

function renderGuestNav(){
  return `<nav class="bg-white/90 backdrop-blur border-b sticky top-0 z-50"><div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between"><div class="flex items-center gap-3 cursor-pointer" onclick="changeView('info')"><div class="w-10 h-10 bg-orange-600 rounded-xl flex items-center justify-center text-white font-black">M</div><div class="font-black text-lg">Meal Planner</div></div><div><button onclick="changeView('login')" class="px-4 py-2 rounded-lg font-bold bg-orange-600 text-white hover:bg-orange-700 text-sm">Login</button></div></div></nav>`;
}
function renderNav(){
  if(!currentUser) return renderGuestNav();
  const savedMenu=db.savedMenus[currentUser.email]?.recipes || [];
  const myRecipes=db.savedRecipes[currentUser.email] || [];
  const pendingCount=db.pendingRecipes.length;

function renderRecipeCard(recipe, idx, isSaved=false, isMyRecipes=false){

  } else if(view==='myrecipes'){
    const saved=db.savedRecipes[currentUser.email] || []; const mine=saved.map(id=>db.recipes.find(r=>r.id===id)).filter(Boolean);
    app.innerHTML=`${renderNav()}<div class="max-w-6xl mx-auto p-4 py-8 md:py-12"><h1 class="text-3xl md:text-4xl font-black mb-8">My Recipes (${mine.length})</h1>${mine.length ? `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6">${mine.map((r,i)=>renderRecipeCard(r,i,false,true)).join('')}</div>` : `<div class="bg-white rounded-3xl p-8 md:p-12 text-center"><p class="text-lg md:text-xl text-slate-500">No saved recipes yet. Tap the heart on a recipe card.</p></div>`}</div>`;
  } else if(view==='community'){
    const approved=db.approvedRecipes;
    app.innerHTML=`${renderNav()}<div class="max-w-6xl mx-auto p-4 py-8 md:py-12"><h1 class="text-3xl md:text-4xl font-black mb-8">Community Recipes (${approved.length})</h1><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6">${approved.map((r,i)=>renderRecipeCard(r,i)).join('')}${!approved.length?`<div class="col-span-1 md:col-span-2 lg:col-span-3 bg-white rounded-3xl p-8 md:p-12 text-center"><p class="text-lg md:text-xl text-slate-500">No approved recipes yet.</p></div>`:''}</div></div>`;
  } else if(view==='upload'){
    app.innerHTML=`${renderNav()}<div class="max-w-3xl mx-auto p-4 py-8 md:py-12"><h1 class="text-3xl md:text-4xl font-black mb-4">Add Recipe</h1><p class="text-sm md:text-base text-slate-600 mb-8">Your recipe will be reviewed by the admin first.</p><div class="bg-white rounded-3xl p-6 md:p-8 shadow-xl"><input id="title" placeholder="Recipe name" class="w-full p-3 md:p-4 mb-4 border-2 rounded-xl text-sm md:text-base"><input id="category" placeholder="Category, for example Italian" class="w-full p-3 md:p-4 mb-4 border-2 rounded-xl text-sm md:text-base"><input id="image" placeholder="Photo URL (optional)" class="w-full p-3 md:p-4 mb-4 border-2 rounded-xl text-sm md:text-base"><textarea id="ingredients" placeholder="Ingredients, one per line" rows="6" class="w-full p-3 md:p-4 mb-4 border-2 rounded-xl text-sm md:text-base"></textarea><textarea id="steps" placeholder="Preparation steps, one per line" rows="6" class="w-full p-3 md:p-4 mb-4 border-2 rounded-xl text-sm md:text-base"></textarea><button onclick="uploadRecipe()" class="w-full bg-orange-600 text-white p-3 md:p-4 rounded-xl font-bold">Send for Approval</button></div></div>`;
  } else if(view==='admin' && currentUser?.isAdmin){
    const users=db.users, approved=db.approvedRecipes, pending=db.pendingRecipes;
    app.innerHTML=`${renderNav()}<div class="max-w-6xl mx-auto p-4 py-8 md:py-12"><h1 class="text-3xl md:text-4xl font-black mb-8 text-red-600">Admin Panel</h1><div class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6 mb-8 md:mb-12"><div class="bg-white p-6 md:p-8 rounded-3xl shadow-xl text-center"><div class="text-4xl md:text-5xl font-black text-orange-600">${users.length}</div><div class="text-base md:text-xl font-bold mt-2">Users</div></div><div class="bg-white p-6 md:p-8 rounded-3xl shadow-xl text-center"><div class="text-4xl md:text-5xl font-black text-blue-600">${RECIPES.length}</div><div class="text-base md:text-xl font-bold mt-2">Base Recipes</div></div><div class="bg-white p-6 md:p-8 rounded-3xl shadow-xl text-center"><div class="text-4xl md:text-5xl font-black text-green-600">${approved.length}</div><div class="text-base md:text-xl font-bold mt-2">Approved</div></div><div class="bg-white p-6 md:p-8 rounded-3xl shadow-xl text-center"><div class="text-4xl md:text-5xl font-black text-yellow-600">${pending.length}</div><div class="text-base md:text-xl font-bold mt-2">Pending</div></div></div>${pending.length?`<h2 class="text-2xl md:text-3xl font-black mb-4 text-yellow-600">Pending Recipes (${pending.length})</h2><div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6 mb-8 md:mb-12">${pending.map(r=>`<div class="bg-yellow-50 border-2 border-yellow-300 rounded-2xl p-4 md:p-6 shadow-xl"><img src="${r.img}" alt="${r.title}" class="w-full h-40 object-cover rounded-xl mb-4"><h3 class="font-black text-lg md:text-xl mb-2">${r.title}</h3><p class="text-xs md:text-sm text-slate-600 mb-1"><strong>Category:</strong> ${r.cat}</p><p class="text-xs md:text-sm text-slate-600 mb-1"><strong>By:</strong> ${r.author}</p><div class="flex gap-3 mt-4"><button onclick="approveRecipe('${r.id}')" class="flex-1 bg-green-600 text-white py-3 rounded-xl font-bold">Approve</button><button onclick="rejectRecipe('${r.id}')" class="flex-1 bg-red-600 text-white py-3 rounded-xl font-bold">Reject</button></div></div>`).join('')}</div>`:''}<h2 class="text-2xl md:text-3xl font-black mb-4">Users Overview</h2><div class="bg-white rounded-3xl p-4 md:p-6 shadow-xl">${users.map(u=>`<div class="p-4 md:p-6 border-b last:border-b-0"><div class="flex items-start justify-between gap-4 mb-3"><div class="flex-1 min-w-0"><div class="font-black text-lg md:text-xl mb-1 truncate">${u.name}</div><div class="text-sm md:text-base text-slate-600 truncate">${u.email}</div></div>${!u.isAdmin?`<button onclick="deleteUser('${u.email}')" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 text-sm whitespace-nowrap flex-shrink-0">Delete</button>`:`<span class="text-red-600 font-bold text-sm whitespace-nowrap flex-shrink-0">Admin</span>`}</div><div class="grid grid-cols-1 md:grid-cols-3 gap-2 text-xs md:text-sm"><div class="text-slate-600">Member since <strong>${u.registeredAt ? formatDate(u.registeredAt) : 'Unknown'}</strong></div><div class="text-slate-600">Last online <strong>${u.lastLogin ? formatDateTime(u.lastLogin) : 'Never'}</strong></div><div class="text-slate-600">Logins <strong>${u.loginCount || 0}x</strong></div></div></div>`).join('')}</div></div>`;
  }
  bindAuthHelpers();
}
function bindAuthHelpers(){ window.showLogin=()=>{ document.getElementById('loginForm')?.classList.remove('hidden'); document.getElementById('registerForm')?.classList.add('hidden'); }; window.showRegister=()=>{ document.getElementById('loginForm')?.classList.add('hidden'); document.getElementById('registerForm')?.classList.remove('hidden'); }; }

function setupPWA(){
  window.addEventListener('beforeinstallprompt', (e)=>{
    e.preventDefault(); deferredPrompt=e; document.getElementById('installContainer')?.classList.remove('hidden');
  });
  document.getElementById('installBtn')?.addEventListener('click', async ()=>{
    if(!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; document.getElementById('installContainer')?.classList.add('hidden');
  });
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js').catch(console.error); }
}

(function init(){
  const users=db.users;
  if(!users.find(u=>u.email==='admin@mealplanner.app')){
    users.push({name:'Admin',email:'admin@mealplanner.app',password:'admin123',isAdmin:true,registeredAt:new Date().toISOString(),lastLogin:new Date().toISOString(),loginCount:0});
    db.set('users',users);
  }
  currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
  view = currentUser ? 'home' : 'info';
  setupPWA();
  if(currentUser) fetchMealDBRecipes().then(render); else render();
})();
</script>
</body>
</html>
