<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uit Werking | Deel, Plan & Verdien Punten</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            scroll-behavior: smooth;
        }
        .recipe-gradient { background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.8) 100%); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .animate-pop { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .hover-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .chef-badge {
            background: linear-gradient(45deg, #0ea5e9, #2563eb);
        }
        .chef-badge-master {
            background: linear-gradient(45deg, #f59e0b, #d97706);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const Icon = ({ name, size = 20, className = "", fill = "none" }) => {
            useEffect(() => { lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size, strokeWidth: 2.2 }}></i>;
        };

        const recipesPool = {
            italian: [
                { title: "Romige Pesto Penne", ingredients: ["200g Penne", "100g Pesto", "Kipblokjes", "Cherrytomatjes"], instructions: ["Kook de pasta volgens verpakking.", "Bak de kip goudbruin in een pan.", "Meng de pasta en kip met de verse pesto."], image: "https://images.unsplash.com/photo-1551183053-bf91a1d81141?w=800&q=80" },
                { title: "Snelle Gnocchi Bak", ingredients: ["500g Gnocchi", "Spinazie", "Gorgonzola", "Walnoten"], instructions: ["Bak de gnocchi goudbruin in boter.", "Voeg de spinazie toe tot deze slinkt.", "Laat de gorgonzola eroverheen smelten."], image: "https://images.unsplash.com/photo-1626844131082-256783844137?w=800&q=80" }
            ],
            asian: [
                { title: "Teriyaki Wok met Biefstuk", ingredients: ["Rijst", "Wokgroenten", "Biefstukreepjes", "Teriyaki saus"], instructions: ["Kook de rijst.", "Wok de biefstuk en groenten op hoog vuur.", "Voeg de saus toe en serveer over de rijst."], image: "https://images.unsplash.com/photo-1585032226651-759b368d7246?w=800&q=80" }
            ]
        };

        function App() {
            const [view, setView] = useState('home');
            const [user, setUser] = useState(() => JSON.parse(localStorage.getItem('uw_user')) || null);
            const [generated, setGenerated] = useState(() => JSON.parse(localStorage.getItem('uw_gen')) || []);
            const [saved, setSaved] = useState(() => JSON.parse(localStorage.getItem('uw_fav')) || []);
            const [community, setCommunity] = useState(() => JSON.parse(localStorage.getItem('uw_comm')) || []);
            const [points, setPoints] = useState(() => parseInt(localStorage.getItem('uw_points')) || 0);
            const [selected, setSelected] = useState(null);
            const [loading, setLoading] = useState(false);

            const [formData, setFormData] = useState({ title: '', category: 'italian', ingredients: '', instructions: '', image: '' });

            useEffect(() => { localStorage.setItem('uw_user', JSON.stringify(user)); }, [user]);
            useEffect(() => { localStorage.setItem('uw_gen', JSON.stringify(generated)); }, [generated]);
            useEffect(() => { localStorage.setItem('uw_fav', JSON.stringify(saved)); }, [saved]);
            useEffect(() => { localStorage.setItem('uw_comm', JSON.stringify(community)); }, [community]);
            useEffect(() => { localStorage.setItem('uw_points', points.toString()); }, [points]);

            const rankInfo = useMemo(() => {
                if (points >= 500) return { title: "Master Chef", color: "chef-badge-master" };
                if (points >= 150) return { title: "Chef de Cuisine", color: "chef-badge" };
                if (points >= 50) return { title: "Hobbykok", color: "chef-badge" };
                return { title: "Nieuweling", color: "bg-slate-200 text-slate-500" };
            }, [points]);

            const generateMenu = () => {
                setLoading(true);
                if (view !== 'home') setView('home');
                setTimeout(() => {
                    const keys = Object.keys(recipesPool);
                    const results = Array.from({length: 6}, () => {
                        const cat = keys[Math.floor(Math.random() * keys.length)];
                        const pool = recipesPool[cat];
                        const r = pool[Math.floor(Math.random() * pool.length)];
                        return { ...r, id: Math.random().toString(36).substr(2, 9), category: cat, time: "15-20 min", price: (Math.random() * 5 + 3).toFixed(2), likes: 0 };
                    });
                    setGenerated(results);
                    setLoading(false);
                    const el = document.getElementById('results-section');
                    if (el) el.scrollIntoView({ behavior: 'smooth' });
                }, 1000);
            };

            const toggleFav = (r) => {
                if (saved.find(s => s.id === r.id)) setSaved(saved.filter(s => s.id !== r.id));
                else setSaved([...saved, r]);
            };

            const handleLike = (id, e) => {
                if (e) e.stopPropagation();
                setCommunity(prev => prev.map(r => r.id === id ? { ...r, likes: (r.likes || 0) + 1 } : r));
            };

            const handleShare = (e) => {
                e.preventDefault();
                const newRecipe = {
                    ...formData,
                    id: Math.random().toString(36).substr(2, 9),
                    ingredients: formData.ingredients.split(',').map(i => i.trim()),
                    instructions: formData.instructions.split('\n').map(i => i.trim()),
                    image: formData.image || "https://images.unsplash.com/photo-1495521821757-a1efb6729352?w=800&q=80",
                    isCommunity: true,
                    author: user ? user.name : "Gast",
                    time: "30 min",
                    price: "4.50",
                    likes: 0
                };
                setCommunity([newRecipe, ...community]);
                setPoints(prev => prev + 50);
                setFormData({ title: '', category: 'italian', ingredients: '', instructions: '', image: '' });
                setView('home');
                window.scrollTo(0,0);
            };

            return (
                <div className="min-h-screen flex flex-col w-full">
                    
                    {/* Full Width Header */}
                    <header className="bg-white border-b border-slate-100 sticky top-0 z-40 w-full backdrop-blur-md bg-white/90">
                        <div className="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
                            <div className="flex items-center gap-2 cursor-pointer group" onClick={() => setView('home')}>
                                <div className="bg-blue-600 text-white p-2 rounded-xl shadow-lg shadow-blue-200 group-hover:scale-110 transition-transform">
                                    <Icon name="utensils" size={24} />
                                </div>
                                <span className="font-extrabold text-2xl tracking-tight text-slate-800">Uit Werking</span>
                            </div>

                            <nav className="hidden md:flex items-center gap-10">
                                <button onClick={() => setView('home')} className={`font-bold text-sm tracking-wide ${view === 'home' ? 'text-blue-600' : 'text-slate-500 hover:text-slate-800'}`}>Ontdekken</button>
                                <button onClick={() => setView('about')} className={`font-bold text-sm tracking-wide ${view === 'about' ? 'text-blue-600' : 'text-slate-500 hover:text-slate-800'}`}>De Bedoeling</button>
                                <button onClick={() => setView('favorites')} className={`font-bold text-sm tracking-wide ${view === 'favorites' ? 'text-red-500' : 'text-slate-500 hover:text-slate-800'}`}>Mijn Kookboek</button>
                                <button onClick={() => setView('share')} className="bg-slate-900 text-white px-6 py-3 rounded-2xl font-bold text-sm hover:bg-slate-800 transition-all shadow-md active:scale-95">Recept Delen</button>
                            </nav>

                            <div className="flex items-center gap-4">
                                <div className="flex items-center gap-2 bg-white px-4 py-2 rounded-2xl border border-slate-100 shadow-sm">
                                    <Icon name="award" size={16} className="text-orange-500" fill="currentColor" />
                                    <span className="text-xs font-bold text-slate-700">{points} Punten</span>
                                </div>
                                <div className="hidden lg:flex items-center gap-2">
                                    <span className={`${rankInfo.color} text-[10px] text-white font-extrabold px-3 py-1.5 rounded-full shadow-sm tracking-widest uppercase`}>{rankInfo.title}</span>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Main Content Area - Full Width */}
                    <main className="flex-1 w-full overflow-x-hidden">
                        
                        {view === 'about' && (
                            <div className="animate-fade-in max-w-7xl mx-auto px-6 py-16 space-y-24">
                                <section className="text-center space-y-8 max-w-4xl mx-auto">
                                    <h1 className="text-5xl md:text-7xl font-extrabold text-slate-900 leading-tight">Punten, Rangen & Passie.</h1>
                                    <p className="text-xl md:text-2xl text-slate-500 leading-relaxed">
                                        Uit Werking is een gratis platform waar koken centraal staat. Deel jouw creaties en groei uit tot een legendarische Master Chef.
                                    </p>
                                </section>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-12">
                                    <div className="bg-white p-10 rounded-[3rem] shadow-sm border border-slate-100 space-y-6 hover-card transition-all">
                                        <div className="bg-orange-100 text-orange-600 w-16 h-16 rounded-[1.5rem] flex items-center justify-center">
                                            <Icon name="plus-circle" size={32} />
                                        </div>
                                        <h3 className="font-bold text-2xl text-slate-800">50 Punten per Recept</h3>
                                        <p className="text-slate-500 leading-relaxed text-lg">Elke keer dat je jouw passie deelt, word je beloond. Bouw je score op en laat zien dat je de keuken beheerst.</p>
                                    </div>
                                    <div className="bg-white p-10 rounded-[3rem] shadow-sm border border-slate-100 space-y-6 hover-card transition-all">
                                        <div className="bg-blue-100 text-blue-600 w-16 h-16 rounded-[1.5rem] flex items-center justify-center">
                                            <Icon name="trending-up" size={32} />
                                        </div>
                                        <h3 className="font-bold text-2xl text-slate-800">Stijg in de Rangen</h3>
                                        <p className="text-slate-500 leading-relaxed text-lg">Van 'Nieuweling' tot 'Master Chef'. Jouw rang verschijnt bij elk recept dat je deelt.</p>
                                    </div>
                                    <div className="bg-white p-10 rounded-[3rem] shadow-sm border border-slate-100 space-y-6 hover-card transition-all">
                                        <div className="bg-red-100 text-red-600 w-16 h-16 rounded-[1.5rem] flex items-center justify-center">
                                            <Icon name="heart" size={32} fill="currentColor" />
                                        </div>
                                        <h3 className="font-bold text-2xl text-slate-800">Krijg Waardering</h3>
                                        <p className="text-slate-500 leading-relaxed text-lg">Ontvang likes van andere community-leden en word de meest populaire kok van de week.</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'home' && (
                            <div className="animate-fade-in space-y-24">
                                {/* Hero - Full Width with Container Inside */}
                                <section className="w-full px-6 pt-10">
                                    <div className="max-w-7xl mx-auto relative h-[500px] md:h-[650px] rounded-[4rem] overflow-hidden shadow-2xl">
                                        <img src="https://images.unsplash.com/photo-1543353071-087f9fbdd034?w=1600&q=80" className="w-full h-full object-cover" />
                                        <div className="absolute inset-0 bg-gradient-to-r from-slate-900 via-slate-900/40 to-transparent flex flex-col justify-center px-10 md:px-20">
                                            <div className="max-w-2xl space-y-8">
                                                <span className="bg-blue-600 text-white px-5 py-2 rounded-full text-xs font-black uppercase tracking-widest shadow-lg">
                                                    Gratis Community Platform
                                                </span>
                                                <h1 className="text-5xl md:text-8xl font-black text-white leading-tight">Plan gratis, <br/> deel met passie.</h1>
                                                <p className="text-xl md:text-2xl text-slate-200 leading-relaxed max-w-lg">
                                                    De slimste AI-planning voor jouw maaltijden. Deel recepten, verdien punten en word de Chef van jouw eigen keuken.
                                                </p>
                                                <div className="flex flex-wrap gap-6 pt-4">
                                                    <button onClick={generateMenu} className="bg-blue-600 hover:bg-blue-500 text-white font-black py-5 px-12 rounded-[2rem] shadow-2xl transition-all active:scale-95 flex items-center gap-3 text-lg">
                                                        <Icon name="zap" fill="currentColor" size={24} />
                                                        Plan Gratis Menu
                                                    </button>
                                                    <button onClick={() => setView('about')} className="bg-white/10 backdrop-blur-md text-white font-black py-5 px-10 rounded-[2rem] border border-white/20 hover:bg-white/20 transition-all hidden sm:block text-lg">
                                                        De Bedoeling
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </section>

                                {/* Community Content - Containerized */}
                                {community.length > 0 && (
                                    <section className="max-w-7xl mx-auto px-6">
                                        <div className="flex items-end justify-between mb-12 border-b border-slate-100 pb-8">
                                            <div className="space-y-2">
                                                <h2 className="text-4xl md:text-5xl font-black text-slate-800">Community Recepten</h2>
                                                <p className="text-slate-400 font-medium">Vers gedeeld door onze eigen Chefs.</p>
                                            </div>
                                            <button onClick={() => setView('share')} className="text-blue-600 font-bold text-lg hover:translate-x-2 transition-transform">Deel & Verdien Punten →</button>
                                        </div>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-10">
                                            {community.map(r => (
                                                <div key={r.id} onClick={() => setSelected(r)} className="group bg-white rounded-[3rem] overflow-hidden shadow-sm hover-card transition-all cursor-pointer border border-slate-50 flex flex-col h-full">
                                                    <div className="h-60 overflow-hidden relative">
                                                        <img src={r.image} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" />
                                                        <div className="absolute bottom-4 right-4 bg-white/90 backdrop-blur px-3 py-1.5 rounded-2xl flex items-center gap-2 shadow-sm border border-white">
                                                            <button onClick={(e) => handleLike(r.id, e)} className="hover:scale-125 transition-transform text-red-500">
                                                                <Icon name="heart" size={16} fill={r.likes > 0 ? "currentColor" : "none"} />
                                                            </button>
                                                            <span className="text-xs font-black text-slate-800">{r.likes || 0}</span>
                                                        </div>
                                                    </div>
                                                    <div className="p-8 flex-1 flex flex-col">
                                                        <span className="text-[10px] font-black text-blue-500 uppercase tracking-widest mb-2 block">{r.category}</span>
                                                        <h3 className="font-extrabold text-xl text-slate-800 mb-4 line-clamp-2">{r.title}</h3>
                                                        <div className="mt-auto pt-6 border-t border-slate-50 flex items-center justify-between">
                                                            <div className="flex flex-col">
                                                                <span className="text-[10px] font-bold text-slate-300 uppercase">Chef</span>
                                                                <span className="text-xs font-black text-slate-700">{r.author}</span>
                                                            </div>
                                                            <Icon name="chevron-right" size={16} className="text-slate-200 group-hover:text-blue-500 transition-colors" />
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </section>
                                )}

                                {/* Results Section - Containerized */}
                                <section id="results-section" className="max-w-7xl mx-auto px-6 py-20">
                                    <div className="flex items-end justify-between mb-12">
                                        <div className="space-y-2">
                                            <h2 className="text-4xl md:text-5xl font-black text-slate-800">Jouw Weekplanning</h2>
                                            <p className="text-slate-400 font-medium">Exclusief voor jou samengesteld door onze AI.</p>
                                        </div>
                                        {generated.length > 0 && (
                                            <button onClick={generateMenu} className="flex items-center gap-3 text-blue-600 font-black text-sm bg-blue-50 px-6 py-3 rounded-2xl border border-blue-100 hover:bg-blue-100 transition-all">
                                                <Icon name="refresh-cw" size={18} className={loading ? "animate-spin" : ""} />
                                                Nieuwe Planning
                                            </button>
                                        )}
                                    </div>

                                    {generated.length > 0 ? (
                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12">
                                            {generated.map((r, index) => (
                                                <div key={r.id} onClick={() => setSelected(r)} className="bg-white rounded-[3.5rem] overflow-hidden shadow-sm hover-card transition-all border border-slate-50 cursor-pointer flex flex-col group">
                                                    <div className="h-72 relative overflow-hidden">
                                                        <img src={r.image} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-1000" />
                                                        <div className="absolute top-6 left-6 bg-slate-900 text-white px-5 py-2 rounded-full text-[10px] font-black tracking-widest uppercase shadow-xl">
                                                            Dag {index + 1}
                                                        </div>
                                                        <button onClick={(e) => { e.stopPropagation(); toggleFav(r); }} className="absolute top-6 right-6 bg-white/90 backdrop-blur p-3.5 rounded-full shadow-lg hover:scale-110 transition-transform">
                                                            <Icon name="heart" size={20} className={saved.find(s => s.id === r.id) ? "text-red-500 fill-red-500" : "text-slate-300"} />
                                                        </button>
                                                    </div>
                                                    <div className="p-10">
                                                        <div className="flex justify-between items-center mb-4">
                                                            <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">{r.category}</span>
                                                            <div className="bg-green-50 text-green-600 text-xs font-black px-3 py-1 rounded-xl">€{r.price}</div>
                                                        </div>
                                                        <h3 className="text-2xl font-black text-slate-800 mb-6 group-hover:text-blue-600 transition-colors">{r.title}</h3>
                                                        <div className="flex items-center gap-6 text-xs text-slate-400 font-bold border-t pt-6 border-slate-50">
                                                            <div className="flex items-center gap-2"><Icon name="clock" size={16}/> {r.time}</div>
                                                            <div className="flex items-center gap-2 text-blue-500"><Icon name="zap" size={16} fill="currentColor" /> AI Plan</div>
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    ) : (
                                        <div className="text-center py-32 bg-white rounded-[4rem] border-2 border-dashed border-slate-100 max-w-4xl mx-auto shadow-sm">
                                            <div className="w-24 h-24 bg-slate-50 rounded-[2rem] flex items-center justify-center mx-auto mb-8 text-slate-200">
                                                <Icon name="calendar" size={48} />
                                            </div>
                                            <h3 className="text-2xl font-black text-slate-800 mb-4">Klaar om te plannen?</h3>
                                            <p className="text-slate-400 max-w-md mx-auto mb-10 text-lg">Onze AI staat klaar om een heerlijk en gevarieerd menu voor je samen te stellen.</p>
                                            <button onClick={generateMenu} className="bg-slate-900 text-white font-black py-5 px-12 rounded-[2rem] shadow-2xl active:scale-95 transition-all text-lg">Genereer Weekplanning</button>
                                        </div>
                                    )}
                                </section>
                            </div>
                        )}

                        {view === 'share' && (
                            <div className="max-w-7xl mx-auto px-6 py-16 animate-fade-in">
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-20 items-center">
                                    <div className="space-y-10">
                                        <h2 className="text-5xl md:text-7xl font-black text-slate-800 leading-tight">Laat de wereld proeven.</h2>
                                        <p className="text-slate-500 text-xl leading-relaxed">Deel jouw meesterwerken. Voor elk uniek recept ontvang je **50 punten** en stijg je in rang. Help anderen en word een legende op Uit Werking.</p>
                                        
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                                            <div className="p-8 bg-orange-50 rounded-[3rem] border border-orange-100 flex flex-col gap-4">
                                                <div className="bg-orange-500 text-white w-12 h-12 rounded-2xl flex items-center justify-center shadow-lg"><Icon name="award" size={24} /></div>
                                                <h4 className="font-black text-orange-900">Punten Score</h4>
                                                <p className="text-orange-700 text-sm">Elke bijdrage telt mee voor jouw Chef Rang.</p>
                                            </div>
                                            <div className="p-8 bg-blue-50 rounded-[3rem] border border-blue-100 flex flex-col gap-4">
                                                <div className="bg-blue-600 text-white w-12 h-12 rounded-2xl flex items-center justify-center shadow-lg"><Icon name="users" size={24} /></div>
                                                <h4 className="font-black text-blue-900">Likes & Trots</h4>
                                                <p className="text-blue-700 text-sm">Ontvang likes en feedback van de community.</p>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="bg-white p-12 md:p-16 rounded-[4rem] shadow-2xl border border-slate-50">
                                        <form onSubmit={handleShare} className="space-y-8">
                                            <div className="space-y-2">
                                                <label className="text-xs font-black uppercase text-slate-400 tracking-widest ml-2">Titel van het gerecht</label>
                                                <input required value={formData.title} onChange={e => setFormData({...formData, title: e.target.value})} className="w-full bg-slate-50 border border-slate-100 rounded-3xl p-5 text-base focus:bg-white focus:border-blue-500 outline-none transition-all shadow-sm" placeholder="Bijv. Pasta met Verse Salie" />
                                            </div>
                                            <div className="space-y-2">
                                                <label className="text-xs font-black uppercase text-slate-400 tracking-widest ml-2">Ingrediënten</label>
                                                <input required value={formData.ingredients} onChange={e => setFormData({...formData, ingredients: e.target.value})} className="w-full bg-slate-50 border border-slate-100 rounded-3xl p-5 text-base outline-none shadow-sm" placeholder="Penne, room, spekjes..." />
                                            </div>
                                            <div className="space-y-2">
                                                <label className="text-xs font-black uppercase text-slate-400 tracking-widest ml-2">Bereidingswijze</label>
                                                <textarea required value={formData.instructions} onChange={e => setFormData({...formData, instructions: e.target.value})} className="w-full bg-slate-50 border border-slate-100 rounded-[2rem] p-5 text-base outline-none h-48 resize-none shadow-sm" placeholder="Stap 1: ..."></textarea>
                                            </div>
                                            <button type="submit" className="w-full bg-slate-900 text-white font-black py-6 rounded-[2.5rem] shadow-2xl active:scale-95 transition-all text-lg">
                                                Publiceer Recept (+50 Punten)
                                            </button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'favorites' && (
                            <div className="max-w-7xl mx-auto px-6 py-16 animate-fade-in">
                                <div className="flex items-end justify-between mb-16">
                                    <div className="space-y-2">
                                        <h2 className="text-5xl md:text-7xl font-black text-slate-800">Mijn Kookboek</h2>
                                        <p className="text-slate-400 text-xl font-medium italic">Al jouw favorieten op één plek.</p>
                                    </div>
                                </div>
                                {saved.length > 0 ? (
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-12">
                                        {saved.map(r => (
                                            <div key={r.id} onClick={() => setSelected(r)} className="bg-white border border-slate-100 rounded-[3rem] overflow-hidden shadow-sm flex flex-col group cursor-pointer hover-card transition-all">
                                                <div className="h-64 relative overflow-hidden">
                                                    <img src={r.image} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" />
                                                    <div className="absolute inset-0 bg-black/10"></div>
                                                </div>
                                                <div className="p-8">
                                                    <span className="text-[10px] text-slate-400 uppercase font-black tracking-widest">{r.category}</span>
                                                    <h3 className="font-extrabold text-xl text-slate-800 mt-2 line-clamp-1">{r.title}</h3>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="text-center py-40 bg-slate-50 rounded-[5rem] border-2 border-dashed border-slate-200 max-w-4xl mx-auto">
                                        <Icon name="heart" size={80} className="mx-auto text-slate-200 mb-8" />
                                        <h3 className="text-2xl font-black text-slate-400 mb-6">Nog geen favorieten bewaard</h3>
                                        <button onClick={() => setView('home')} className="text-blue-600 font-black text-lg hover:underline underline-offset-8">Ontdek nieuwe gerechten</button>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* Full Site Footer */}
                    <footer className="bg-white border-t border-slate-100 py-20 mt-20">
                        <div className="max-w-7xl mx-auto px-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-16">
                            <div className="space-y-6">
                                <div className="flex items-center gap-3 font-black text-2xl text-slate-800">
                                    <Icon name="utensils" size={24} className="text-blue-600" />
                                    <span>Uit Werking</span>
                                </div>
                                <p className="text-slate-400 leading-relaxed font-medium">De meest complete maaltijdplanning en community voor echte Chefs. Gratis voor iedereen.</p>
                                <div className="flex gap-4">
                                    <div className="w-10 h-10 bg-slate-100 rounded-xl flex items-center justify-center text-slate-400 hover:text-blue-600 cursor-pointer transition-colors"><Icon name="instagram" size={18} /></div>
                                    <div className="w-10 h-10 bg-slate-100 rounded-xl flex items-center justify-center text-slate-400 hover:text-blue-600 cursor-pointer transition-colors"><Icon name="twitter" size={18} /></div>
                                </div>
                            </div>
                            <div>
                                <h4 className="font-black text-slate-800 mb-8 tracking-widest uppercase text-xs">Navigatie</h4>
                                <ul className="text-slate-500 space-y-4 font-bold">
                                    <li><button onClick={() => setView('home')} className="hover:text-blue-600 transition-colors">Ontdekken</button></li>
                                    <li><button onClick={() => setView('about')} className="hover:text-blue-600 transition-colors">De Bedoeling</button></li>
                                    <li><button onClick={() => setView('favorites')} className="hover:text-blue-600 transition-colors">Kookboek</button></li>
                                    <li><button onClick={() => setView('share')} className="hover:text-blue-600 transition-colors">Deel Recept</button></li>
                                </ul>
                            </div>
                            <div>
                                <h4 className="font-black text-slate-800 mb-8 tracking-widest uppercase text-xs">Community</h4>
                                <ul className="text-slate-500 space-y-4 font-bold">
                                    <li className="flex items-center gap-2 cursor-help group"><Icon name="award" size={14} className="text-orange-500"/> Rangen Systeem</li>
                                    <li className="flex items-center gap-2 cursor-help group"><Icon name="wallet" size={14} className="text-blue-500"/> Punten Wallet</li>
                                    <li className="flex items-center gap-2 cursor-help group"><Icon name="shopping-cart" size={14} className="text-green-500"/> LinkPizza</li>
                                </ul>
                            </div>
                            <div className="space-y-6">
                                <h4 className="font-black text-slate-800 tracking-widest uppercase text-xs">Chef worden?</h4>
                                <div className="bg-slate-50 p-8 rounded-[2.5rem] border border-slate-100 text-center">
                                    <p className="text-xs font-bold text-slate-400 mb-6">Jouw huidige status:</p>
                                    <span className={`${rankInfo.color} text-[10px] text-white font-black px-4 py-2 rounded-full shadow-lg block mb-6`}>{rankInfo.title}</span>
                                    <button onClick={() => setView('share')} className="w-full bg-slate-900 text-white font-black py-4 rounded-2xl text-[10px] uppercase tracking-widest hover:scale-105 transition-transform shadow-xl">Verdien Punten</button>
                                </div>
                            </div>
                        </div>
                        <div className="max-w-7xl mx-auto px-6 mt-20 pt-10 border-t border-slate-50 flex flex-col md:row justify-between items-center gap-6">
                            <p className="text-[10px] font-bold text-slate-300 uppercase tracking-widest">© 2026 Uit Werking. Gemaakt met passie voor de community.</p>
                            <div className="flex gap-8 text-[10px] font-bold text-slate-300 uppercase tracking-widest">
                                <span className="cursor-pointer hover:text-slate-600 transition-colors">Privacy</span>
                                <span className="cursor-pointer hover:text-slate-600 transition-colors">Voorwaarden</span>
                            </div>
                        </div>
                    </footer>

                    {/* Modal Recept View */}
                    {selected && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 md:p-10">
                            <div className="absolute inset-0 bg-slate-900/90 backdrop-blur-lg" onClick={() => setSelected(null)}></div>
                            <div className="bg-white rounded-[4rem] w-full max-w-6xl relative overflow-hidden animate-pop max-h-[90vh] flex flex-col lg:flex-row shadow-2xl">
                                <div className="lg:w-1/2 relative h-80 lg:h-auto overflow-hidden">
                                    <img src={selected.image} className="w-full h-full object-cover shadow-inner" />
                                    <div className="absolute top-10 left-10 bg-white/20 backdrop-blur-xl px-6 py-3 rounded-3xl flex items-center gap-3 text-white border border-white/20 shadow-2xl">
                                        <button onClick={() => handleLike(selected.id)} className="hover:scale-150 transition-transform text-red-500 drop-shadow-lg">
                                            <Icon name="heart" size={24} fill={selected.likes > 0 ? "currentColor" : "none"} />
                                        </button>
                                        <span className="font-black text-xl">{selected.likes || 0}</span>
                                    </div>
                                    <button onClick={() => setSelected(null)} className="absolute top-10 right-10 bg-black/30 backdrop-blur-md text-white p-3 rounded-full lg:hidden">
                                        <Icon name="x" size={24} />
                                    </button>
                                </div>
                                <div className="lg:w-1/2 p-10 md:p-20 overflow-y-auto no-scrollbar bg-white flex flex-col">
                                    <div className="mb-12">
                                        <div className="flex items-start justify-between gap-6">
                                            <div className="space-y-4">
                                                <span className="text-xs font-black text-blue-600 uppercase tracking-widest bg-blue-50 px-4 py-1.5 rounded-full">
                                                    {selected.category}
                                                </span>
                                                <h2 className="text-4xl md:text-5xl font-black text-slate-800 leading-tight">{selected.title}</h2>
                                                {selected.isCommunity && <p className="text-slate-400 font-bold text-lg italic">Gecreëerd door Chef {selected.author}</p>}
                                            </div>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-10 mb-12 border-b pb-12 border-slate-50">
                                        <div className="flex flex-col gap-2">
                                            <span className="text-xs font-black text-slate-300 uppercase tracking-widest">Kosten p.p.</span>
                                            <span className="text-3xl font-black text-green-600">€{selected.price}</span>
                                        </div>
                                        <div className="flex flex-col gap-2">
                                            <span className="text-xs font-black text-slate-300 uppercase tracking-widest">Bereiding</span>
                                            <span className="text-3xl font-black text-slate-700">{selected.time}</span>
                                        </div>
                                    </div>

                                    <div className="space-y-12 flex-1">
                                        <div>
                                            <h3 className="font-black text-slate-800 mb-6 text-2xl flex items-center gap-3">
                                                <Icon name="list" size={24} className="text-blue-500" />
                                                Ingrediënten
                                            </h3>
                                            <ul className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                                {selected.ingredients.map((ing, i) => (
                                                    <li key={i} className="flex items-center gap-4 text-slate-600 font-bold text-base bg-slate-50 p-4 rounded-2xl border border-slate-100 shadow-sm">
                                                        <Icon name="check-circle" size={18} className="text-green-500" />
                                                        {ing}
                                                    </li>
                                                ))}
                                            </ul>
                                        </div>

                                        <div className="pt-10 mt-auto">
                                            <button 
                                                onClick={() => { alert('Je wordt doorverwezen! (Gebruik hier je LinkPizza link)'); setSelected(null); }}
                                                className="w-full bg-slate-900 text-white font-black py-7 rounded-[2.5rem] flex items-center justify-center gap-4 shadow-2xl hover:bg-slate-800 transition-all active:scale-95 text-xl"
                                            >
                                                Boodschappen Bestellen <Icon name="arrow-right" size={24}/>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                                <button onClick={() => setSelected(null)} className="absolute top-12 right-12 text-slate-300 hover:text-slate-800 hidden lg:block transition-colors">
                                    <Icon name="x" size={40} />
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Mobile Navigation - Only visible on small screens */}
                    <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-lg border-t border-slate-100 p-6 px-10 flex justify-between items-center z-40">
                        <button onClick={() => setView('home')} className={`flex flex-col items-center gap-1 transition-all ${view === 'home' ? 'text-blue-600 scale-125' : 'text-slate-300'}`}>
                            <Icon name="home" size={26} fill={view === 'home' ? "currentColor" : "none"} />
                        </button>
                        <button onClick={() => setView('share')} className={`flex flex-col items-center -mt-16 transition-all`}>
                            <div className={`w-16 h-16 rounded-full flex items-center justify-center shadow-2xl border-4 border-white active:scale-90 transition-all ${view === 'share' ? 'bg-blue-600 text-white rotate-45' : 'bg-slate-900 text-white'}`}>
                                <Icon name="plus" size={32} />
                            </div>
                        </button>
                        <button onClick={() => setView('favorites')} className={`flex flex-col items-center gap-1 transition-all ${view === 'favorites' ? 'text-red-500 scale-125' : 'text-slate-300'}`}>
                            <Icon name="heart" size={26} fill={view === 'favorites' ? "currentColor" : "none"} />
                        </button>
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
