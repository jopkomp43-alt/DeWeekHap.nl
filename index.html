    function App() {
      const [view, setView] = useState('home');
      const [savedRecipes, setSavedRecipes] = useState(() => {
        try { return JSON.parse(localStorage.getItem('weekhap_saved') || '[]'); } catch { return []; }
      });
      const [communityRecipes, setCommunityRecipes] = useState(() => {
        try { return JSON.parse(localStorage.getItem('weekhap_community') || '[]'); } catch { return []; }
      });
      const [generatedMenu, setGeneratedMenu] = useState([]);
      const [loading, setLoading] = useState(false);
      const [selectedRecipe, setSelectedRecipe] = useState(null);
      const [preferences, setPreferences] = useState('');
      const [servings, setServings] = useState(2);
      const [noResultsError, setNoResultsError] = useState(false);
      const [formData, setFormData] = useState({ title: '', category: 'Diner', ingredients: '', instructions: '' });
      const [uploadedImage, setUploadedImage] = useState(null);
      const [showEmailPopup, setShowEmailPopup] = useState(false);
      const [email, setEmail] = useState('');

      useEffect(() => {
        try { localStorage.setItem('weekhap_saved', JSON.stringify(savedRecipes)); } catch(e) {}
      }, [savedRecipes]);

      useEffect(() => {
        try { localStorage.setItem('weekhap_community', JSON.stringify(communityRecipes)); } catch(e) {}
      }, [communityRecipes]);

      useEffect(() => {
        document.title = selectedRecipe ? `${selectedRecipe.title} - De Weekhap` : 'De Weekhap | Jouw Slimme Maaltijdplanner';
      }, [selectedRecipe]);

      useEffect(() => {
        const timer = setTimeout(() => setShowEmailPopup(true), 45000);
        return () => clearTimeout(timer);
      }, []);

      const parseIngredient = (ingStr, factor) => {
        const match = ingStr.match(/^(\d+[\.,]?\d*)\s*(.*)$/);
        if (match) {
          const num = parseFloat(match[1].replace(',', '.'));
          const scaled = (num * factor).toLocaleString('nl-NL', { maximumFractionDigits: 1 });
          return `${scaled} ${match[2]}`;
        }
        return ingStr;
      };

      const generateWeekMenu = () => {
        setLoading(true);
        setNoResultsError(false);
        if (window.gtag) window.gtag('event', 'generate_menu', { event_category: 'engagement' });

        setTimeout(() => {
          const allPossible = [...baseRecipes, ...communityRecipes];
          const stopwords = ['geen', 'zonder', 'extra', 'meer', 'minder'];
          const dislikes = preferences.toLowerCase().split(/[,\s]+/).filter(w => w.length > 2 && !stopwords.includes(w));

          const filtered = allPossible.filter(r => {
            const text = `${r.title} ${r.ingredients} ${r.category}`.toLowerCase();
            return !dislikes.some(bad => text.includes(bad));
          });

          if (filtered.length < 7) {
            setNoResultsError(true);
            setGeneratedMenu([]);
          } else {
            const shuffled = [...filtered].sort(() => 0.5 - Math.random());
            setGeneratedMenu(shuffled.slice(0, 7));
            setTimeout(() => window.scrollTo({ top: 600, behavior: 'smooth' }), 100);
          }
          setLoading(false);
        }, 600);
      };

      const handleImage = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => setUploadedImage(reader.result);
          reader.readAsDataURL(file);
        }
      };

      const submitRecipe = (e) => {
        e.preventDefault();
        if (!uploadedImage) { alert('Voeg een foto toe!'); return; }
        const newRecipe = { ...formData, id: 'c_' + Date.now(), image: uploadedImage, calories: 500 };
        setCommunityRecipes([newRecipe, ...communityRecipes]);
        setView('home');
        setFormData({ title: '', category: 'Diner', ingredients: '', instructions: '' });
        setUploadedImage(null);
      };

      const toggleSave = (recipe) => {
        const exists = savedRecipes.find(r => r.id === recipe.id);
        if (exists) {
          setSavedRecipes(savedRecipes.filter(r => r.id !== recipe.id));
        } else {
          setSavedRecipes([...savedRecipes, recipe]);
          if (window.gtag) window.gtag('event', 'save_recipe', { event_category: 'engagement', event_label: recipe.title });
        }
      };

      return (
        <div className="min-h-screen flex flex-col">

          {/* HEADER */}
          <header className="sticky top-0 z-50 bg-white/90 backdrop-blur-xl border-b border-slate-200 px-6 h-20 flex items-center justify-between shadow-sm">
            <div className="flex items-center gap-3 cursor-pointer" onClick={() => { setView('home'); setSelectedRecipe(null); }}>
              <div className="w-10 h-10 bg-orange-600 rounded-xl flex items-center justify-center text-white font-black shadow-lg shadow-orange-200 animate-bounce-slow text-xl italic">W</div>
              <span className="font-black text-2xl tracking-tighter uppercase italic text-slate-900 hidden sm:block">De Weekhap</span>
            </div>

            <nav className="flex gap-4 md:gap-8">
              {['home','add','saved'].map(v => (

                  {v === 'home' ? 'Generator' : v === 'add' ? 'Deel Recept' : 'Kookboek'}
                </button>
              ))}
            </nav>

            <div className="flex items-center gap-3">
              <a href="https://linkpizza.com" target="_blank" rel="noreferrer" className="hidden lg:block bg-orange-600 text-white px-4 py-2 rounded-full text-[10px] font-black uppercase hover:bg-orange-700 transition-all">
                💰 LinkPizza
              </a>
              <div className="w-10 h-10 rounded-full bg-slate-200 flex items-center justify-center">
                <Icon name="user" size={18} className="text-slate-500" />
              </div>
            </div>
          </header>

          <main className="flex-1 pb-20">

            {/* HOME VIEW */}
            {view === 'home' && (
              <div className="p-4 md:p-6 max-w-7xl mx-auto space-y-12 pt-10 fade-in">

                {/* HERO */}
                <section className="bg-white rounded-[3rem] p-8 md:p-16 border border-slate-200 shadow-xl relative overflow-hidden flex flex-col items-center text-center">
                  <div className="relative z-10 max-w-3xl">
                    <span className="bg-orange-100 text-orange-600 px-4 py-1 rounded-full text-[10px] font-black uppercase tracking-widest mb-6 inline-block">Maaltijdplanner GitHub Editie</span>
                    <h1 className="text-5xl md:text-7xl lg:text-8xl font-black text-slate-900 leading-[0.9] uppercase tracking-tighter mb-8">
                      Plan Je <span className="text-orange-600 italic">Gezonde</span> Week.
                    </h1>

                    <div className="flex flex-col md:flex-row gap-4 justify-center items-center mb-10 w-full max-w-xl mx-auto">
                      <div className="bg-slate-50 p-4 rounded-2xl border flex items-center gap-6 w-full md:w-auto">
                        <span className="text-[10px] font-black uppercase text-slate-400 tracking-widest">Personen</span>
                        <div className="flex items-center gap-4">
