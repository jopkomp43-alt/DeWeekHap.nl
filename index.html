function translateText(text) {
  if (!text || typeof text !== 'string') return text;
  
  let translated = text;
  const lowerText = text.toLowerCase();
  
  // Vertaal bekende woorden/zinnen
  Object.entries(EN_TO_NL).forEach(([en, nl]) => {
    // Case-insensitive replacement met woordgrenzen
    const regex = new RegExp('\\b' + en + '\\b', 'gi');
    translated = translated.replace(regex, nl);
  });
  
  return translated;
}

let mealDBCache = [];
let mealDBLoading = false;

async function fetchMealDBRecipes(count = 20) {
  if (mealDBLoading) return [];
  mealDBLoading = true;
  try {
    const promises = [];
    for (let i = 0; i < count; i++) {
      promises.push(fetch('https://www.themealdb.com/api/json/v1/1/random.php'));
    }
    const responses = await Promise.all(promises);
    const data = await Promise.all(responses.map(r => r.json()));
    const meals = data.filter(d => d.meals && d.meals[0]).map(d => d.meals[0]).map(meal => {
      const ingredients = [];
      for (let i = 1; i <= 20; i++) {
        const ingredient = meal[`strIngredient${i}`];
        const measure = meal[`strMeasure${i}`];
        if (ingredient && ingredient.trim()) {
          const translatedIng = translateText(ingredient);
          const translatedMeasure = translateText(measure || '');
          ingredients.push(`${translatedMeasure} ${translatedIng}`.trim());
        }
      }
      
      const rawSteps = meal.strInstructions.split('.').map(s => s.trim()).filter(s => s.length > 10).slice(0, 7);
      const steps = rawSteps.map(step => translateText(step));
      
      const translatedTitle = translateText(meal.strMeal);
      const translatedCat = translateText(meal.strCategory || 'Internationaal');
      
      return {
        id: 'mdb' + meal.idMeal, 
        title: translatedTitle, 
        img: meal.strMealThumb, 
        ingr: ingredients.join('||'), 
        steps: steps.join('||'), 
        cat: translatedCat, 
        author: 'TheMealDB', 
        source: 'mealdb',
        originalTitle: meal.strMeal
      };
    });
    
    meals.forEach(meal => {
      if (!mealDBCache.find(m => m.id === meal.id)) {
        mealDBCache.push(meal);
      }
    });
    
    mealDBLoading = false;
    return meals;
  } catch (error) {
    console.error('Fout bij laden TheMealDB:', error);
    mealDBLoading = false;
    return [];
  }
}

function shuffleArray(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function expandSearchTerm(term) {
  const lowerTerm = term.toLowerCase();
  // Zoek naar exacte match in woordenboek
  if (TRANSLATION_MAP[lowerTerm]) {
    return `${term} ${TRANSLATION_MAP[lowerTerm]}`;
  }
  return term;
}

function filterByPrefs(recipes, extraFilter = '') {
  const prefs = db.preferences()[currentUser.email];
  
  return recipes.filter(r => {
    const txt = `${r.title} ${r.cat} ${r.ingr}`.toLowerCase();
    
    if (extraFilter && extraFilter.trim()) {
      const extraTerms = extraFilter.toLowerCase().split(' ').filter(t => t.trim());
      let hasExtraMatch = false;
      for (const term of extraTerms) {
        // Expandeer zoekterm met vertalingen
        const expandedTerm = expandSearchTerm(term);
        const searchWords = expandedTerm.toLowerCase().split(' ');
        
        for (const word of searchWords) {
          if (txt.includes(word)) {
            hasExtraMatch = true;
            break;
          }
        }
        if (hasExtraMatch) break;
      }
      if (!hasExtraMatch) return false;
    }
    
    if (prefs && prefs.niet) {
      const nietTerms = prefs.niet.toLowerCase().split(' ').filter(t => t.trim());
      for (const term of nietTerms) {
        const expandedTerm = expandSearchTerm(term);
        const searchWords = expandedTerm.toLowerCase().split(' ');
        for (const word of searchWords) {
          if (txt.includes(word)) return false;
        }
      }
    }
    if (prefs && prefs.wel) {
      const welTerms = prefs.wel.toLowerCase().split(' ').filter(t => t.trim());
      if (welTerms.length > 0) {
        let hasMatch = false;
        for (const term of welTerms) {
          const expandedTerm = expandSearchTerm(term);
          const searchWords = expandedTerm.toLowerCase().split(' ');
          for (const word of searchWords) {
            if (txt.includes(word)) {
              hasMatch = true;
              break;
            }
          }
          if (hasMatch) break;
        }
        if (!hasMatch) return false;
      }
    }
    return true;
  });
}

async function generateMenu(extraFilter = '') {
  const loadingMsg = document.createElement('div');
  loadingMsg.id = 'loadingMsg';
  loadingMsg.className = 'fixed top-20 right-4 bg-orange-600 text-white px-6 py-3 rounded-xl font-bold shadow-xl z-50';
  loadingMsg.textContent = extraFilter ? `🔍 Zoeken naar "${extraFilter}"...` : '🍽️ Weekmenu genereren...';
  document.body.appendChild(loadingMsg);
  
  const minRecipes = 14;
  let attempts = 0;
  const maxAttempts = 12;
  
  while (attempts < maxAttempts) {
    const currentRecipes = db.recipes();
    const filtered = filterByPrefs(currentRecipes, extraFilter);
    
    console.log(`Poging ${attempts + 1}: ${filtered.length} recepten beschikbaar (doel: ${minRecipes})`);
    
    if (filtered.length >= minRecipes) {
      console.log('✅ Genoeg recepten gevonden!');
      break;
    }
    
    const expandedSearch = expandSearchTerm(extraFilter);
    loadingMsg.textContent = extraFilter 
      ? `🌍 Laden... ${filtered.length}/${minRecipes} recepten (zoekt: ${expandedSearch})`
      : `🌍 Laden... ${filtered.length}/${minRecipes} recepten`;
    
    console.log(`🌍 Nieuwe recepten laden... (${filtered.length}/${minRecipes})`);
    await fetchMealDBRecipes(40);
    attempts++;
    await new Promise(resolve => setTimeout(resolve, 300));
  }
  
  const finalRecipes = db.recipes();
  const filtered = filterByPrefs(finalRecipes, extraFilter);
  
  console.log(`Finale check: ${filtered.length} recepten beschikbaar`);
  
  if (filtered.length < 7) {
    loadingMsg.remove();
    const expandedInfo = extraFilter ? expandSearchTerm(extraFilter) : '';
    return alert(`⚠️ Niet genoeg recepten gevonden (${filtered.length} beschikbaar).\n\n${extraFilter ? `Gezocht naar: ${expandedInfo}\n\nTip: Probeer een bredere zoekterm of laat het veld leeg!` : 'Probeer andere voorkeuren!'}`);
  }
  
  const days = ['Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag','Zondag'];
  const shuffled = shuffleArray(filtered);
  const selected = shuffled.slice(0, 7);
  
  if (lastGeneratedIds.length > 0) {
    const hasOverlap = selected.some(r => lastGeneratedIds.includes(r.id));
    if (hasOverlap && filtered.length >= 14) {
      console.log('⚠️ Overlap gedetecteerd, opnieuw genereren...');
      loadingMsg.remove();
      return generateMenu(extraFilter);
    }
  }
  
  currentMenu = selected.map((r,i) => ({...r, day: days[i]}));
  lastGeneratedIds = selected.map(r => r.id);
  
  loadingMsg.textContent = '✅ Weekmenu klaar!';
  setTimeout(() => loadingMsg.remove(), 1500);
  
  render();
}
