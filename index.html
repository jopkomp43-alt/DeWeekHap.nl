<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>De Weekhap | Slimme Weekplanning</title>
    <meta name="description" content="Plan je weekmenu, genereer boodschappenlijstjes en deel tips.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel voor JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Google Font -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fade-in 0.5s ease-out forwards; }
    </style>
</head>
<body class="bg-white text-slate-900">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            doc, 
            addDoc, 
            updateDoc, 
            deleteDoc, 
            onSnapshot, 
            query, 
            limit 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { 
            getAuth, 
            signInAnonymously, 
            signInWithCustomToken,
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // --- ICON COMPONENT (Lucide Wrapper) ---
        const Icon = ({ name, size = 20, className = "", fill = "none" }) => {
            const iconRef = React.useRef(null);
            React.useEffect(() => {
                if (window.lucide && iconRef.current) {
                    const iconElement = document.createElement('i');
                    iconElement.setAttribute('data-lucide', name);
                    iconElement.setAttribute('class', className);
                    iconElement.style.width = `${size}px`;
                    iconElement.style.height = `${size}px`;
                    
                    // Clear and append
                    iconRef.current.innerHTML = '';
                    iconRef.current.appendChild(iconElement);
                    
                    window.lucide.createIcons({
                        attrs: { 
                            class: className, 
                            strokeWidth: 2, 
                            fill: fill 
                        },
                        nameAttr: 'data-lucide',
                        root: iconRef.current
                    });
                }
            }, [name, size, className, fill]);

            return <span ref={iconRef} style={{ display: 'inline-flex' }} />;
        };

        // --- CONFIGURATIE ---
        // Haal config uit environment of gebruik een lege placeholder (die foutmeldingen geeft als hij leeg is, maar de app niet laat crashen bij start)
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'de-weekhap-prod';
        const ADMIN_EMAIL = 'jouw@email.nl'; 

        // Initialiseer Firebase alleen als er een config is
        let app, db, auth;
        try {
            if (Object.keys(firebaseConfig).length > 0) {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
            }
        } catch (e) {
            console.error("Firebase init error:", e);
        }

        function App() {
            const [user, setUser] = React.useState(null);
            const [generatedMenu, setGeneratedMenu] = React.useState([]);
            const [communityTips, setCommunityTips] = React.useState([]);
            const [showShoppingList, setShowShoppingList] = React.useState(false);
            const [loading, setLoading] = React.useState(false);
            const [copyStatus, setCopyStatus] = React.useState(false);
            const [authError, setAuthError] = React.useState(null);

            // 1. AUTHENTICATIE EFFECT
            React.useEffect(() => {
                if (!auth) {
                    setAuthError("Firebase configuratie ontbreekt.");
                    return;
                }

                const initAuth = async () => {
                    try {
                        // Check voor custom token (vanuit environment) of log anoniem in
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (err) {
                        console.error("Auth Error:", err);
                        setAuthError("Kon niet inloggen bij de database.");
                    }
                };

                initAuth();
                const unsubscribe = onAuthStateChanged(auth, (u) => setUser(u));
                return () => unsubscribe();
            }, []);

            // 2. DATA SYNC EFFECT (Veilige modus)
            React.useEffect(() => {
                // STOP als er geen gebruiker is of geen db connectie
                if (!user || !db) return;

                // FIX: Gebruik het verplichte pad structuur
                const tipsRef = collection(db, 'artifacts', appId, 'public', 'data', 'tips');
                
                // FIX: Verwijder 'orderBy' uit de query om index-fouten te voorkomen
                // We sorteren later in JavaScript (client-side)
                const q = query(tipsRef, limit(50));
                
                const unsubTips = onSnapshot(q, (snapshot) => {
                    const tipsData = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                    
                    // Client-side sorteren op datum (nieuwste eerst)
                    const sortedTips = tipsData.sort((a, b) => (b.date || 0) - (a.date || 0));
                    
                    setCommunityTips(sortedTips);
                }, (err) => {
                    console.error("Firestore Permission Error:", err);
                    // Stil falen of UI update (optioneel)
                });

                return () => unsubTips();
            }, [user]); // Dit effect runt PAS als 'user' gevuld is

            // 3. Boodschappenlijst Logica
            const shoppingList = React.useMemo(() => {
                const allIngredients = generatedMenu.flatMap(recipe => recipe.ingredients || []);
                return [...new Set(allIngredients.map(i => i.trim().toLowerCase()))]
                    .map(i => i.charAt(0).toUpperCase() + i.slice(1));
            }, [generatedMenu]);

            // 4. Acties
            const generateNewMenu = () => {
                setLoading(true);
                const mockRecipes = [
                    { title: "Pasta Carbonara met Verse Peterselie", ingredients: ["Pasta", "Ei", "Spek", "Kaas", "Peterselie"] },
                    { title: "Gezonde Wok met Kip en Broccoli", ingredients: ["Kip", "Broccoli", "Sojasaus", "Rijst", "Knoflook"] },
                    { title: "Vegetarische Lasagne", ingredients: ["Lasagnebladen", "Spinazie", "Ricotta", "Tomatensaus"] },
                    { title: "Zalm uit de oven met Asperges", ingredients: ["Zalm", "Asperges", "Citroen", "Dille"] },
                    { title: "Mexicaanse Taco's", ingredients: ["Taco schelpen", "Gehakt", "Sla", "Maïs", "Salsa"] },
                    { title: "Gevulde Paprika met Quinoa", ingredients: ["Paprika", "Quinoa", "Feta", "Pijnboompitten"] },
                    { title: "Romige Champignon Risotto", ingredients: ["Risottorijst", "Champignons", "Bouillon", "Ui"] }
                ];
                
                setTimeout(() => {
                    setGeneratedMenu(mockRecipes);
                    setLoading(false);
                    const el = document.getElementById('results');
                    if(el) el.scrollIntoView({ behavior: 'smooth' });
                }, 800);
            };

            const copyToClipboard = () => {
                const text = `Boodschappenlijst De Weekhap:\n- ${shoppingList.join('\n- ')}`;
                // Fallback voor iframes/beperkte omgevingen
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    setCopyStatus(true);
                    setTimeout(() => setCopyStatus(false), 2000);
                } catch (err) {
                    console.error('Copy failed', err);
                }
                document.body.removeChild(textArea);
            };

            const addCommunityTip = async () => {
                if (!user) return alert("Wacht even tot je bent ingelogd...");
                const text = prompt("Wat is jouw ultieme keukengeheim?");
                if (text && text.length > 5) {
                    try {
                        const tipsRef = collection(db, 'artifacts', appId, 'public', 'data', 'tips');
                        await addDoc(tipsRef, {
                            text,
                            author: user.isAnonymous ? 'Gast Chef' : (user.displayName || 'Chef'),
                            userId: user.uid,
                            date: Date.now(),
                            likes: []
                        });
                    } catch (e) {
                        alert("Kon tip niet plaatsen. Probeer het later opnieuw.");
                    }
                }
            };

            const toggleLike = async (tip) => {
                if (!user) return;
                const tipRef = doc(db, 'artifacts', appId, 'public', 'data', 'tips', tip.id);
                const likes = tip.likes || [];
                const newLikes = likes.includes(user.uid) 
                    ? likes.filter(id => id !== user.uid) 
                    : [...likes, user.uid];
                await updateDoc(tipRef, { likes: newLikes });
            };

            const removeTip = async (id) => {
                if (window.confirm("Wil je deze tip definitief verwijderen?")) {
                    const tipRef = doc(db, 'artifacts', appId, 'public', 'data', 'tips', id);
                    await deleteDoc(tipRef);
                }
            };

            // RENDER
            return (
                <div className="min-h-screen bg-white text-slate-900 selection:bg-orange-100 font-sans">
                    {/* NAVBAR */}
                    <nav className="fixed w-full z-40 bg-white/80 backdrop-blur-md border-b border-slate-100 px-6 py-4">
                        <div className="max-w-7xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-2 group cursor-pointer">
                                <div className="bg-orange-500 p-2 rounded-xl group-hover:rotate-12 transition-transform">
                                    <Icon name="utensils" className="text-white" size={20} />
                                </div>
                                <span className="text-xl font-black uppercase tracking-tighter">De Weekhap</span>
                            </div>
                            <div className="hidden md:flex gap-8 text-xs font-black uppercase tracking-widest text-slate-400">
                                <a href="#planner" className="hover:text-orange-500 transition-colors">Planner</a>
                                <a href="#blog" className="hover:text-orange-500 transition-colors">Blog</a>
                            </div>
                        </div>
                    </nav>

                    {/* HERO */}
                    <section id="planner" className="pt-32 pb-20 px-6 text-center animate-fade-in">
                        <div className="max-w-4xl mx-auto">
                            <span className="inline-block bg-orange-50 text-orange-600 px-4 py-1 rounded-full text-[10px] font-black uppercase mb-6 tracking-widest">Bespaar tijd & geld</span>
                            <h1 className="text-5xl md:text-7xl font-black uppercase tracking-tighter leading-none mb-8">Wat eten we <span className="text-orange-500">vandaag?</span></h1>
                            <p className="text-lg text-slate-500 mb-12 max-w-xl mx-auto">Genereer in één klik een gezond weekmenu inclusief een automatische boodschappenlijst.</p>
                            
                            {authError && (
                                <div className="bg-red-50 text-red-500 p-4 rounded-xl mb-6 text-sm font-bold">
                                    {authError}
                                </div>
                            )}

                            <button onClick={generateNewMenu} disabled={loading} className="bg-slate-900 text-white font-black px-10 py-6 rounded-[2rem] hover:bg-orange-500 transition-all shadow-2xl disabled:opacity-50 flex items-center gap-3 mx-auto uppercase tracking-widest text-sm active:scale-95">
                                {loading ? <Icon name="loader" className="animate-spin" /> : <Icon name="plus" />}
                                {loading ? 'Happen verzamelen...' : 'Genereer Weekmenu'}
                            </button>
                        </div>
                    </section>

                    {/* RESULTS */}
                    {generatedMenu.length > 0 && (
                        <section id="results" className="max-w-7xl mx-auto px-6 py-20 border-t border-slate-50 animate-fade-in">
                            <header className="flex flex-col md:flex-row justify-between items-end mb-16 gap-6">
                                <div className="text-left">
                                    <h2 className="text-4xl font-black uppercase tracking-tighter">Jouw Menu 🍎</h2>
                                    <p className="text-slate-400 font-bold mt-2">Zeven verse suggesties voor de hele week.</p>
                                </div>
                                <div className="flex gap-3 flex-wrap">
                                    <button onClick={() => setShowShoppingList(true)} className="bg-blue-600 text-white font-black px-6 py-4 rounded-2xl flex items-center gap-2 uppercase text-[10px] tracking-widest shadow-lg shadow-blue-100 hover:bg-blue-700 transition-colors">
                                        <Icon name="shopping-cart" size={16} /> Lijstje
                                    </button>
                                    <button onClick={() => window.open(`https://wa.me/?text=Check ons weekmenu!`)} className="bg-green-500 text-white font-black px-6 py-4 rounded-2xl flex items-center gap-2 uppercase text-[10px] tracking-widest shadow-lg shadow-green-100 hover:bg-green-600 transition-colors">
                                        <Icon name="message-circle" size={16} /> WhatsApp
                                    </button>
                                </div>
                            </header>
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                                {generatedMenu.map((recipe, i) => (
                                    <div key={i} className="bg-white border border-slate-100 p-8 rounded-[2.5rem] hover:border-orange-200 transition-all hover:shadow-xl text-left group">
                                        <span className="bg-slate-50 text-slate-400 text-[10px] font-black px-3 py-1 rounded-full uppercase">Dag {i+1}</span>
                                        <h3 className="text-xl font-black mt-4 mb-4 group-hover:text-orange-600 transition-colors">{recipe.title}</h3>
                                        <p className="text-xs text-slate-400 font-bold uppercase tracking-widest">{recipe.ingredients.length} Ingrediënten</p>
                                    </div>
                                ))}
                            </div>
                        </section>
                    )}

                    {/* BLOG */}
                    <section id="blog" className="bg-slate-900 py-24 px-6 overflow-hidden text-left">
                        <div className="max-w-7xl mx-auto">
                            <div className="flex flex-col md:flex-row justify-between items-end mb-16 gap-6">
                                <div>
                                    <span className="text-[10px] font-black text-orange-400 uppercase tracking-[0.4em] mb-4 block">Deel je kennis</span>
                                    <h2 className="text-5xl font-black text-white uppercase tracking-tighter">Keukengeheimen</h2>
                                </div>
                                <button onClick={addCommunityTip} className="bg-white text-slate-900 font-black px-8 py-4 rounded-2xl uppercase text-[10px] tracking-widest hover:scale-105 transition-transform">Tip delen +</button>
                            </div>
                            
                            <div className="flex gap-6 overflow-x-auto pb-10 no-scrollbar">
                                {communityTips.length > 0 ? communityTips.map(tip => (
                                    <article key={tip.id} className="min-w-[320px] md:min-w-[400px] bg-slate-800 p-10 rounded-[3rem] border border-slate-700/50 flex flex-col justify-between">
                                        <div>
                                            <Icon name="quote" className="text-orange-500/20 mb-6" size={40} />
                                            <p className="text-lg font-bold text-slate-200 italic mb-8">"{tip.text}"</p>
                                        </div>
                                        <div className="flex items-center justify-between pt-8 border-t border-slate-700/50">
                                            <div className="flex items-center gap-3">
                                                <div className="w-8 h-8 rounded-full bg-orange-500 flex items-center justify-center text-white font-black text-[10px]">
                                                    {tip.author?.charAt(0) || 'G'}
                                                </div>
                                                <span className="font-black uppercase text-[10px] tracking-widest text-slate-500">{tip.author}</span>
                                            </div>
                                            <div className="flex gap-2">
                                                <button onClick={() => toggleLike(tip)} className={`flex items-center gap-2 px-4 py-2 rounded-full transition-all ${tip.likes?.includes(user?.uid) ? 'bg-orange-500 text-white' : 'bg-slate-700 text-slate-400'}`}>
                                                    <Icon name="heart" size={14} fill={tip.likes?.includes(user?.uid) ? "white" : "none"} />
                                                    <span className="font-black text-xs">{tip.likes?.length || 0}</span>
                                                </button>
                                                {(user?.email === ADMIN_EMAIL || user?.uid === tip.userId) && (
                                                    <button onClick={() => removeTip(tip.id)} className="p-2 text-slate-600 hover:text-red-400 transition-colors">
                                                        <Icon name="trash-2" size={16} />
                                                    </button>
                                                )}
                                            </div>
                                        </div>
                                    </article>
                                )) : (
                                    <div className="text-slate-500 font-bold italic py-10 w-full text-center bg-slate-800/50 rounded-[2rem]">
                                        {user ? "Nog geen tips. Wees de eerste!" : "Verbinden met community database..."}
                                    </div>
                                )}
                            </div>
                        </div>
                    </section>

                    {/* SHOPPING LIST MODAL */}
                    {showShoppingList && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-md animate-fade-in">
                            <div className="bg-white w-full max-w-lg rounded-[3.5rem] p-10 relative text-left shadow-2xl">
                                <button onClick={() => setShowShoppingList(false)} className="absolute top-8 right-8 p-2 bg-slate-100 rounded-full hover:bg-slate-200 transition-colors">
                                    <Icon name="x" size={20} />
                                </button>
                                <h2 className="text-3xl font-black uppercase mb-8">Boodschappen</h2>
                                <div className="max-h-[50vh] overflow-y-auto space-y-3 mb-10 no-scrollbar">
                                    {shoppingList.length > 0 ? shoppingList.map((item, i) => (
                                        <div key={i} className="flex items-center gap-4 p-4 bg-slate-50 rounded-2xl">
                                            <div className="w-5 h-5 border-2 border-slate-200 rounded-md flex items-center justify-center">
                                                <Icon name="check" size={12} className="text-slate-200" />
                                            </div>
                                            <span className="font-bold text-slate-700">{item}</span>
                                        </div>
                                    )) : <p className="text-slate-400 italic">Genereer eerst een menu.</p>}
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <button onClick={copyToClipboard} className="bg-slate-900 text-white font-black py-5 rounded-2xl uppercase tracking-widest text-[10px] flex items-center justify-center gap-2 hover:bg-slate-800 transition-colors">
                                        {copyStatus ? <Icon name="check" size={18} /> : <Icon name="copy" size={18} />}
                                        {copyStatus ? 'Klaar!' : 'Kopieer'}
                                    </button>
                                    <button onClick={() => window.print()} className="border-2 border-slate-900 text-slate-900 font-black py-5 rounded-2xl uppercase tracking-widest text-[10px] flex items-center justify-center gap-2 hover:bg-slate-50 transition-colors">
                                        <Icon name="printer" size={18} /> Print
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* FOOTER */}
                    <footer className="bg-slate-50 py-12 px-6 text-center border-t border-slate-100">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-8">
                            <div className="flex items-center gap-2">
                                <Icon name="utensils" className="text-orange-500" size={16} />
                                <span className="text-sm font-black uppercase tracking-tighter">De Weekhap &copy; 2026</span>
                            </div>
                            <div className="flex gap-6 text-[10px] font-black uppercase tracking-widest text-slate-400">
                                <a href="#" className="hover:text-slate-900">Privacy</a>
                                <a href="#" className="hover:text-slate-900">LinkPizza Partners</a>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
