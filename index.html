<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>De Weekhap | Jouw Slimme Maaltijdplanner</title>

    <!-- React & Babel via CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap');
        body { font-family: 'Outfit', sans-serif; scroll-behavior: smooth; }
        .animate-bounce-slow { animation: bounce 3s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(-5%); } 50% { transform: translateY(0); } }

        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 selection:bg-orange-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Lucide Icon component
        const Icon = ({ name, size = 20, className = "", fill = "none" }) => {
            const iconRef = useRef(null);

            useEffect(() => {
                if (window.lucide && iconRef.current) {
                    window.lucide.createIcons({
                        icons: { [name]: window.lucide.icons[name] },
                        nameAttr: 'data-lucide',
                        root: iconRef.current.parentNode
                    });
                }
            }, [name]);

            return (
                <i
                    ref={iconRef}
                    data-lucide={name}
                    className={className}
                    style={{
                        width: size,
                        height: size,
                        fill: fill === 'currentColor' ? 'currentColor' : 'none'
                    }}
                ></i>
            );
        };

        function App() {
            const [view, setView] = useState('home');

            // localStorage state
            const [savedRecipes, setSavedRecipes] = useState(() => {
                try {
                    return JSON.parse(localStorage.getItem('weekhap_saved') || '[]');
                } catch {
                    return [];
                }
            });

            const [communityRecipes, setCommunityRecipes] = useState(() => {
                try {
                    return JSON.parse(localStorage.getItem('weekhap_community') || '[]');
                } catch {
                    return [];
                }
            });

            const [generatedMenu, setGeneratedMenu] = useState([]);
            const [loading, setLoading] = useState(false);
            const [selectedRecipe, setSelectedRecipe] = useState(null);
            const [preferences, setPreferences] = useState("");
            const [servings, setServings] = useState(2);
            const [noResultsError, setNoResultsError] = useState(false);

            const [formData, setFormData] = useState({
                title: '',
                category: 'Diner',
                ingredients: '',
                instructions: ''
            });
            const [uploadedImage, setUploadedImage] = useState(null);

            // Opslaan in localStorage bij wijzigingen
            useEffect(() => {
                try {
                    localStorage.setItem('weekhap_saved', JSON.stringify(savedRecipes));
                } catch (e) {
                    console.error('Kon savedRecipes niet opslaan in localStorage', e);
                }
            }, [savedRecipes]);

            useEffect(() => {
                try {
                    localStorage.setItem('weekhap_community', JSON.stringify(communityRecipes));
                } catch (e) {
                    console.error('Kon communityRecipes niet opslaan in localStorage', e);
                }
            }, [communityRecipes]);

            useEffect(() => {
                document.title = selectedRecipe
                    ? `${selectedRecipe.title} - De Weekhap`
                    : "De Weekhap | Jouw Slimme Maaltijdplanner";
            }, [selectedRecipe]);

            const parseIngredient = (ingStr, factor) => {
                const match = ingStr.match(/^(\d+[\.,]?\d*)\s*(.*)$/);
                if (match) {
                    const num = parseFloat(match[1].replace(',', '.'));
                    const scaled = (num * factor).toLocaleString('nl-NL', { maximumFractionDigits: 1 });
                    return `${scaled} ${match[2]}`;
                }
                return ingStr;
            };

            const generateWeekMenu = () => {
                setLoading(true);
                setNoResultsError(false);

                setTimeout(() => {
                    const baseRecipes = [
                        { id: 'b1', title: 'Romige Pasta Pesto', image: 'https://images.unsplash.com/photo-1473093295043-cdd812d0e601?w=800', category: 'Pasta', ingredients: '200g Penne\n2 el Pesto\n200g Kipstukjes\n100g Cherrytomaatjes', instructions: 'Kook pasta. Bak kip. Meng alles met pesto.' },
                        { id: 'b2', title: 'Mexicaanse Taco Party', image: 'https://images.unsplash.com/photo-1565299585323-38d6b0865b47?w=800', category: 'Mexicaans', ingredients: '4 Taco schelpen\n250g Gehakt\n100g Sla', instructions: 'Bak gehakt. Vul de taco schelpen.' },
                        { id: 'b3', title: 'Gezonde Buddha Bowl', image: 'https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=800', category: 'Salade', ingredients: '150g Quinoa\n1 Avocado\n100g Spinazie', instructions: 'Kook quinoa. Snijd avocado. Mix alles.' },
                        { id: 'b4', title: 'Thaise Groene Curry', image: 'https://images.unsplash.com/photo-1455619452474-d2be8b1e70cd?w=800', category: 'Aziatisch', ingredients: '400ml Kokosmelk\n2 el Curry pasta\n1 Paprika', instructions: 'Kook curry met kokosmelk en groenten.' },
                        { id: 'b5', title: 'Zalm uit de Oven', image: 'https://images.unsplash.com/photo-1467003909585-2f8a72700288?w=800', category: 'Vis', ingredients: '2 Zalmfilets\n200g Asperges', instructions: 'Bak 15 min op 180 graden.' },
                        { id: 'b6', title: 'Stamppot Boerenkool', image: 'https://images.unsplash.com/photo-1582576163090-6c9147d8e48b?w=800', category: 'Hollands', ingredients: '500g Aardappelen\n300g Boerenkool', instructions: 'Koken en stampen met jus.' },
                        { id: 'b7', title: 'Falafel Wrap', image: 'https://images.unsplash.com/photo-1541518763669-27fef04b14ea?w=800', category: 'Vega', ingredients: '2 Wraps\n6 Falafel balletjes', instructions: 'Bak falafel. Rol in wrap met groenten.' },
                        { id: 'b8', title: 'Lasagne Tradizionale', image: 'https://images.unsplash.com/photo-1574894709920-11b28e7367e3?w=800', category: 'Pasta', ingredients: '250g Bladen\n300g Gehakt', instructions: 'Lagen maken en 40 min in de oven.' }
                    ];

                    const allPossible = [...baseRecipes, ...communityRecipes];
                    const dislikes = preferences
                        .toLowerCase()
                        .split(/[, \n]+/)
                        .filter(w => w.length > 2 && !['geen', 'zonder', 'extra'].includes(w));

                    const filtered = allPossible.filter(r => {
                        const text = `${r.title} ${r.ingredients} ${r.category}`.toLowerCase();
                        return !dislikes.some(bad => text.includes(bad));
                    });

                    if (filtered.length < 7) {
                        setNoResultsError(true);
                        setGeneratedMenu([]);
                    } else {
                        const shuffled = [...filtered].sort(() => 0.5 - Math.random());
                        setGeneratedMenu(shuffled.slice(0, 7));
                        setTimeout(() => window.scrollTo({ top: 600, behavior: 'smooth' }), 100);
                    }
                    setLoading(false);
                }, 600);
            };

            const handleImage = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => setUploadedImage(reader.result);
                    reader.readAsDataURL(file);
                }
            };

            const submitRecipe = (e) => {
                e.preventDefault();
                if (!uploadedImage) {
                    alert("Voeg een foto toe!");
                    return;
                }

                const newRecipe = {
                    ...formData,
                    id: 'c_' + Date.now(),
                    image: uploadedImage
                };

                setCommunityRecipes([newRecipe, ...communityRecipes]);
                setView('home');
                setFormData({ title: '', category: 'Diner', ingredients: '', instructions: '' });
                setUploadedImage(null);
            };

            const toggleSave = (recipe) => {
                const exists = savedRecipes.find(r => r.id === recipe.id);
                if (exists) {
                    setSavedRecipes(savedRecipes.filter(r => r.id !== recipe.id));
                } else {
                    setSavedRecipes([...savedRecipes, recipe]);
                }
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header */}
                    <header className="sticky top-0 z-50 bg-white/90 backdrop-blur-xl border-b border-slate-200 px-6 h-20 flex items-center justify-between shadow-sm">
                        <div
                            className="flex items-center gap-3 cursor-pointer"
                            onClick={() => { setView('home'); setSelectedRecipe(null); }}
                        >
                            <div className="w-10 h-10 bg-orange-600 rounded-xl flex items-center justify-center text-white font-black shadow-lg shadow-orange-200 animate-bounce-slow text-xl italic">
                                W
                            </div>
                            <span className="font-black text-2xl tracking-tighter uppercase italic text-slate-900 hidden sm:block">
                                De Weekhap
                            </span>
                        </div>

                        <nav className="flex gap-4 md:gap-8">
                            {['home', 'add', 'saved'].map((v) => (
                                <button
                                    key={v}
                                    onClick={() => setView(v)}
                                    className={`font-black text-[10px] uppercase tracking-[0.2em] transition-all ${
                                        view === v ? 'text-orange-600' : 'text-slate-400 hover:text-slate-600'
                                    }`}
                                >
                                    {v === 'home' ? 'Generator' : v === 'add' ? 'Deel Recept' : 'Kookboek'}
                                </button>
                            ))}
                        </nav>

                        <div className="flex items-center gap-4">
                            <a
                                href="https://linkpizza.com"
                                target="_blank"
                                rel="noreferrer"
                                className="hidden lg:block bg-slate-100 px-4 py-2 rounded-full text-[10px] font-black text-slate-500 uppercase hover:bg-orange-600 hover:text-white transition-all"
                            >
                                LinkPizza Influencer
                            </a>
                            <div className="w-10 h-10 rounded-full bg-slate-200 border-2 border-white shadow-sm flex items-center justify-center">
                                <Icon name="user" size={18} className="text-slate-500" />
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 pb-20">
                        {/* Home / Generator */}
                        {view === 'home' && (
                            <div className="p-4 md:p-6 max-w-7xl mx-auto space-y-12 pt-10 fade-in">
                                <section className="bg-white rounded-[3rem] p-8 md:p-16 border border-slate-200 shadow-xl relative overflow-hidden flex flex-col items-center text-center">
                                    <div className="relative z-10 max-w-3xl">
                                        <span className="bg-orange-100 text-orange-600 px-4 py-1 rounded-full text-[10px] font-black uppercase tracking-widest mb-6 inline-block">
                                            Maaltijdplanner GitHub Editie
                                        </span>
                                        <h1 className="text-5xl md:text-7xl lg:text-8xl font-black text-slate-900 leading-[0.9] uppercase tracking-tighter mb-8">
                                            Plan Je <span className="text-orange-600 italic">Gezonde</span> Week.
                                        </h1>

                                        <div className="flex flex-col md:flex-row gap-4 justify-center items-center mb-10 w-full max-w-xl mx-auto">
                                            <div className="bg-slate-50 p-4 rounded-2xl border flex items-center gap-6 w-full md:w-auto">
                                                <span className="text-[10px] font-black uppercase text-slate-400 tracking-widest">
                                                    Personen
                                                </span>
                                                <div className="flex items-center gap-4">
                                                    <button
                                                        onClick={() => setServings(Math.max(1, servings - 1))}
                                                        className="w-10 h-10 bg-white border rounded-lg font-bold hover:bg-orange-50 hover:text-orange-600"
                                                    >
                                                        -
                                                    </button>
                                                    <span className="text-xl font-black w-4 text-center">{servings}</span>
                                                    <button
                                                        onClick={() => setServings(servings + 1)}
                                                        className="w-10 h-10 bg-white border rounded-lg font-bold hover:bg-orange-50 hover:text-orange-600"
                                                    >
                                                        +
                                                    </button>
                                                </div>
                                            </div>
                                            <input
                                                type="text"
                                                value={preferences}
                                                onChange={(e) => setPreferences(e.target.value)}
                                                placeholder="Geen vis, vega, extra pittig..."
                                                className="flex-1 bg-slate-50 p-5 rounded-2xl border-none outline-none font-bold text-slate-700 shadow-inner w-full"
                                            />
                                        </div>

                                        <button
                                            onClick={generateWeekMenu}
                                            disabled={loading}
                                            className="bg-slate-900 text-white px-10 md:px-12 py-5 md:py-6 rounded-[2rem] font-black uppercase tracking-[0.2em] flex items-center justify-center gap-4 transition-all hover:scale-105 active:scale-95 shadow-2xl w-full md:w-auto disabled:opacity-50 mx-auto"
                                        >
                                            {loading ? (
                                                <Icon name="refresh-cw" className="animate-spin" />
                                            ) : (
                                                <Icon name="zap" />
                                            )}
                                            Genereer 7 Dagen
                                        </button>
                                    </div>
                                    <Icon
                                        name="utensils"
                                        size={300}
                                        className="absolute left-[-5%] bottom-[-5%] opacity-[0.03] text-slate-900 rotate-12"
                                    />
                                </section>

                                {noResultsError ? (
                                    <div className="text-center py-20 bg-orange-50 rounded-[3rem] border-2 border-dashed border-orange-200 fade-in">
                                        <div className="flex justify-center mb-4 text-orange-300">
                                            <Icon name="search-x" size={48} />
                                        </div>
                                        <h3 className="text-2xl font-black text-orange-900 uppercase">
                                            Te kieskeurig?
                                        </h3>
                                        <p className="text-orange-600 font-bold uppercase text-xs tracking-widest">
                                            Pas je filters aan voor meer resultaten.
                                        </p>
                                    </div>
                                ) : (
                                    generatedMenu.length > 0 && (
                                        <section className="space-y-10 fade-in">
                                            <div className="flex flex-col md:flex-row items-start md:items-center justify-between border-b border-slate-200 pb-6 gap-4">
                                                <h2 className="text-3xl font-black uppercase tracking-tighter italic">
                                                    Jouw Weekmenu
                                                </h2>
                                                <div className="flex gap-4">
                                                    <span className="bg-slate-900 text-white px-4 py-2 rounded-xl font-black text-[10px] uppercase tracking-widest">
                                                        7 Recepten
                                                    </span>
                                                    <span className="bg-orange-600 text-white px-4 py-2 rounded-xl font-black text-[10px] uppercase tracking-widest">
                                                        {servings} Pers.
                                                    </span>
                                                </div>
                                            </div>

                                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                                                {generatedMenu.map((r, i) => (
                                                    <article
                                                        key={r.id}
                                                        onClick={() => setSelectedRecipe(r)}
                                                        className="group bg-white rounded-[2.5rem] overflow-hidden shadow-sm hover:shadow-2xl hover:translate-y-[-10px] transition-all duration-500 border border-slate-100 cursor-pointer"
                                                    >
                                                        <div className="h-56 relative overflow-hidden">
                                                            <img
                                                                src={r.image}
                                                                className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-1000"
                                                                alt={r.title}
                                                            />
                                                            <div className="absolute top-4 left-4 bg-white/90 backdrop-blur-md text-slate-900 px-4 py-1 rounded-full text-[10px] font-black uppercase tracking-tighter shadow-sm">
                                                                Dag {i + 1}
                                                            </div>
                                                        </div>
                                                        <div className="p-8">
                                                            <p className="text-[10px] font-black text-orange-600 uppercase tracking-[0.2em] mb-2">
                                                                {r.category}
                                                            </p>
                                                            <h3 className="font-black text-xl text-slate-800 uppercase leading-none mb-4 group-hover:text-orange-600 transition-colors">
                                                                {r.title}
                                                            </h3>
                                                            <div className="flex items-center gap-2 text-slate-400 font-bold text-[10px] uppercase tracking-widest">
                                                                <Icon name="list" size={12} /> Bekijk Recept
                                                            </div>
                                                        </div>
                                                    </article>
                                                ))}
                                            </div>
                                        </section>
                                    )
                                )}
                            </div>
                        )}

                        {/* Recept delen */}
                        {view === 'add' && (
                            <section className="max-w-3xl mx-auto py-10 md:py-20 px-4 md:px-6 fade-in">
                                <h2 className="text-4xl md:text-5xl font-black text-slate-900 uppercase tracking-tighter mb-4 text-center">
                                    Deel Een <span className="text-orange-600">Hap</span>.
                                </h2>
                                <p className="text-center text-slate-400 font-bold uppercase text-[10px] tracking-widest mb-12">
                                    Inspireer de community en verdien extra via LinkPizza
                                </p>

                                <form onSubmit={submitRecipe} className="bg-white p-6 md:p-16 rounded-[3rem] md:rounded-[4rem] shadow-2xl border border-slate-100 space-y-8">
                                    <div className="space-y-4">
                                        <label className="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-4">
                                            Gerecht foto (klik om te uploaden)
                                        </label>
                                        <div
                                            onClick={() => document.getElementById('img-up').click()}
                                            className="w-full h-64 md:h-80 bg-slate-50 border-4 border-dashed border-slate-200 rounded-[3rem] flex flex-col items-center justify-center cursor-pointer hover:bg-orange-50 hover:border-orange-200 transition-all overflow-hidden relative shadow-inner"
                                        >
                                            {uploadedImage ? (
                                                <img src={uploadedImage} className="w-full h-full object-cover" alt="Gerecht" />
                                            ) : (
                                                <div className="text-center flex flex-col items-center">
                                                    <Icon name="camera" size={48} className="text-slate-200 mb-4" />
                                                    <span className="text-xs font-black text-slate-300 uppercase tracking-widest">
                                                        Klik om te kiezen
                                                    </span>
                                                </div>
                                            )}
                                        </div>
                                        <input
                                            type="file"
                                            id="img-up"
                                            hidden
                                            accept="image/*"
                                            onChange={handleImage}
                                        />
                                    </div>

                                    <input
                                        required
                                        placeholder="Naam van het gerecht..."
                                        className="w-full bg-slate-50 p-6 rounded-3xl font-black text-xl outline-none focus:ring-4 ring-orange-100 transition-all border border-slate-100"
                                        value={formData.title}
                                        onChange={e => setFormData({ ...formData, title: e.target.value })}
                                    />

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <select
                                            className="bg-slate-50 p-6 rounded-3xl font-black uppercase text-[10px] tracking-widest outline-none border border-slate-100"
                                            value={formData.category}
                                            onChange={e => setFormData({ ...formData, category: e.target.value })}
                                        >
                                            <option>Diner</option>
                                            <option>Lunch</option>
                                            <option>Ontbijt</option>
                                            <option>Snack</option>
                                            <option>Vega</option>
                                        </select>
                                        <div className="bg-orange-50 p-4 rounded-3xl flex items-center justify-center text-[10px] font-black text-orange-600 uppercase tracking-widest">
                                            Recept voor 1 pers.
                                        </div>
                                    </div>

                                    <textarea
                                        required
                                        placeholder="IngrediÃ«nten (Ã©Ã©n per regel, vb: 200g Pasta)..."
                                        className="w-full bg-slate-50 p-8 rounded-[2.5rem] font-bold h-40 outline-none focus:ring-4 ring-orange-100 border border-slate-100"
                                        value={formData.ingredients}
                                        onChange={e => setFormData({ ...formData, ingredients: e.target.value })}
                                    />
                                    <textarea
                                        required
                                        placeholder="Bereidingswijze stap voor stap..."
                                        className="w-full bg-slate-50 p-8 rounded-[2.5rem] font-bold h-56 outline-none focus:ring-4 ring-orange-100 border border-slate-100"
                                        value={formData.instructions}
                                        onChange={e => setFormData({ ...formData, instructions: e.target.value })}
                                    />

                                    <div className="bg-blue-50 p-6 md:p-8 rounded-[2.5rem] border border-blue-100 flex flex-col md:flex-row items-start gap-4">
                                        <div className="bg-blue-500 text-white p-3 rounded-2xl shrink-0">
                                            <Icon name="external-link" size={20} />
                                        </div>
                                        <div>
                                            <h4 className="font-black text-blue-900 uppercase text-xs tracking-widest mb-1">
                                                Affiliate Tip
                                            </h4>
                                            <p className="text-blue-700 text-xs font-medium leading-relaxed">
                                                Verdien geld met je passie! Voeg je{" "}
                                                <a
                                                    href="https://linkpizza.com"
                                                    target="_blank"
                                                    rel="noreferrer"
                                                    className="font-black underline"
                                                >
                                                    LinkPizza
                                                </a>{" "}
                                                affiliate links toe als je jouw recept deelt met volgers.
                                            </p>
                                        </div>
                                    </div>

                                    <button
                                        type="submit"
                                        className="w-full bg-orange-600 text-white font-black py-6 rounded-[2.5rem] uppercase tracking-[0.3em] shadow-xl shadow-orange-200 hover:bg-orange-700 active:scale-95 transition-all text-sm"
                                    >
                                        Hap Lokaal Opslaan
                                    </button>
                                </form>
                            </section>
                        )}

                        {/* Kookboek */}
                        {view === 'saved' && (
                            <section className="max-w-7xl mx-auto px-4 md:px-6 py-10 md:py-20 fade-in">
                                <h2 className="text-4xl md:text-5xl font-black text-slate-900 uppercase tracking-tighter mb-12">
                                    Mijn <span className="text-orange-600">Kookboek</span> ðŸ“–
                                </h2>
                                {savedRecipes.length > 0 ? (
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                                        {savedRecipes.map((r) => (
                                            <article
                                                key={r.id}
                                                onClick={() => setSelectedRecipe(r)}
                                                className="bg-white rounded-[2.5rem] overflow-hidden shadow-sm border border-slate-100 cursor-pointer hover:shadow-xl transition-all"
                                            >
                                                <img src={r.image} className="h-56 w-full object-cover" alt={r.title} />
                                                <div className="p-8">
                                                    <h3 className="font-black text-lg text-slate-800 uppercase leading-none">
                                                        {r.title}
                                                    </h3>
                                                </div>
                                            </article>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="text-center py-32 bg-slate-100 rounded-[4rem] border-2 border-dashed border-slate-200">
                                        <p className="font-black text-slate-400 uppercase tracking-[0.3em] italic text-sm">
                                            Je kookboek is nog leeg...
                                        </p>
                                        <button
                                            onClick={() => setView('home')}
                                            className="mt-8 text-orange-600 font-black uppercase text-[10px] tracking-widest hover:underline"
                                        >
                                            Ga naar de generator
                                        </button>
                                    </div>
                                )}
                            </section>
                        )}
                    </main>

                    {/* Recipe Modal */}
                    {selectedRecipe && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 md:p-8 bg-slate-900/80 backdrop-blur-xl fade-in">
                            <div className="bg-white rounded-[3rem] md:rounded-[4rem] max-w-6xl w-full max-h-full overflow-y-auto relative p-6 md:p-16 shadow-2xl">
                                <button
                                    onClick={() => setSelectedRecipe(null)}
                                    className="absolute top-6 right-6 md:top-10 md:right-10 p-3 bg-slate-100 hover:bg-orange-600 hover:text-white rounded-full transition-all z-10 shadow-sm"
                                >
                                    <Icon name="x" size={24} />
                                </button>

                                <div className="grid grid-cols-1 lg:grid-cols-12 gap-10 md:gap-16 mt-8 md:mt-0">
                                    <div className="lg:col-span-5 space-y-8 md:space-y-10">
                                        <div className="relative aspect-square rounded-[2rem] md:rounded-[3.5rem] overflow-hidden shadow-2xl border-4 md:border-8 border-white">
                                            <img
                                                src={selectedRecipe.image}
                                                className="w-full h-full object-cover"
                                                alt={selectedRecipe.title}
                                            />
                                        </div>

                                        <div className="flex flex-col gap-4">
                                            <h2 className="text-3xl md:text-5xl lg:text-6xl font-black text-slate-900 uppercase tracking-tighter leading-[0.85]">
                                                {selectedRecipe.title}
                                            </h2>
                                            <div className="flex flex-wrap gap-3">
                                                <span className="bg-orange-600 text-white px-5 py-2 rounded-2xl text-[10px] font-black uppercase tracking-widest">
                                                    {selectedRecipe.category}
                                                </span>
                                                <span className="bg-slate-100 text-slate-500 px-5 py-2 rounded-2xl text-[10px] font-black uppercase tracking-widest">
                                                    {servings} Personen
                                                </span>
                                            </div>
                                        </div>

                                        <div className="flex flex-col sm:flex-row gap-4">
                                            <button
                                                onClick={() => toggleSave(selectedRecipe)}
                                                className={`flex-1 py-5 rounded-[2rem] font-black uppercase text-[10px] tracking-widest flex items-center justify-center gap-3 transition-all ${
                                                    savedRecipes.find(r => r.id === selectedRecipe.id)
                                                        ? 'bg-red-50 text-red-500 border border-red-100'
                                                        : 'bg-slate-100 text-slate-500 hover:bg-slate-200'
                                                }`}
                                            >
                                                <Icon
                                                    name="heart"
                                                    fill={
                                                        savedRecipes.find(r => r.id === selectedRecipe.id)
                                                            ? 'currentColor'
                                                            : 'none'
                                                    }
                                                    size={18}
                                                />
                                                {savedRecipes.find(r => r.id === selectedRecipe.id)
                                                    ? 'Verwijder'
                                                    : 'Opslaan'}
                                            </button>
                                            <a
                                                href={`https://linkpizza.com/click?url=https://www.ah.nl/zoeken?query=${encodeURIComponent(selectedRecipe.title)}`}
                                                target="_blank"
                                                rel="noreferrer"
                                                className="flex-1 bg-slate-900 text-white px-6 py-5 rounded-[2rem] font-black uppercase text-[10px] tracking-[0.2em] flex justify-center items-center gap-3 shadow-xl hover:bg-black transition-all"
                                            >
                                                Bestel <Icon name="shopping-cart" size={18} />
                                            </a>
                                        </div>
                                    </div>

                                    <div className="lg:col-span-7 space-y-10 md:space-y-12">
                                        <section className="bg-slate-50 p-6 md:p-10 rounded-[2rem] md:rounded-[3rem] border border-slate-100">
                                            <h4 className="font-black text-orange-600 uppercase text-[10px] tracking-[0.2em] mb-6 md:mb-8 flex items-center gap-3">
                                                <Icon name="list" size={16} /> Boodschappenlijst ({servings} pers.)
                                            </h4>
                                            <ul className="grid grid-cols-1 md:grid-cols-2 gap-y-4 gap-x-10">
                                                {selectedRecipe.ingredients
                                                    .split('\n')
                                                    .filter(Boolean)
                                                    .map((ing, i) => (
                                                        <li
                                                            key={i}
                                                            className="text-sm font-bold text-slate-700 flex items-start gap-4 p-2 hover:bg-white rounded-xl transition-all"
                                                        >
                                                            <div className="w-5 h-5 bg-orange-100 rounded-full flex-shrink-0 flex items-center justify-center mt-0.5">
                                                                <div className="w-1.5 h-1.5 bg-orange-600 rounded-full" />
                                                            </div>
                                                            <span>{parseIngredient(ing, servings)}</span>
                                                        </li>
                                                    ))}
                                            </ul>
                                        </section>

                                        <section>
                                            <h4 className="font-black text-orange-600 uppercase text-[10px] tracking-[0.2em] mb-6 md:mb-8 flex items-center gap-3">
                                                <Icon name="clipboard-list" size={20} /> Bereiding
                                            </h4>
                                            <div className="space-y-8 md:space-y-10">
                                                {selectedRecipe.instructions
                                                    .split('\n')
                                                    .map((step, i) => step.trim() ? step : null)
                                                    .filter(Boolean)
                                                    .map((step, i) => (
                                                        <div key={i} className="flex gap-6 md:gap-8 group">
                                                            <div className="flex-shrink-0 w-10 h-10 md:w-12 md:h-12 bg-slate-900 text-white rounded-[1rem] md:rounded-[1.25rem] flex items-center justify-center text-xs md:text-sm font-black shadow-lg group-hover:bg-orange-600 transition-colors">
                                                                {i + 1}
                                                            </div>
                                                            <p className="text-slate-700 font-bold leading-relaxed pt-1 md:pt-2 text-base md:text-lg">
                                                                {step.replace(/^\d+\.\s*/, '')}
                                                            </p>
                                                        </div>
                                                    ))}
                                            </div>
                                        </section>

                                        <div className="pt-8 border-t border-slate-100 flex flex-col md:flex-row items-center justify-between gap-6">
                                            <div className="flex items-center gap-4">
                                                <div className="w-10 h-10 md:w-12 md:h-12 rounded-full bg-slate-200 flex items-center justify-center">
                                                    <Icon name="users" size={20} className="text-slate-500" />
                                                </div>
                                                <div>
                                                    <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">
                                                        Gedeeld door
                                                    </p>
                                                    <p className="font-black text-slate-800 uppercase italic">
                                                        Weekhap Community
                                                    </p>
                                                </div>
                                            </div>
                                            <a
                                                href="https://linkpizza.com"
                                                target="_blank"
                                                rel="noreferrer"
                                                className="text-[10px] font-black text-orange-600 uppercase tracking-widest hover:underline text-center"
                                            >
                                                Word ook een LinkPizza creator â†’
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Footer */}
                    <footer className="py-16 md:py-20 px-6 border-t border-slate-200 bg-white mt-10 md:mt-20">
                        <div className="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-12 md:gap-16 text-center md:text-left">
                            <div className="space-y-6">
                                <div className="flex items-center justify-center md:justify-start gap-2">
                                    <div className="bg-slate-900 text-white w-6 h-6 flex items-center justify-center font-black rounded italic">
                                        W
                                    </div>
                                    <span className="font-black uppercase tracking-tighter">
                                        De Weekhap
                                    </span>
                                </div>
                                <p className="text-xs font-medium text-slate-400 leading-relaxed uppercase tracking-widest">
                                    De slimste manier om je wekelijkse maaltijden te plannen, je budget te beheren en gezonder te eten.
                                </p>
                            </div>

                            <div className="space-y-6">
                                <h5 className="font-black text-[10px] uppercase tracking-[0.3em] text-slate-900">
                                    Affiliate Partners
                                </h5>
                                <ul className="space-y-4 text-[10px] font-black text-slate-400 uppercase tracking-widest">
                                    <li>
                                        <a
                                            href="https://linkpizza.com"
                                            target="_blank"
                                            rel="noreferrer"
                                            className="hover:text-orange-600 transition-colors"
                                        >
                                            Aanmelden bij LinkPizza
                                        </a>
                                    </li>
                                    <li>
                                        <a href="#" className="hover:text-orange-600 transition-colors">
                                            Adverteren
                                        </a>
                                    </li>
                                    <li>
                                        <a href="#" className="hover:text-orange-600 transition-colors">
                                            Retail Koppelingen
                                        </a>
                                    </li>
                                </ul>
                            </div>

                            <div className="space-y-6">
                                <h5 className="font-black text-[10px] uppercase tracking-[0.3em] text-slate-900">
                                    Snel Naar
                                </h5>
                                <div className="flex flex-wrap justify-center md:justify-start gap-4">
                                    {['home', 'add', 'saved'].map(v => (
                                        <button
                                            key={v}
                                            onClick={() => setView(v)}
                                            className="text-[10px] font-black text-slate-400 uppercase border border-slate-200 px-4 py-2 rounded-full hover:border-orange-600 hover:text-orange-600 transition-all"
                                        >
                                            {v === 'home' ? 'Generator' : v === 'add' ? 'Deel Recept' : 'Kookboek'}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
