function translateText(text) {
  if (!text || typeof text !== 'string') return text;
  
  let translated = text;
  const lowerText = text.toLowerCase();
  
  // Vertaal bekende woorden/zinnen
  Object.entries(EN_TO_NL).forEach(([en, nl]) => {
    // Case-insensitive replacement met woordgrenzen
    const regex = new RegExp('\\b' + en + '\\b', 'gi');
    translated = translated.replace(regex, nl);
  });
  
  return translated;
}

let mealDBCache = [];
let mealDBLoading = false;

async function fetchMealDBRecipes(count = 20) {
  if (mealDBLoading) return [];
  mealDBLoading = true;
  try {
    const promises = [];
    for (let i = 0; i < count; i++) {
      promises.push(fetch('https://www.themealdb.com/api/json/v1/1/random.php'));
    }
    const responses = await Promise.all(promises);
    const data = await Promise.all(responses.map(r => r.json()));
    const meals = data.filter(d => d.meals && d.meals[0]).map(d => d.meals[0]).map(meal => {
      const ingredients = [];
      for (let i = 1; i <= 20; i++) {
        const ingredient = meal[`strIngredient${i}`];
        const measure = meal[`strMeasure${i}`];
        if (ingredient && ingredient.trim()) {
          const translatedIng = translateText(ingredient);
          const translatedMeasure = translateText(measure || '');
          ingredients.push(`${translatedMeasure} ${translatedIng}`.trim());
        }
      }
      
      const rawSteps = meal.strInstructions.split('.').map(s => s.trim()).filter(s => s.length > 10).slice(0, 7);
      const steps = rawSteps.map(step => translateText(step));
      
      const translatedTitle = translateText(meal.strMeal);
      const translatedCat = translateText(meal.strCategory || 'Internationaal');
      
      return {
        id: 'mdb' + meal.idMeal, 
        title: translatedTitle, 
        img: meal.strMealThumb, 
        ingr: ingredients.join('||'), 
        steps: steps.join('||'), 
        cat: translatedCat, 
        author: 'TheMealDB', 
        source: 'mealdb',
        originalTitle: meal.strMeal
      };
    });
    
    meals.forEach(meal => {
      if (!mealDBCache.find(m => m.id === meal.id)) {
        mealDBCache.push(meal);
      }
    });
    
    mealDBLoading = false;
    return meals;
  } catch (error) {
    console.error('Fout bij laden TheMealDB:', error);
    mealDBLoading = false;
    return [];
  }
}

function shuffleArray(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function expandSearchTerm(term) {
  const lowerTerm = term.toLowerCase();
  // Zoek naar exacte match in woordenboek
  if (TRANSLATION_MAP[lowerTerm]) {
    return `${term} ${TRANSLATION_MAP[lowerTerm]}`;
  }
  return term;
}

function filterByPrefs(recipes, extraFilter = '') {
  const prefs = db.preferences()[currentUser.email];
  
  return recipes.filter(r => {
    const txt = `${r.title} ${r.cat} ${r.ingr}`.toLowerCase();
    
    if (extraFilter && extraFilter.trim()) {
      const extraTerms = extraFilter.toLowerCase().split(' ').filter(t => t.trim());
      let hasExtraMatch = false;
      for (const term of extraTerms) {
        // Expandeer zoekterm met vertalingen
        const expandedTerm = expandSearchTerm(term);
        const searchWords = expandedTerm.toLowerCase().split(' ');
        
        for (const word of searchWords) {
          if (txt.includes(word)) {
            hasExtraMatch = true;
            break;
          }
        }
        if (hasExtraMatch) break;
      }
      if (!hasExtraMatch) return false;
    }
    
    if (prefs && prefs.niet) {
      const nietTerms = prefs.niet.toLowerCase().split(' ').filter(t => t.trim());
      for (const term of nietTerms) {
        const expandedTerm = expandSearchTerm(term);
        const searchWords = expandedTerm.toLowerCase().split(' ');
        for (const word of searchWords) {
          if (txt.includes(word)) return false;
        }
      }
    }
    if (prefs && prefs.wel) {
      const welTerms = prefs.wel.toLowerCase().split(' ').filter(t => t.trim());
      if (welTerms.length > 0) {
        let hasMatch = false;
        for (const term of welTerms) {
          const expandedTerm = expandSearchTerm(term);
          const searchWords = expandedTerm.toLowerCase().split(' ');
          for (const word of searchWords) {
            if (txt.includes(word)) {
              hasMatch = true;
              break;
            }
          }
          if (hasMatch) break;
        }
        if (!hasMatch) return false;
      }
    }
    return true;
  });
}

async function generateMenu(extraFilter = '') {
  const loadingMsg = document.createElement('div');
  loadingMsg.id = 'loadingMsg';
  loadingMsg.className = 'fixed top-20 right-4 bg-orange-600 text-white px-6 py-3 rounded-xl font-bold shadow-xl z-50';
  loadingMsg.textContent = extraFilter ? `🔍 Zoeken naar "${extraFilter}"...` : '🍽️ Weekmenu genereren...';
  document.body.appendChild(loadingMsg);
  
  const minRecipes = 14;
  let attempts = 0;
  const maxAttempts = 12;
  
  while (attempts < maxAttempts) {
    const currentRecipes = db.recipes();
    const filtered = filterByPrefs(currentRecipes, extraFilter);
    
    console.log(`Poging ${attempts + 1}: ${filtered.length} recepten beschikbaar (doel: ${minRecipes})`);
    
    if (filtered.length >= minRecipes) {
      console.log('✅ Genoeg recepten gevonden!');
      break;
    }
    
    const expandedSearch = expandSearchTerm(extraFilter);
    loadingMsg.textContent = extraFilter 
      ? `🌍 Laden... ${filtered.length}/${minRecipes} recepten (zoekt: ${expandedSearch})`
      : `🌍 Laden... ${filtered.length}/${minRecipes} recepten`;
    
    console.log(`🌍 Nieuwe recepten laden... (${filtered.length}/${minRecipes})`);
    await fetchMealDBRecipes(40);
    attempts++;
    await new Promise(resolve => setTimeout(resolve, 300));
  }
  
  const finalRecipes = db.recipes();
  const filtered = filterByPrefs(finalRecipes, extraFilter);
  
  console.log(`Finale check: ${filtered.length} recepten beschikbaar`);
  
  if (filtered.length < 7) {
    loadingMsg.remove();
    const expandedInfo = extraFilter ? expandSearchTerm(extraFilter) : '';
    return alert(`⚠️ Niet genoeg recepten gevonden (${filtered.length} beschikbaar).\n\n${extraFilter ? `Gezocht naar: ${expandedInfo}\n\nTip: Probeer een bredere zoekterm of laat het veld leeg!` : 'Probeer andere voorkeuren!'}`);
  }
  
  const days = ['Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag','Zondag'];
  const shuffled = shuffleArray(filtered);
  const selected = shuffled.slice(0, 7);
  
  if (lastGeneratedIds.length > 0) {
    const hasOverlap = selected.some(r => lastGeneratedIds.includes(r.id));
    if (hasOverlap && filtered.length >= 14) {
      console.log('⚠️ Overlap gedetecteerd, opnieuw genereren...');
      loadingMsg.remove();
      return generateMenu(extraFilter);
    }
  }
  
  currentMenu = selected.map((r,i) => ({...r, day: days[i]}));
  lastGeneratedIds = selected.map(r => r.id);
  
  loadingMsg.textContent = '✅ Weekmenu klaar!';
  setTimeout(() => loadingMsg.remove(), 1500);
  
  render();
}

              <div class="grid grid-cols-1 md:grid-cols-3 gap-2 text-xs md:text-sm">
                <div class="flex items-center gap-2">
                  <span class="text-blue-600">📅</span>
                  <span class="text-slate-600">Lid sinds: <strong>${u.registeredAt ? formatDate(u.registeredAt) : 'Onbekend'}</strong></span>
                </div>
                <div class="flex items-center gap-2">
                  <span class="text-green-600">🕐</span>
                  <span class="text-slate-600">Laatst online: <strong>${u.lastLogin ? formatDateTime(u.lastLogin) : 'Nooit'}</strong></span>
                </div>
                <div class="flex items-center gap-2">
                  <span class="text-orange-600">📊</span>
                  <span class="text-slate-600">Logins: <strong>${u.loginCount || 0}x</strong></span>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }
}

function savePrefs() {
  const wel = document.getElementById('prefWel').value.trim();
  const niet = document.getElementById('prefNiet').value.trim();
  const allPrefs = db.preferences();
  allPrefs[currentUser.email] = {wel, niet};
  db.set('userPreferences', allPrefs);
  alert('✅ Voorkeuren opgeslagen!');
  render();
}

          <button onclick="changeView('community')" class="px-2 lg:px-4 py-2 rounded-lg font-bold whitespace-nowrap ${view==='community'?'bg-orange-600 text-white':'hover:bg-slate-100'}">Community</button>

          <button onclick="changeView('saved');toggleMobileMenu()" class="w-full text-left px-4 py-3 rounded-lg font-bold ${view==='saved'?'bg-orange-600 text-white':'hover:bg-slate-100'}">📅 Weekmenu (${savedMenu.length})</button>

function renderMenu() {
  const saved = (db.savedMenus()[currentUser.email] || {}).recipes || [];
  const isSaved = saved.length === currentMenu.length && saved.every((r,i) => r.id === currentMenu[i].id);
  
  return `
    <div>
      <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 mb-8">
        <h2 class="text-3xl md:text-4xl font-black">Jouw Weekmenu 📅</h2>
        <div class="flex flex-wrap gap-3 w-full md:w-auto">
          ${!isSaved ? `<button onclick="saveMenu()" class="flex-1 md:flex-initial bg-green-600 text-white px-4 md:px-6 py-3 rounded-xl font-bold hover:bg-green-700 text-sm md:text-base whitespace-nowrap">💾 Bewaar</button>` : '<span class="text-green-600 font-bold text-base md:text-lg">✅ Opgeslagen</span>'}

        </div>
      </div>

      </div>
    </div>
  `;
}

function renderRecipeCard(recipe, idx, isSaved = false, isMyRecipes = false) {
  const reviews = db.reviews()[recipe.id] || [];
  const avgRating = reviews.length > 0 ? (reviews.reduce((s,r)=>s+r.rating,0)/reviews.length).toFixed(1) : 'N/A';
  const userSavedRecipes = db.savedRecipes()[currentUser.email] || [];
  const isRecipeSaved = userSavedRecipes.includes(recipe.id);
  
  return `
    <div class="recipe-card bg-white rounded-2xl p-4 shadow-xl hover:shadow-2xl transition-all hover:-translate-y-2 relative">
      <div onclick="showRecipe(${idx}, ${isSaved}, ${isMyRecipes})" class="cursor-pointer">
        <div class="relative mb-3 h-40 rounded-xl overflow-hidden">
          <img src="${recipe.img}" class="w-full h-full object-cover" />
          ${recipe.day ? `<div class="absolute top-2 left-2 bg-orange-600 text-white px-2 py-1 rounded-full text-xs font-bold">${recipe.day}</div>` : ''}
        </div>
        <h3 class="font-black text-base md:text-lg mb-1">${recipe.title}</h3>
        <div class="flex items-center justify-between">
          <span class="bg-orange-100 text-orange-800 px-2 py-1 rounded-full text-xs font-semibold">${recipe.cat}</span>
          <span class="text-xs md:text-sm font-bold">⭐ ${avgRating} (${reviews.length})</span>
        </div>
      </div>
      <button onclick="toggleSaveRecipe('${recipe.id}', event)" class="absolute top-6 right-6 w-10 h-10 md:w-12 md:h-12 rounded-full ${isRecipeSaved ? 'bg-gradient-to-br from-pink-500 to-red-500 shadow-lg' : 'bg-white border-2 border-slate-300'} hover:scale-110 transition-all flex items-center justify-center text-xl md:text-2xl">
        ${isRecipeSaved ? '❤️' : '🤍'}
      </button>
    </div>
  `;
}

function toggleSaveRecipe(recipeId, event) {
  event.stopPropagation();
  const savedRecipes = db.savedRecipes();
  if (!savedRecipes[currentUser.email]) savedRecipes[currentUser.email] = [];
  const userRecipes = savedRecipes[currentUser.email];
  const index = userRecipes.indexOf(recipeId);
  if (index > -1) {
    userRecipes.splice(index, 1);
  } else {
    userRecipes.push(recipeId);
  }
  db.set('savedRecipes', savedRecipes);
  render();
}

function showLogin() {
  document.getElementById('loginForm').classList.remove('hidden');
  document.getElementById('registerForm').classList.add('hidden');
}

function showRegister() {
  document.getElementById('loginForm').classList.add('hidden');
  document.getElementById('registerForm').classList.remove('hidden');
}

function login() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  if (!email || !password) return alert('⚠️ Vul alle velden in');
  const users = db.users();
  const userIndex = users.findIndex(u => u.email === email && u.password === password);
  if (userIndex === -1) return alert('❌ Verkeerde inloggegevens');
  
  users[userIndex].lastLogin = new Date().toISOString();
  users[userIndex].loginCount = (users[userIndex].loginCount || 0) + 1;
  db.set('users', users);
  
  currentUser = users[userIndex];
  db.set('currentUser', currentUser);
  view = 'home';
  fetchMealDBRecipes().then(() => render());
}

function register() {
  const name = document.getElementById('regName').value;
  const email = document.getElementById('regEmail').value;
  const password = document.getElementById('regPassword').value;
  if (!name || !email || !password) return alert('⚠️ Vul alle velden in');
  const users = db.users();
  if (users.find(u => u.email === email)) return alert('❌ Email al in gebruik');
  
  const newUser = { 
    name, 
    email, 
    password, 
    isAdmin: false,
    registeredAt: new Date().toISOString(),
    lastLogin: new Date().toISOString(),
    loginCount: 1
  };
  users.push(newUser);
  db.set('users', users);
  currentUser = newUser;
  db.set('currentUser', newUser);
  view = 'home';
  fetchMealDBRecipes().then(() => render());
}

function logout() {
  currentUser = null;
  db.set('currentUser', null);
  view = 'login';
  mobileMenuOpen = false;
  render();
}

function changeView(v) {
  view = v;
  mobileMenuOpen = false;
  render();
}

function saveMenu() {
  const menus = db.savedMenus();
  menus[currentUser.email] = { recipes: currentMenu, date: new Date().toISOString() };
  db.set('savedMenus', menus);
  render();
}

  let recipe;
  if (isMyRecipes) {
    const saved = db.savedRecipes()[currentUser.email] || [];
    const allRecipes = db.recipes();
    const myRecipes = saved.map(id => allRecipes.find(r => r.id === id)).filter(r => r);
    recipe = myRecipes[idx];
  } else if (isSaved) {
    recipe = (db.savedMenus()[currentUser.email].recipes[idx]);
  } else {
    recipe = currentMenu[idx];
  }
  
  const reviews = db.reviews()[recipe.id] || [];
  const ingredients = recipe.ingr.split('||');
  const steps = recipe.steps.split('||');
  
  activeTab = 'ingredients';
  
  const modal = document.createElement('div');
  modal.className = 'fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4';
  modal.onclick = () => modal.remove();
  
  modal.innerHTML = `
    <div class="bg-white rounded-3xl max-w-4xl w-full max-h-[90vh] overflow-auto" onclick="event.stopPropagation()">
      <div class="sticky top-0 bg-white z-10 p-4 md:p-6 pb-0 flex justify-between items-start border-b">
        <div class="flex-1 mb-4">
          <img src="${recipe.img}" class="w-full h-40 md:h-48 object-cover rounded-2xl mb-4" />
          <h2 class="text-2xl md:text-3xl font-black mb-2">${recipe.title}</h2>
          <div class="flex items-center gap-3">
            <span class="bg-orange-100 text-orange-800 px-3 py-2 rounded-full font-bold text-xs md:text-sm">${recipe.cat}</span>
            <span class="text-slate-500 text-xs md:text-sm">Voor ${servings} personen</span>
          </div>
        </div>
        <button onclick="this.closest('.fixed').remove()" class="text-3xl md:text-4xl font-bold text-slate-400 hover:text-slate-600 ml-4">×</button>
      </div>
      
      <div class="tab-navigation px-4 md:px-6 pt-4">
        <div class="flex gap-1 md:gap-2 border-b overflow-x-auto">
          <button data-tab="ingredients" onclick="switchTab('ingredients')" class="tab-btn px-3 md:px-6 py-2 md:py-3 font-bold rounded-t-xl bg-orange-600 text-white transition-all whitespace-nowrap">
            🥘 Ingrediënten
          </button>
          <button data-tab="steps" onclick="switchTab('steps')" class="tab-btn px-3 md:px-6 py-2 md:py-3 font-bold rounded-t-xl bg-slate-100 text-slate-700 transition-all whitespace-nowrap">
            📋 Stappen
          </button>
          <button data-tab="shopping" onclick="switchTab('shopping')" class="tab-btn px-3 md:px-6 py-2 md:py-3 font-bold rounded-t-xl bg-slate-100 text-slate-700 transition-all whitespace-nowrap">
            🛒 Boodschappen
          </button>
        </div>
      </div>
      
      <div class="p-4 md:p-6">
        <div id="tab-ingredients" class="tab-content active">
          <div class="bg-gradient-to-br from-orange-50 to-orange-100 p-4 md:p-6 rounded-2xl">
            <h3 class="text-lg md:text-xl font-bold mb-4 text-orange-800">Wat heb je nodig?</h3>
            <ul class="space-y-2 md:space-y-3">
              ${ingredients.map(i => `
                <li class="flex items-start gap-3 bg-white p-2 md:p-3 rounded-xl">
                  <span class="text-orange-600 text-lg md:text-xl flex-shrink-0">•</span>
                  <span class="flex-1 text-sm md:text-lg">${i}</span>
                </li>
              `).join('')}
            </ul>
          </div>
        </div>
        
        <div id="tab-steps" class="tab-content">
          <div class="bg-gradient-to-br from-blue-50 to-blue-100 p-4 md:p-6 rounded-2xl">
            <h3 class="text-lg md:text-xl font-bold mb-4 text-blue-800">Hoe maak je het?</h3>
            <ol class="space-y-3 md:space-y-4">
              ${steps.map((s, i) => `
                <li class="flex gap-3 md:gap-4 bg-white p-3 md:p-4 rounded-xl">
                  <span class="w-8 h-8 md:w-10 md:h-10 bg-orange-600 text-white rounded-full flex items-center justify-center font-bold flex-shrink-0 text-sm md:text-lg">${i+1}</span>
                  <span class="flex-1 pt-1 md:pt-2 text-sm md:text-lg">${s}</span>
                </li>
              `).join('')}
            </ol>
          </div>
        </div>
        
        <div id="tab-shopping" class="tab-content">
          <div class="bg-gradient-to-br from-green-50 to-green-100 p-4 md:p-6 rounded-2xl">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 mb-4">
              <h3 class="text-lg md:text-xl font-bold text-green-800">Boodschappenlijst</h3>
              <button onclick="copyRecipeIngredients('${recipe.id}')" class="w-full md:w-auto bg-green-600 text-white px-4 py-2 rounded-xl font-bold hover:bg-green-700 text-sm whitespace-nowrap">
                📋 Kopieer
              </button>
            </div>
            <ul class="space-y-2">
              ${ingredients.map((ing, i) => `
                <li class="flex items-start gap-3 bg-white p-2 md:p-3 rounded-xl hover:shadow-md transition-shadow">
                  <input type="checkbox" class="w-5 h-5 mt-0.5 accent-green-600 flex-shrink-0" />

      </div>
      
      <div class="p-4 md:p-6 pt-0 border-t mt-6">
        <h3 class="text-xl md:text-2xl font-bold mb-4">Reviews (${reviews.length})</h3>

          ${reviews.length === 0 ? '<p class="text-sm md:text-base text-slate-500">Nog geen reviews. Wees de eerste!</p>' : reviews.map(r => `
            <div class="bg-slate-50 p-3 md:p-4 rounded-xl">
              <div class="flex items-center justify-between mb-2">
                <span class="font-bold text-sm md:text-base">${r.user}</span>
                <span class="text-orange-600 font-bold text-sm md:text-base">⭐ ${r.rating}/5</span>
              </div>
              <p class="text-sm md:text-base">${r.comment}</p>

          `).join('')}

            <option value="4">4 ⭐ Goed</option>
            <option value="3">3 ⭐ Gemiddeld</option>
            <option value="2">2 ⭐ Matig</option>
            <option value="1">1 ⭐ Slecht</option>
          </select>
          <textarea id="comment" placeholder="Jouw review..." class="w-full p-3 mb-3 border-2 rounded-xl text-sm md:text-base" rows="3"></textarea>
          <button onclick="addReview('${recipe.id}')" class="w-full bg-orange-600 text-white p-3 rounded-xl font-bold hover:bg-orange-700 text-sm md:text-base">Publiceer Review</button>

      </div>

  document.body.appendChild(modal);
}

function copyRecipeIngredients(recipeId) {
  const allRecipes = db.recipes();
  const recipe = allRecipes.find(r => r.id === recipeId);
  if (!recipe) return;
  
  const ingredients = recipe.ingr.split('||');
  const text = `BOODSCHAPPENLIJST - ${recipe.title}\n\n${ingredients.map((ing, i) => `${i+1}. ${ing}`).join('\n')}`;
  navigator.clipboard.writeText(text).then(() => {
    alert('✅ Boodschappenlijst gekopieerd!');
  });
}

function addReview(recipeId) {
  const rating = parseInt(document.getElementById('rating').value);
  const comment = document.getElementById('comment').value;
  if (!comment.trim()) return alert('⚠️ Schrijf een review');
  const reviews = db.reviews();
  if (!reviews[recipeId]) reviews[recipeId] = [];
  reviews[recipeId].push({
    user: currentUser.name,
    rating,
    comment,
    date: new Date().toISOString()
  });
  db.set('reviews', reviews);
  document.querySelector('.fixed').remove();
  render();
}

function uploadRecipe() {
  const title = document.getElementById('title').value;
  const category = document.getElementById('category').value;
  const image = document.getElementById('image').value || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400';
  const ingredients = document.getElementById('ingredients').value;
  const steps = document.getElementById('steps').value;
  if (!title || !category || !ingredients || !steps) return alert('⚠️ Vul alle velden in');
  const pending = db.pendingRecipes();
  pending.push({
    id: 'p' + Date.now(),
    title,
    cat: category,
    img: image,
    ingr: ingredients.split('\n').filter(l=>l.trim()).join('||'),
    steps: steps.split('\n').filter(l=>l.trim()).join('||'),
    author: currentUser.name
  });
  db.set('pendingRecipes', pending);
  alert('✅ Recept verzonden!');
  changeView('home');
}

function approveRecipe(id) {
  const pending = db.pendingRecipes();
  const recipe = pending.find(r => r.id === id);
  if (!recipe) return;
  const approved = db.get('approvedRecipes') || [];
  approved.push({...recipe, id: 'a' + Date.now()});
  db.set('approvedRecipes', approved);
  db.set('pendingRecipes', pending.filter(r => r.id !== id));
  alert('✅ Recept goedgekeurd!');
  render();
}

function rejectRecipe(id) {
  if (!confirm('Weet je zeker dat je dit recept wilt afwijzen?')) return;
  const pending = db.pendingRecipes();
  db.set('pendingRecipes', pending.filter(r => r.id !== id));
  alert('❌ Recept afgewezen');
  render();
}

function deleteUser(email) {
  if (!confirm('Weet je zeker dat je deze gebruiker wilt verwijderen?')) return;
  const users = db.users().filter(u => u.email !== email);
  db.set('users', users);
  render();
}

const users = db.users();
if (!users.find(u => u.email === 'admin@weekhap.nl')) {
  users.push({ 
    name: 'Admin', 
    email: 'admin@weekhap.nl', 
    password: 'admin123', 
    isAdmin: true,
    registeredAt: new Date().toISOString(),
    lastLogin: new Date().toISOString(),
    loginCount: 0
  });
  db.set('users', users);
} else {
  let updated = false;
  users.forEach(u => {
    if (!u.registeredAt) {
      u.registeredAt = new Date('2026-01-01').toISOString();
      updated = true;
    }
    if (!u.loginCount) {
      u.loginCount = 0;
      updated = true;
    }
  });
  if (updated) db.set('users', users);
}

if (currentUser) {
  fetchMealDBRecipes().then(() => render());
} else {
  render();
}
</script>
