function formatDate(dateString) {
  const date = new Date(dateString);
  const months = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
  return `${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}`;
}

function formatDateTime(dateString) {
  const date = new Date(dateString);
  const months = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
  const hours = String(date.getHours()).padStart(2, '0');
  const minutes = String(date.getMinutes()).padStart(2, '0');
  return `${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()} ${hours}:${minutes}`;
}

function translateText(text) {
  if (!text || typeof text !== 'string') return text;
  
  let translated = text;
  const lowerText = text.toLowerCase();
  
  // Vertaal bekende woorden/zinnen
  Object.entries(EN_TO_NL).forEach(([en, nl]) => {
    // Case-insensitive replacement met woordgrenzen
    const regex = new RegExp('\\b' + en + '\\b', 'gi');
    translated = translated.replace(regex, nl);
  });
  
  return translated;
}

// Calorie schattingen per recept type
function estimateCalories(recipe) {
  // Als TheMealDB API data beschikbaar is
  if (recipe.calories) return Math.round(recipe.calories / servings);
  
  // Anders schatten op basis van ingrediënten
  const ingredients = recipe.ingr.toLowerCase();
  let baseCalories = 400; // default
  
  // Pasta/rijst gerechten
  if (ingredients.includes('pasta') || ingredients.includes('spaghetti')) baseCalories = 550;
  if (ingredients.includes('rijst') || ingredients.includes('rice')) baseCalories = 480;
  
  // Vlees
  if (ingredients.includes('kip') || ingredients.includes('chicken')) baseCalories += 100;
  if (ingredients.includes('rund') || ingredients.includes('beef')) baseCalories += 150;
  if (ingredients.includes('spek') || ingredients.includes('bacon')) baseCalories += 120;
  if (ingredients.includes('vis') || ingredients.includes('fish') || ingredients.includes('zalm')) baseCalories += 80;
  
  // Vegetarisch - vaak lager
  if (ingredients.includes('vegetarisch') || (!ingredients.includes('kip') && !ingredients.includes('vlees') && !ingredients.includes('vis'))) {
    baseCalories = 350;
  }
  
  // Zuivel
  if (ingredients.includes('kaas') || ingredients.includes('cheese')) baseCalories += 80;
  if (ingredients.includes('room') || ingredients.includes('cream')) baseCalories += 100;
  
  // Salade - laag
  if (ingredients.includes('salade') || ingredients.includes('salad')) baseCalories = 250;
  
  // Soep - gemiddeld laag
  if (ingredients.includes('soep') || ingredients.includes('soup')) baseCalories = 280;
  
  return Math.round(baseCalories / servings);
}

let mealDBCache = [];
let mealDBLoading = false;

async function fetchMealDBRecipes(count = 20) {
  if (mealDBLoading) return [];
  mealDBLoading = true;
  try {
    const promises = [];
    for (let i = 0; i < count; i++) {
      promises.push(fetch('https://www.themealdb.com/api/json/v1/1/random.php'));
    }
    const responses = await Promise.all(promises);
    const data = await Promise.all(responses.map(r => r.json()));
    const meals = data.filter(d => d.meals && d.meals[0]).map(d => d.meals[0]).map(meal => {
      const ingredients = [];
      for (let i = 1; i <= 20; i++) {
        const ingredient = meal[`strIngredient${i}`];
        const measure = meal[`strMeasure${i}`];
        if (ingredient && ingredient.trim()) {
          const translatedIng = translateText(ingredient);
          const translatedMeasure = translateText(measure || '');
          ingredients.push(`${translatedMeasure} ${translatedIng}`.trim());
        }
      }
      
      const rawSteps = meal.strInstructions.split('.').map(s => s.trim()).filter(s => s.length > 10).slice(0, 7);
      const steps = rawSteps.map(step => translateText(step));
      
      const translatedTitle = translateText(meal.strMeal);
      const translatedCat = translateText(meal.strCategory || 'Internationaal');
      
      // Haal calorie data uit TheMealDB (als beschikbaar, anders null)
      const calories = meal.strNutrition ? parseInt(meal.strNutrition) : null;
      
      return {
        id: 'mdb' + meal.idMeal, 
        title: translatedTitle, 
        img: meal.strMealThumb, 
        ingr: ingredients.join('||'), 
        steps: steps.join('||'), 
        cat: translatedCat, 
        author: 'TheMealDB', 
        source: 'mealdb',
        originalTitle: meal.strMeal,
        calories: calories
      };
    });
    
    meals.forEach(meal => {
      if (!mealDBCache.find(m => m.id === meal.id)) {
        mealDBCache.push(meal);
      }
    });
    
    mealDBLoading = false;
    return meals;
  } catch (error) {
    console.error('Fout bij laden TheMealDB:', error);
    mealDBLoading = false;
    return [];
  }
}

function shuffleArray(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function expandSearchTerm(term) {
  const lowerTerm = term.toLowerCase();
  if (TRANSLATION_MAP[lowerTerm]) {
    return `${term} ${TRANSLATION_MAP[lowerTerm]}`;
  }
  return term;
}

function filterByPrefs(recipes, extraFilter = '') {
  const prefs = db.preferences()[currentUser.email];
  
  return recipes.filter(r => {
    const txt = `${r.title} ${r.cat} ${r.ingr}`.toLowerCase();
    
    if (extraFilter && extraFilter.trim()) {
      const extraTerms = extraFilter.toLowerCase().split(' ').filter(t => t.trim());
      let hasExtraMatch = false;
      for (const term of extraTerms) {
        const expandedTerm = expandSearchTerm(term);
        const searchWords = expandedTerm.toLowerCase().split(' ');
        
        for (const word of searchWords) {
          if (txt.includes(word)) {
            hasExtraMatch = true;
            break;
          }
        }
        if (hasExtraMatch) break;
      }
      if (!hasExtraMatch) return false;
    }
    
    if (prefs && prefs.niet) {
      const nietTerms = prefs.niet.toLowerCase().split(' ').filter(t => t.trim());
      for (const term of nietTerms) {
        const expandedTerm = expandSearchTerm(term);
        const searchWords = expandedTerm.toLowerCase().split(' ');
        for (const word of searchWords) {
          if (txt.includes(word)) return false;
        }
      }
    }
    if (prefs && prefs.wel) {
      const welTerms = prefs.wel.toLowerCase().split(' ').filter(t => t.trim());
      if (welTerms.length > 0) {
        let hasMatch = false;
        for (const term of welTerms) {
          const expandedTerm = expandSearchTerm(term);
          const searchWords = expandedTerm.toLowerCase().split(' ');
          for (const word of searchWords) {
            if (txt.includes(word)) {
              hasMatch = true;
              break;
            }
          }
          if (hasMatch) break;
        }
        if (!hasMatch) return false;
      }
    }
    return true;
  });
}

async function generateMenu(extraFilter = '') {
  const loadingMsg = document.createElement('div');
  loadingMsg.id = 'loadingMsg';
  loadingMsg.className = 'fixed top-20 right-4 bg-orange-600 text-white px-6 py-3 rounded-xl font-bold shadow-xl z-50';
  loadingMsg.textContent = extraFilter ? `🔍 Zoeken naar "${extraFilter}"...` : '🍽️ Weekmenu genereren...';
  document.body.appendChild(loadingMsg);
  
  const minRecipes = 14;
  let attempts = 0;
  const maxAttempts = 12;
  
  while (attempts < maxAttempts) {
    const currentRecipes = db.recipes();
    const filtered = filterByPrefs(currentRecipes, extraFilter);
    
    console.log(`Poging ${attempts + 1}: ${filtered.length} recepten beschikbaar (doel: ${minRecipes})`);
    
    if (filtered.length >= minRecipes) {
      console.log('✅ Genoeg recepten gevonden!');
      break;
    }
    
    const expandedSearch = expandSearchTerm(extraFilter);
    loadingMsg.textContent = extraFilter 
      ? `🌍 Laden... ${filtered.length}/${minRecipes} recepten (zoekt: ${expandedSearch})`
      : `🌍 Laden... ${filtered.length}/${minRecipes} recepten`;
    
    console.log(`🌍 Nieuwe recepten laden... (${filtered.length}/${minRecipes})`);
    await fetchMealDBRecipes(40);
    attempts++;
    await new Promise(resolve => setTimeout(resolve, 300));
  }
  
  const finalRecipes = db.recipes();
  const filtered = filterByPrefs(finalRecipes, extraFilter);
  
  console.log(`Finale check: ${filtered.length} recepten beschikbaar`);
  
  if (filtered.length < 7) {
    loadingMsg.remove();
    const expandedInfo = extraFilter ? expandSearchTerm(extraFilter) : '';
    return alert(`⚠️ Niet genoeg recepten gevonden (${filtered.length} beschikbaar).\n\n${extraFilter ? `Gezocht naar: ${expandedInfo}\n\nTip: Probeer een bredere zoekterm of laat het veld leeg!` : 'Probeer andere voorkeuren!'}`);
  }
  
  const days = ['Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag','Zondag'];
  const shuffled = shuffleArray(filtered);
  const selected = shuffled.slice(0, 7);
  
  if (lastGeneratedIds.length > 0) {
    const hasOverlap = selected.some(r => lastGeneratedIds.includes(r.id));
    if (hasOverlap && filtered.length >= 14) {
      console.log('⚠️ Overlap gedetecteerd, opnieuw genereren...');
      loadingMsg.remove();
      return generateMenu(extraFilter);
    }
  }
  
  currentMenu = selected.map((r,i) => ({...r, day: days[i]}));
  lastGeneratedIds = selected.map(r => r.id);
  
  loadingMsg.textContent = '✅ Weekmenu klaar!';
  setTimeout(() => loadingMsg.remove(), 1500);
  
  render();
}

function renderRecipeCard(recipe, idx, isSaved = false, isMyRecipes = false) {
  const reviews = db.reviews()[recipe.id] || [];
  const avgRating = reviews.length > 0 ? (reviews.reduce((s,r)=>s+r.rating,0)/reviews.length).toFixed(1) : 'N/A';
  const userSavedRecipes = db.savedRecipes()[currentUser.email] || [];
  const isRecipeSaved = userSavedRecipes.includes(recipe.id);
  const caloriesPerServing = estimateCalories(recipe);
  
  return `
    <div class="recipe-card bg-white rounded-2xl p-4 shadow-xl hover:shadow-2xl transition-all hover:-translate-y-2 relative">
      <div onclick="showRecipe(${idx}, ${isSaved}, ${isMyRecipes})" class="cursor-pointer">
        <div class="relative mb-3 h-40 rounded-xl overflow-hidden">
          <img src="${recipe.img}" class="w-full h-full object-cover" />
          ${recipe.day ? `<div class="absolute top-2 left-2 bg-orange-600 text-white px-2 py-1 rounded-full text-xs font-bold">${recipe.day}</div>` : ''}
          <div class="absolute bottom-2 right-2 bg-green-600 text-white px-2 py-1 rounded-full text-xs font-bold flex items-center gap-1">
            <span>🔥</span>
            <span>${caloriesPerServing} kcal</span>
          </div>
        </div>
        <h3 class="font-black text-base md:text-lg mb-1">${recipe.title}</h3>
        <div class="flex items-center justify-between">
          <span class="bg-orange-100 text-orange-800 px-2 py-1 rounded-full text-xs font-semibold">${recipe.cat}</span>
          <span class="text-xs md:text-sm font-bold">⭐ ${avgRating} (${reviews.length})</span>
        </div>
      </div>
      <button onclick="toggleSaveRecipe('${recipe.id}', event)" class="absolute top-6 right-6 w-10 h-10 md:w-12 md:h-12 rounded-full ${isRecipeSaved ? 'bg-gradient-to-br from-pink-500 to-red-500 shadow-lg' : 'bg-white border-2 border-slate-300'} hover:scale-110 transition-all flex items-center justify-center text-xl md:text-2xl">
        ${isRecipeSaved ? '❤️' : '🤍'}
      </button>
    </div>
  `;
}
