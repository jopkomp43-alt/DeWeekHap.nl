let mealDBCache = [];
let mealDBLoading = false;

async function fetchMealDBRecipes() {
  if (mealDBLoading) return;
  mealDBLoading = true;
  try {
    const promises = [];
    for (let i = 0; i < 20; i++) {
      promises.push(fetch('https://www.themealdb.com/api/json/v1/1/random.php'));
    }
    const responses = await Promise.all(promises);
    const data = await Promise.all(responses.map(r => r.json()));
    const meals = data.filter(d => d.meals && d.meals[0]).map(d => d.meals[0]).map(meal => {
      const ingredients = [];
      for (let i = 1; i <= 20; i++) {
        const ingredient = meal[`strIngredient${i}`];
        const measure = meal[`strMeasure${i}`];
        if (ingredient && ingredient.trim()) ingredients.push(`${measure || ''} ${ingredient}`.trim());
      }
      const steps = meal.strInstructions.split('.').map(s => s.trim()).filter(s => s.length > 10).slice(0, 7);
      return {id: 'mdb' + meal.idMeal, title: meal.strMeal, img: meal.strMealThumb, ingr: ingredients.join('||'), steps: steps.join('||'), cat: meal.strCategory || 'Internationaal', author: 'TheMealDB', source: 'mealdb'};
    });
    mealDBCache = meals;
    mealDBLoading = false;
    return meals;
  } catch (error) {
    console.error('Fout bij laden TheMealDB:', error);
    mealDBLoading = false;
    return [];
  }
}

const db = {

  set: (key, val) => localStorage.setItem(key, JSON.stringify(val)),

    const approved = db.get('approvedRecipes') || [];
    return [...RECIPES, ...approved, ...mealDBCache];

};

function shuffleArray(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function filterByPrefs(recipes) {
  const prefs = db.preferences()[currentUser.email];
  if (!prefs || (!prefs.wel && !prefs.niet)) return recipes;
  
  return recipes.filter(r => {
    const txt = `${r.title} ${r.cat} ${r.ingr}`.toLowerCase();
    if (prefs.niet) {
      const nietTerms = prefs.niet.toLowerCase().split(' ').filter(t => t.trim());
      for (const term of nietTerms) {
        if (txt.includes(term)) return false;
      }
    }
    if (prefs.wel) {
      const welTerms = prefs.wel.toLowerCase().split(' ').filter(t => t.trim());
      if (welTerms.length > 0) {
        let hasMatch = false;
        for (const term of welTerms) {
          if (txt.includes(term)) {
            hasMatch = true;
            break;
          }
        }
        if (!hasMatch) return false;
      }
    }
    return true;
  });
}

function generateShoppingList() {
  if (currentMenu.length === 0) return alert('⚠️ Genereer eerst een weekmenu!');
  const allIngredients = [];
  currentMenu.forEach(recipe => {
    recipe.ingr.split('||').forEach(ing => allIngredients.push(ing));
  });
  
  const modal = document.createElement('div');
  modal.className = 'fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4';
  modal.onclick = () => modal.remove();
  
  modal.innerHTML = `
    <div class="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-auto p-8" onclick="event.stopPropagation()">
      <div class="flex justify-between items-start mb-6">
        <h2 class="text-4xl font-black">🛍️ Boodschappenlijst</h2>
        <button onclick="this.closest('div').parentElement.remove()" class="text-4xl font-bold text-slate-400 hover:text-slate-600">×</button>
      </div>
      <p class="text-slate-600 mb-4">Voor ${servings} personen, ${currentMenu.length} recepten</p>
      <ul class="bg-slate-50 p-6 rounded-2xl space-y-2 mb-6">
        ${allIngredients.map(ing => `<li class="flex items-center gap-3"><input type="checkbox" class="w-5 h-5 accent-orange-600" /><span>${ing}</span></li>`).join('')}
      </ul>
      <button onclick="copyShoppingList()" class="w-full bg-orange-600 text-white p-4 rounded-xl font-bold hover:bg-orange-700">📋 Kopieer naar Klembord</button>
    </div>
  `;
  document.body.appendChild(modal);
}

function copyShoppingList() {
  const allIngredients = [];
  currentMenu.forEach(recipe => {
    recipe.ingr.split('||').forEach(ing => allIngredients.push(ing));
  });
  const text = `BOODSCHAPPENLIJST - De Weekhap\n\n${allIngredients.map((ing, i) => `${i+1}. ${ing}`).join('\n')}`;
  navigator.clipboard.writeText(text).then(() => {
    alert('✅ Gekopieerd naar klembord!');
  });
}

  const wel = document.getElementById('prefWel').value.trim();

  allPrefs[currentUser.email] = {wel, niet};
  db.set('userPreferences', allPrefs);
  alert('✅ Voorkeuren opgeslagen!');
  render();
}

          <button onclick="changeView('saved')" class="px-4 py-2 rounded-lg font-bold ${view==='saved'?'bg-orange-600 text-white':'hover:bg-slate-100'}">Weekmenu (${savedMenu.length})</button>
          <button onclick="changeView('myrecipes')" class="px-4 py-2 rounded-lg font-bold ${view==='myrecipes'?'bg-orange-600 text-white':'hover:bg-slate-100'}">Mijn Recepten (${myRecipes.length})</button>
          <button onclick="changeView('community')" class="px-4 py-2 rounded-lg font-bold ${view==='community'?'bg-orange-600 text-white':'hover:bg-slate-100'}">Community</button>
          <button onclick="changeView('upload')" class="px-4 py-2 rounded-lg font-bold ${view==='upload'?'bg-orange-600 text-white':'hover:bg-slate-100'}">+ Recept</button>
          ${currentUser.isAdmin ? `<button onclick="changeView('admin')" class="px-4 py-2 rounded-lg font-bold ${view==='admin'?'bg-red-600 text-white':'bg-red-100 text-red-700'} relative">⚙️ Admin${pendingCount > 0 ? `<span class="absolute -top-1 -right-1 bg-red-600 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center">${pendingCount}</span>` : ''}</button>` : ''}
          <button onclick="logout()" class="px-4 py-2 rounded-lg font-bold bg-slate-200 hover:bg-slate-300">Uitloggen</button>
        </div>
      </div>
    </nav>
  `;
}

function renderMenu() {
  const saved = (db.savedMenus()[currentUser.email] || {}).recipes || [];
  const isSaved = saved.length === currentMenu.length && saved.every((r,i) => r.id === currentMenu[i].id);
  
  return `
    <div>
      <div class="flex items-center justify-between mb-8">
        <h2 class="text-4xl font-black">Jouw Weekmenu 📅</h2>
        <div class="flex gap-4">
          <button onclick="generateShoppingList()" class="bg-purple-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-purple-700">🛍️ Boodschappenlijst</button>
          ${!isSaved ? `<button onclick="saveMenu()" class="bg-green-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-green-700">💾 Bewaar Menu</button>` : '<span class="text-green-600 font-bold text-lg">✅ Menu Opgeslagen</span>'}
          <button onclick="window.print()" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-blue-700">🖨️ Print</button>
        </div>
      </div>
      <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
        ${currentMenu.map((r,i) => renderRecipeCard(r, i)).join('')}
      </div>
    </div>
  `;
}

function renderRecipeCard(recipe, idx, isSaved = false, isMyRecipes = false) {
  const reviews = db.reviews()[recipe.id] || [];
  const avgRating = reviews.length > 0 ? (reviews.reduce((s,r)=>s+r.rating,0)/reviews.length).toFixed(1) : 'N/A';
  const userSavedRecipes = db.savedRecipes()[currentUser.email] || [];
  const isRecipeSaved = userSavedRecipes.includes(recipe.id);
  
  return `
    <div class="recipe-card bg-white rounded-2xl p-4 shadow-xl hover:shadow-2xl transition-all hover:-translate-y-2 relative">
      <div onclick="showRecipe(${idx}, ${isSaved}, ${isMyRecipes})" class="cursor-pointer">
        <div class="relative mb-3 h-40 rounded-xl overflow-hidden">
          <img src="${recipe.img}" class="w-full h-full object-cover" />
          ${recipe.day ? `<div class="absolute top-2 left-2 bg-orange-600 text-white px-2 py-1 rounded-full text-xs font-bold">${recipe.day}</div>` : ''}
        </div>
        <h3 class="font-black text-lg mb-1">${recipe.title}</h3>
        <div class="flex items-center justify-between">
          <span class="bg-orange-100 text-orange-800 px-2 py-1 rounded-full text-xs font-semibold">${recipe.cat}</span>
          <span class="text-sm font-bold">⭐ ${avgRating} (${reviews.length})</span>
        </div>
      </div>
      <button onclick="toggleSaveRecipe('${recipe.id}', event)" class="absolute top-6 right-6 w-12 h-12 rounded-full ${isRecipeSaved ? 'bg-gradient-to-br from-pink-500 to-red-500 shadow-lg' : 'bg-white border-2 border-slate-300'} hover:scale-110 transition-all flex items-center justify-center text-2xl">
        ${isRecipeSaved ? '❤️' : '🤍'}
      </button>
    </div>
  `;
}

function toggleSaveRecipe(recipeId, event) {
  event.stopPropagation();
  const savedRecipes = db.savedRecipes();
  if (!savedRecipes[currentUser.email]) savedRecipes[currentUser.email] = [];
  const userRecipes = savedRecipes[currentUser.email];
  const index = userRecipes.indexOf(recipeId);
  if (index > -1) {
    userRecipes.splice(index, 1);
  } else {
    userRecipes.push(recipeId);
  }
  db.set('savedRecipes', savedRecipes);
  render();
}

function showLogin() {
  document.getElementById('loginForm').classList.remove('hidden');
  document.getElementById('registerForm').classList.add('hidden');
}

function showRegister() {
  document.getElementById('loginForm').classList.add('hidden');
  document.getElementById('registerForm').classList.remove('hidden');
}

function login() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  if (!email || !password) return alert('⚠️ Vul alle velden in');
  const users = db.users();
  const user = users.find(u => u.email === email && u.password === password);
  if (!user) return alert('❌ Verkeerde inloggegevens');
  currentUser = user;
  db.set('currentUser', user);
  view = 'home';
  fetchMealDBRecipes().then(() => render());
}

function register() {
  const name = document.getElementById('regName').value;
  const email = document.getElementById('regEmail').value;
  const password = document.getElementById('regPassword').value;
  if (!name || !email || !password) return alert('⚠️ Vul alle velden in');
  const users = db.users();
  if (users.find(u => u.email === email)) return alert('❌ Email al in gebruik');
  const newUser = { name, email, password, isAdmin: false };
  users.push(newUser);
  db.set('users', users);
  currentUser = newUser;
  db.set('currentUser', newUser);
  view = 'home';
  fetchMealDBRecipes().then(() => render());
}

function logout() {
  currentUser = null;
  db.set('currentUser', null);
  view = 'login';
  render();
}

function changeView(v) {
  view = v;
  render();
}

async function generateMenu() {
  if (mealDBCache.length < 10) {
    const loadingMsg = document.createElement('div');
    loadingMsg.className = 'fixed top-20 right-4 bg-green-600 text-white px-6 py-3 rounded-xl font-bold shadow-xl z-50';
    loadingMsg.textContent = '🌍 Laden van nieuwe recepten...';
    document.body.appendChild(loadingMsg);
    await fetchMealDBRecipes();
    loadingMsg.remove();
  }
  
  const days = ['Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag','Zondag'];
  const filtered = filterByPrefs(db.recipes());
  if (filtered.length < 7) return alert(`⚠️ Niet genoeg recepten met jouw voorkeuren (${filtered.length} beschikbaar)`);
  const shuffled = shuffleArray(filtered);
  const selected = shuffled.slice(0, 7);
  if (lastGeneratedIds.length > 0) {
    const hasOverlap = selected.some(r => lastGeneratedIds.includes(r.id));
    if (hasOverlap && filtered.length >= 14) {
      return generateMenu();
    }
  }
  currentMenu = selected.map((r,i) => ({...r, day: days[i]}));
  lastGeneratedIds = selected.map(r => r.id);
  render();
}

function saveMenu() {
  const menus = db.savedMenus();
  menus[currentUser.email] = { recipes: currentMenu, date: new Date().toISOString() };
  db.set('savedMenus', menus);
  render();
}

function showRecipe(idx, isSaved, isMyRecipes = false) {
  let recipe;
  if (isMyRecipes) {
    const saved = db.savedRecipes()[currentUser.email] || [];
    const allRecipes = db.recipes();
    const myRecipes = saved.map(id => allRecipes.find(r => r.id === id)).filter(r => r);
    recipe = myRecipes[idx];
  } else if (isSaved) {
    recipe = (db.savedMenus()[currentUser.email].recipes[idx]);
  } else {
    recipe = currentMenu[idx];
  }
  
  const reviews = db.reviews()[recipe.id] || [];
  const modal = document.createElement('div');
  modal.className = 'fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4';
  modal.onclick = () => modal.remove();
  
  modal.innerHTML = `
    <div class="bg-white rounded-3xl max-w-4xl w-full max-h-[90vh] overflow-auto p-8" onclick="event.stopPropagation()">
      <div class="flex justify-between items-start mb-6">
        <div class="flex-1">
          <img src="${recipe.img}" class="w-full h-64 object-cover rounded-2xl mb-4" />
          <h2 class="text-4xl font-black mb-2">${recipe.title}</h2>
          <span class="bg-orange-100 text-orange-800 px-3 py-2 rounded-full font-bold">${recipe.cat}</span>
          <p class="text-sm text-slate-500 mt-2">Door: ${recipe.author || 'Onbekend'}</p>
        </div>
        <button onclick="this.closest('div').parentElement.remove()" class="text-4xl font-bold text-slate-400 hover:text-slate-600 ml-4">×</button>
      </div>
      
      <div class="grid md:grid-cols-2 gap-8 mb-8">
        <div>
          <h3 class="text-2xl font-bold mb-4">Ingrediënten (${servings}p)</h3>
          <ul class="bg-slate-50 p-6 rounded-2xl space-y-2">
            ${recipe.ingr.split('||').map(i => `<li>• ${i}</li>`).join('')}
          </ul>
        </div>
        <div>
          <h3 class="text-2xl font-bold mb-4">Bereiding</h3>
          <ol class="bg-slate-50 p-6 rounded-2xl space-y-3">
            ${recipe.steps.split('||').map((s,i) => `<li class="flex gap-3"><span class="w-8 h-8 bg-orange-600 text-white rounded-full flex items-center justify-center font-bold flex-shrink-0">${i+1}</span><span class="pt-1">${s}</span></li>`).join('')}
          </ol>
        </div>
      </div>
      
      <div class="border-t pt-6">
        <h3 class="text-2xl font-bold mb-4">Reviews (${reviews.length})</h3>
        <div class="space-y-3 mb-6 max-h-60 overflow-y-auto">
          ${reviews.length === 0 ? '<p class="text-slate-500">Nog geen reviews. Wees de eerste!</p>' : reviews.map(r => `
            <div class="bg-slate-50 p-4 rounded-xl">
              <div class="flex items-center justify-between mb-2">
                <span class="font-bold">${r.user}</span>
                <span class="text-orange-600 font-bold">⭐ ${r.rating}/5</span>
              </div>
              <p>${r.comment}</p>
            </div>
          `).join('')}
        </div>
        
        <div class="bg-slate-50 p-6 rounded-2xl">
          <h4 class="font-bold mb-3">Voeg Review Toe</h4>
          <select id="rating" class="w-full p-3 mb-3 border-2 rounded-xl">
            <option value="5">5 ⭐ Uitstekend</option>
            <option value="4">4 ⭐ Goed</option>
            <option value="3">3 ⭐ Gemiddeld</option>
            <option value="2">2 ⭐ Matig</option>
            <option value="1">1 ⭐ Slecht</option>
          </select>
          <textarea id="comment" placeholder="Jouw review..." class="w-full p-3 mb-3 border-2 rounded-xl" rows="3"></textarea>
          <button onclick="addReview('${recipe.id}')" class="w-full bg-orange-600 text-white p-3 rounded-xl font-bold hover:bg-orange-700">Publiceer Review</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
}

function addReview(recipeId) {
  const rating = parseInt(document.getElementById('rating').value);
  const comment = document.getElementById('comment').value;
  if (!comment.trim()) return alert('⚠️ Schrijf een review');
  const reviews = db.reviews();
  if (!reviews[recipeId]) reviews[recipeId] = [];
  reviews[recipeId].push({
    user: currentUser.name,
    rating,
    comment,
    date: new Date().toISOString()
  });
  db.set('reviews', reviews);
  document.querySelector('.fixed').remove();
  render();
}

function uploadRecipe() {
  const title = document.getElementById('title').value;
  const category = document.getElementById('category').value;
  const image = document.getElementById('image').value || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400';
  const ingredients = document.getElementById('ingredients').value;
  const steps = document.getElementById('steps').value;
  if (!title || !category || !ingredients || !steps) return alert('⚠️ Vul alle velden in');
  const pending = db.pendingRecipes();
  pending.push({
    id: 'p' + Date.now(),
    title,
    cat: category,
    img: image,
    ingr: ingredients.split('\n').filter(l=>l.trim()).join('||'),
    steps: steps.split('\n').filter(l=>l.trim()).join('||'),
    author: currentUser.name
  });
  db.set('pendingRecipes', pending);
  alert('✅ Recept verzonden!');
  changeView('home');
}

function approveRecipe(id) {
  const pending = db.pendingRecipes();
  const recipe = pending.find(r => r.id === id);
  if (!recipe) return;
  const approved = db.get('approvedRecipes') || [];
  approved.push({...recipe, id: 'a' + Date.now()});
  db.set('approvedRecipes', approved);
  db.set('pendingRecipes', pending.filter(r => r.id !== id));
  alert('✅ Recept goedgekeurd!');
  render();
}

function rejectRecipe(id) {
  if (!confirm('Weet je zeker dat je dit recept wilt afwijzen?')) return;
  const pending = db.pendingRecipes();
  db.set('pendingRecipes', pending.filter(r => r.id !== id));
  alert('❌ Recept afgewezen');
  render();
}

function deleteUser(email) {
  if (!confirm('Weet je zeker dat je deze gebruiker wilt verwijderen?')) return;
  const users = db.users().filter(u => u.email !== email);
  db.set('users', users);
  render();
}

const users = db.users();
if (!users.find(u => u.email === 'admin@weekhap.nl')) {
  users.push({ name: 'Admin', email: 'admin@weekhap.nl', password: 'admin123', isAdmin: true });
  db.set('users', users);
}

if (currentUser) {
  fetchMealDBRecipes().then(() => render());
} else {
  render();
}
</script>
</body>
</html>
