function switchTab(tabName) {
  activeTab = tabName;
  const tabs = document.querySelectorAll('.tab-content');
  const buttons = document.querySelectorAll('.tab-btn');
  
  tabs.forEach(tab => tab.classList.remove('active'));
  buttons.forEach(btn => {
    btn.classList.remove('bg-orange-600', 'text-white');
    btn.classList.add('bg-slate-100', 'text-slate-700');
  });
  
  document.getElementById('tab-' + tabName).classList.add('active');
  const activeBtn = Array.from(buttons).find(btn => btn.dataset.tab === tabName);
  if (activeBtn) {
    activeBtn.classList.remove('bg-slate-100', 'text-slate-700');
    activeBtn.classList.add('bg-orange-600', 'text-white');

}

function formatDate(dateString) {
  const date = new Date(dateString);
  const months = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
  return `${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}`;
}

function formatDateTime(dateString) {
  const date = new Date(dateString);
  const months = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
  const hours = String(date.getHours()).padStart(2, '0');
  const minutes = String(date.getMinutes()).padStart(2, '0');
  return `${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()} ${hours}:${minutes}`;
}

async function generateMenu(extraFilter = '') {
  const loadingMsg = document.createElement('div');
  loadingMsg.id = 'loadingMsg';
  loadingMsg.className = 'fixed top-20 right-4 bg-orange-600 text-white px-6 py-3 rounded-xl font-bold shadow-xl z-50';
  loadingMsg.textContent = extraFilter ? `🔍 Zoeken naar "${extraFilter}"...` : '🍽️ Weekmenu genereren...';
  document.body.appendChild(loadingMsg);
  
  const minRecipes = 14;
  let attempts = 0;
  const maxAttempts = 12;
  
  while (attempts < maxAttempts) {
    const currentRecipes = db.recipes();
    const filtered = filterByPrefs(currentRecipes, extraFilter);
    
    console.log(`Poging ${attempts + 1}: ${filtered.length} recepten beschikbaar (doel: ${minRecipes})`);
    
    if (filtered.length >= minRecipes) {
      console.log('✅ Genoeg recepten gevonden!');
      break;
    }
    
    const expandedSearch = expandSearchTerm(extraFilter);
    loadingMsg.textContent = extraFilter 
      ? `🌍 Laden... ${filtered.length}/${minRecipes} recepten (zoekt: ${expandedSearch})`
      : `🌍 Laden... ${filtered.length}/${minRecipes} recepten`;
    
    console.log(`🌍 Nieuwe recepten laden... (${filtered.length}/${minRecipes})`);
    await fetchMealDBRecipes(40);
    attempts++;
    await new Promise(resolve => setTimeout(resolve, 300));
  }
  
  const finalRecipes = db.recipes();
  const filtered = filterByPrefs(finalRecipes, extraFilter);
  
  console.log(`Finale check: ${filtered.length} recepten beschikbaar`);
  
  if (filtered.length < 7) {
    loadingMsg.remove();
    const expandedInfo = extraFilter ? expandSearchTerm(extraFilter) : '';
    return alert(`⚠️ Niet genoeg recepten gevonden (${filtered.length} beschikbaar).\n\n${extraFilter ? `Gezocht naar: ${expandedInfo}\n\nTip: Probeer een bredere zoekterm of laat het veld leeg!` : 'Probeer andere voorkeuren!'}`);
  }
  
  const days = ['Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag','Zondag'];
  const shuffled = shuffleArray(filtered);
  const selected = shuffled.slice(0, 7);
  
  if (lastGeneratedIds.length > 0) {
    const hasOverlap = selected.some(r => lastGeneratedIds.includes(r.id));
    if (hasOverlap && filtered.length >= 14) {
      console.log('⚠️ Overlap gedetecteerd, opnieuw genereren...');
      loadingMsg.remove();
      return generateMenu(extraFilter);
    }
  }
  
  currentMenu = selected.map((r,i) => ({...r, day: days[i]}));
  lastGeneratedIds = selected.map(r => r.id);
  
  loadingMsg.textContent = '✅ Weekmenu klaar!';
  setTimeout(() => loadingMsg.remove(), 1500);
  
  render();

function showRecipe(index, fromSaved = false, fromMyRecipes = false) {
  let recipe;
  if (fromMyRecipes) {
    const saved = db.savedRecipes()[currentUser.email] || [];
    const allRecipes = db.recipes();
    const myRecipes = saved.map(id => allRecipes.find(r => r.id === id)).filter(r => r);
    recipe = myRecipes[index];
  } else if (fromSaved) {
    const savedMenu = (db.savedMenus()[currentUser.email] || {}).recipes || [];
    recipe = savedMenu[index];
  } else {
    recipe = currentMenu[index];
  }
  
  if (!recipe) return;
  
  const ingredients = recipe.ingr.split('||').filter(i => i.trim());
  const steps = recipe.steps.split('||').filter(s => s.trim());
  const cal = estimateCalories(recipe);
  
  const modal = document.createElement('div');
  modal.className = 'fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 modal-backdrop';
  modal.onclick = (e) => {if(e.target === modal) modal.remove();};
  
  modal.innerHTML = `
    <div class="bg-white rounded-3xl max-w-4xl w-full max-h-[90vh] overflow-hidden shadow-2xl" onclick="event.stopPropagation()">
      <div class="relative">
        <img src="${recipe.img}" alt="${recipe.title}" class="w-full h-64 object-cover" />
        <button onclick="this.closest('.modal-backdrop').remove()" class="absolute top-4 right-4 w-10 h-10 bg-white/90 backdrop-blur rounded-full flex items-center justify-center font-bold hover:bg-white shadow-lg">✕</button>
      </div>
      
      <div class="p-6 md:p-8 overflow-y-auto max-h-[calc(90vh-16rem)]">
        <div class="flex items-start justify-between gap-4 mb-4">
          <div class="flex-1">
            <h2 class="text-3xl md:text-4xl font-black mb-2">${recipe.title}</h2>
            <div class="flex flex-wrap gap-2 items-center text-sm md:text-base text-slate-600">
              <span class="bg-orange-100 text-orange-800 px-3 py-1 rounded-full font-semibold">${recipe.cat}</span>
              <span>•</span>
              <span>🔥 ~${cal} kcal/portie</span>
              <span>•</span>
              <span>👥 ${servings} personen</span>
            </div>
          </div>
        </div>
        
        <div class="flex gap-2 border-b mb-6 overflow-x-auto">

          <h3 class="text-xl md:text-2xl font-black mb-4">🥘 Ingrediënten</h3>

            ${ingredients.map(ing => `
              <li class="flex items-start gap-3 p-2 hover:bg-orange-50 rounded-lg transition-colors">
                <input type="checkbox" class="w-5 h-5 mt-0.5 accent-orange-600" />
                <span class="flex-1 text-sm md:text-base">${ing}</span>
              </li>
            `).join('')}
          </ul>
        </div>
        
        <div id="steps" class="tab-content hidden">
          <h3 class="text-xl md:text-2xl font-black mb-4">👨‍🍳 Bereidingswijze</h3>
          <ol class="space-y-4">
            ${steps.map((step, i) => `
              <li class="flex gap-4 p-4 bg-slate-50 rounded-xl">
                <div class="w-8 h-8 bg-orange-600 text-white rounded-full flex items-center justify-center font-bold flex-shrink-0">${i+1}</div>
                <p class="flex-1 pt-1 text-sm md:text-base">${step}</p>
              </li>
            `).join('')}
          </ol>
        </div>
        
        <div id="shopping" class="tab-content hidden">
          <h3 class="text-xl md:text-2xl font-black mb-4">🛒 Boodschappenlijst</h3>
          <ul class="space-y-2">
            ${ingredients.map(ing => `
              <li class="flex items-start gap-3 p-2 hover:bg-orange-50 rounded-lg transition-colors">
                <input type="checkbox" class="w-5 h-5 mt-0.5 accent-orange-600" />
                <span class="flex-1 text-sm md:text-base">${ing}</span>
              </li>
            `).join('')}
          </ul>
          <button onclick="copyIngredients(\`${ingredients.join('\\n')}\`)" class="mt-4 w-full bg-orange-600 text-white py-3 rounded-xl font-bold hover:bg-orange-700">📋 Kopieer Lijst</button>
        </div>
      </div>
    </div>
  `;
  
  document.body.appendChild(modal);
}

function switchTab(btn, tabName) {
  const modal = btn.closest('.bg-white');
  modal.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.remove('border-orange-600', 'text-orange-600');
    b.classList.add('text-slate-600');
  });
  btn.classList.add('border-orange-600', 'text-orange-600');
  btn.classList.remove('text-slate-600');
  
  modal.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
  modal.querySelector(`#${tabName}`).classList.remove('hidden');
}

function copyIngredients(text) {
  navigator.clipboard.writeText(text);
  alert('✅ Ingrediënten gekopieerd!');
}

function copyShoppingList() {
  const saved = (db.savedMenus()[currentUser.email] || {}).recipes || [];
  const menu = saved.length > 0 ? saved : currentMenu;
  const allIngredients = [];
  menu.forEach(recipe => {
    recipe.ingr.split('||').forEach(ing => allIngredients.push(ing));
  });
  const text = `🛒 Boodschappenlijst\n\n${allIngredients.join('\n')}`;
  navigator.clipboard.writeText(text);
  alert('✅ Boodschappenlijst gekopieerd!');
}

function toggleFavorite(id) {
  const saved = db.savedRecipes()[currentUser.email] || [];
  const idx = saved.indexOf(id);
  if (idx > -1) {
    saved.splice(idx, 1);
  } else {
    saved.push(id);
  }
  const all = db.savedRecipes();
  all[currentUser.email] = saved;
  db.set('savedRecipes', all);
  render();
}

function toggleMobileMenu() {
  const menu = document.getElementById('mobileMenu');
  menu.classList.toggle('mobile-menu-open');
}
function estimateCalories(recipe) {
  const base = 400;
  const ingredients = recipe.ingr.toLowerCase();
  let cal = base;
  
  if (ingredients.includes('kip') || ingredients.includes('chicken')) cal += 50;
  if (ingredients.includes('vis') || ingredients.includes('fish') || ingredients.includes('salmon')) cal += 30;
  if (ingredients.includes('pasta') || ingredients.includes('rice') || ingredients.includes('rijst')) cal += 100;
  if (ingredients.includes('kaas') || ingredients.includes('cheese') || ingredients.includes('room')) cal += 80;
  if (ingredients.includes('olie') || ingredients.includes('oil') || ingredients.includes('boter')) cal += 60;
  
  return Math.round(cal / servings);
}

function formatDate(timestamp) {
  if (!timestamp) return 'Onbekend';
  const date = new Date(timestamp);
  return date.toLocaleDateString('nl-NL', {day: '2-digit', month: 'short', year: 'numeric'});
}

function formatDateTime(timestamp) {
  if (!timestamp) return 'Nooit';
  const date = new Date(timestamp);
  const now = new Date();
  const diffMs = now - date;
  const diffMins = Math.floor(diffMs / 60000);
  const diffHours = Math.floor(diffMs / 3600000);
  const diffDays = Math.floor(diffMs / 86400000);
  
  if (diffMins < 1) return 'Nu';
  if (diffMins < 60) return `${diffMins}m geleden`;
  if (diffHours < 24) return `${diffHours}u geleden`;
  if (diffDays < 7) return `${diffDays}d geleden`;
  return date.toLocaleDateString('nl-NL', {day: '2-digit', month: 'short'});
}

function deleteUser(email) {
  if (!confirm(`Weet je zeker dat je ${email} wilt verwijderen?`)) return;
  const users = db.users().filter(u => u.email !== email);
  db.set('users', users);
  
  const prefs = db.preferences();
  delete prefs[email];
  db.set('userPreferences', prefs);
  
  const savedMenus = db.savedMenus();
  delete savedMenus[email];
  db.set('savedMenus', savedMenus);
  
  const savedRecipes = db.savedRecipes();
  delete savedRecipes[email];
  db.set('savedRecipes', savedRecipes);
  
  alert('✅ Gebruiker verwijderd');
  render();
}

function approveRecipe(id) {
  const pending = db.pendingRecipes();
  const recipe = pending.find(r => r.id === id);
  if (!recipe) return;
  
  const approved = db.get('approvedRecipes') || [];
  approved.push(recipe);
  db.set('approvedRecipes', approved);
  
  RECIPES.push(recipe);
  db.set('recipes', RECIPES);
  
  const newPending = pending.filter(r => r.id !== id);
  db.set('pendingRecipes', newPending);
  
  alert('✅ Recept goedgekeurd en toegevoegd aan database!');
  render();
}

function rejectRecipe(id) {
  if (!confirm('Weet je zeker dat je dit recept wilt afwijzen?')) return;
  const pending = db.pendingRecipes();
  const newPending = pending.filter(r => r.id !== id);
  db.set('pendingRecipes', newPending);
  alert('✅ Recept afgewezen');
  render();
}

function uploadRecipe() {
  const title = document.getElementById('title').value.trim();
  const category = document.getElementById('category').value.trim();
  const image = document.getElementById('image').value.trim() || 'https://via.placeholder.com/400x300?text=Geen+foto';
  const ingredients = document.getElementById('ingredients').value.trim();
  const steps = document.getElementById('steps').value.trim();
  
  if (!title || !category || !ingredients || !steps) {
    alert('⚠️ Vul alle velden in');
    return;
  }
  
  const recipe = {
    id: 'custom_' + Date.now(),
    title,
    cat: category,
    img: image,
    ingr: ingredients.split('\n').filter(i => i.trim()).join('||'),
    steps: steps.split('\n').filter(s => s.trim()).join('||'),
    author: currentUser.email,
    submittedAt: Date.now()
  };
  
  const pending = db.pendingRecipes();
  pending.push(recipe);
  db.set('pendingRecipes', pending);
  
  alert('✅ Recept ingediend! Het wordt beoordeeld door een admin.');
  changeView('community');
}

function initGoogleTranslate() {
  if (window.google && window.google.translate) {
    new window.google.translate.TranslateElement({
      pageLanguage: 'nl',
      includedLanguages: 'en,nl,de,fr,es',
      layout: window.google.translate.TranslateElement.InlineLayout.SIMPLE
    }, 'google_translate_element');
  }
}

function loadGoogleTranslate() {
  const script = document.createElement('script');
  script.src = '//translate.google.com/translate_a/element.js?cb=initGoogleTranslate';
  document.head.appendChild(script);
}

window.initGoogleTranslate = initGoogleTranslate;

render();
loadGoogleTranslate();

const observer = new MutationObserver(() => {
  const translateElements = document.querySelectorAll('#google_translate_element');
  translateElements.forEach(el => {
    if (el && !el.querySelector('.goog-te-combo')) {
      initGoogleTranslate();
    }
  });
});

observer.observe(document.body, {childList: true, subtree: true});
