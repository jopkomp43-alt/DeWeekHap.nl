function handleImageUpload(event) {
  const file = event.target.files[0];
  if (!file) {
    uploadedImageData = null;
    document.getElementById('imagePreview').style.display = 'none';
    return;
  }
  
  if (!file.type.match('image.*')) {
    alert('⚠️ Selecteer alleen afbeeldingen (JPG, PNG, WebP)');
    event.target.value = '';
    return;
  }
  
  if (file.size > 5 * 1024 * 1024) {
    alert('⚠️ Afbeelding te groot! Maximaal 5MB');
    event.target.value = '';
    return;
  }
  
  const reader = new FileReader();
  reader.onload = function(e) {
    uploadedImageData = e.target.result;
    const preview = document.getElementById('imagePreview');
    preview.innerHTML = `
      <div class="relative">
        <img src="${uploadedImageData}" class="w-full h-48 object-cover rounded-xl" />
        <button 
          onclick="clearImageUpload()" 
          class="absolute top-2 right-2 bg-red-500 text-white w-8 h-8 rounded-full font-bold hover:bg-red-600"
        >
          ×
        </button>
      </div>
      <p class="text-sm text-green-600 font-bold mt-2">✅ Foto geladen: ${file.name}</p>
    `;
    preview.style.display = 'block';
    document.getElementById('imageUrlInput').disabled = true;
    document.getElementById('imageUrlInput').classList.add('bg-gray-100');
  };
  reader.readAsDataURL(file);
}

function clearImageUpload() {
  uploadedImageData = null;
  document.getElementById('imageUpload').value = '';
  document.getElementById('imagePreview').style.display = 'none';
  document.getElementById('imageUrlInput').disabled = false;

function switchTab(tabName) {
  activeTab = tabName;
  const tabs = document.querySelectorAll('.tab-content');
  const buttons = document.querySelectorAll('.tab-btn');
  
  tabs.forEach(tab => tab.classList.remove('active'));
  buttons.forEach(btn => {
    btn.classList.remove('bg-orange-600', 'text-white');
    btn.classList.add('bg-slate-100', 'text-slate-700');
  });
  
  document.getElementById('tab-' + tabName).classList.add('active');
  const activeBtn = Array.from(buttons).find(btn => btn.dataset.tab === tabName);
  if (activeBtn) {
    activeBtn.classList.remove('bg-slate-100', 'text-slate-700');
    activeBtn.classList.add('bg-orange-600', 'text-white');
  }
}

function formatDate(dateString) {
  const date = new Date(dateString);
  const months = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
  return `${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}`;
}

function formatDateTime(dateString) {
  const date = new Date(dateString);
  const months = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
  const hours = String(date.getHours()).padStart(2, '0');
  const minutes = String(date.getMinutes()).padStart(2, '0');
  return `${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()} ${hours}:${minutes}`;
}

function translateText(text) {
  if (!text || typeof text !== 'string') return text;
  let translated = text;
  const lowerText = text.toLowerCase();
  Object.entries(EN_TO_NL).forEach(([en, nl]) => {
    const regex = new RegExp('\\b' + en + '\\b', 'gi');
    translated = translated.replace(regex, nl);
  });
  return translated;
}

let mealDBCache = [];
let mealDBLoading = false;

async function fetchMealDBRecipes(count = 20) {
  if (mealDBLoading) return [];
  mealDBLoading = true;
  try {
    const promises = [];
    for (let i = 0; i < count; i++) {
      promises.push(fetch('https://www.themealdb.com/api/json/v1/1/random.php'));
    }
    const responses = await Promise.all(promises);
    const data = await Promise.all(responses.map(r => r.json()));
    const meals = data.filter(d => d.meals && d.meals[0]).map(d => d.meals[0]).map(meal => {
      const ingredients = [];
      for (let i = 1; i <= 20; i++) {
        const ingredient = meal[`strIngredient${i}`];
        const measure = meal[`strMeasure${i}`];
        if (ingredient && ingredient.trim()) {
          const translatedIng = translateText(ingredient);
          const translatedMeasure = translateText(measure || '');
          ingredients.push(`${translatedMeasure} ${translatedIng}`.trim());
        }
      }
      const rawSteps = meal.strInstructions.split('.').map(s => s.trim()).filter(s => s.length > 10).slice(0, 7);
      const steps = rawSteps.map(step => translateText(step));
      const translatedTitle = translateText(meal.strMeal);
      const translatedCat = translateText(meal.strCategory || 'Internationaal');
      return {
        id: 'mdb' + meal.idMeal, 
        title: translatedTitle, 
        img: meal.strMealThumb, 
        ingr: ingredients.join('||'), 
        steps: steps.join('||'), 
        cat: translatedCat, 
        author: 'TheMealDB', 
        source: 'mealdb',
        originalTitle: meal.strMeal
      };
    });
    meals.forEach(meal => {
      if (!mealDBCache.find(m => m.id === meal.id)) {
        mealDBCache.push(meal);
      }
    });
    mealDBLoading = false;
    return meals;
  } catch (error) {
    console.error('Fout bij laden TheMealDB:', error);
    mealDBLoading = false;
    return [];
  }
}
