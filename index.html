let mealDBCache = [];
let mealDBLoading = false;
let recipeLanguage = 'nl'; // Default language: Dutch

async function fetchMealDBRecipes() {
  if (mealDBLoading) return;
  mealDBLoading = true;
  
  try {
    const promises = [];
    for (let i = 0; i < 20; i++) {
      promises.push(fetch('https://www.themealdb.com/api/json/v1/1/random.php'));
    }
    
    const responses = await Promise.all(promises);
    const data = await Promise.all(responses.map(r => r.json()));
    
    const meals = data
      .filter(d => d.meals && d.meals[0])
      .map(d => d.meals[0])
      .map(meal => {
        const ingredients = [];
        for (let i = 1; i <= 20; i++) {
          const ingredient = meal[`strIngredient${i}`];
          const measure = meal[`strMeasure${i}`];
          if (ingredient && ingredient.trim()) {
            ingredients.push(`${measure || ''} ${ingredient}`.trim());
          }
        }
        
        const steps = meal.strInstructions
          .split('.')
          .map(s => s.trim())
          .filter(s => s.length > 10)
          .slice(0, 7);
        
        return {
          id: 'mdb' + meal.idMeal,
          title: meal.strMeal,
          titleEN: meal.strMeal, // Store original English title
          img: meal.strMealThumb,
          ingr: ingredients.join('||'),
          ingrEN: ingredients.join('||'), // Store original English ingredients
          steps: steps.join('||'),
          stepsEN: steps.join('||'), // Store original English steps
          cat: meal.strCategory || 'Internationaal',
          author: 'TheMealDB',
          source: 'mealdb'
        };
      });
    
    mealDBCache = meals;
    mealDBLoading = false;
    return meals;
  } catch (error) {
    console.error('Fout bij laden TheMealDB:', error);
    mealDBLoading = false;
    return [];
  }
}

async function generateMenu() {
  const allRecipes = [...RECIPES, ...state.customRecipes, ...mealDBCache];
  
  if (allRecipes.length < 7) {
    await loadMoreMealDB();
  }
  
  const finalRecipes = [...RECIPES, ...state.customRecipes, ...mealDBCache];
  const shuffled = finalRecipes.sort(() => Math.random() - 0.5);
  state.menu = shuffled.slice(0, 7);
  navigateTo('menu');
}

function addToMenu(recipe) {
  if (state.menu.length >= 7) {
    alert('Je weekmenu is vol! Verwijder eerst een recept.');
    return;
  }
  state.menu.push(recipe);
  document.querySelector('.fixed').remove();
  alert(`${recipe.title} toegevoegd aan je weekmenu!`);
}

function removeFromMenu(index) {
  state.menu.splice(index, 1);
  render();
}

function downloadMenu() {
  const days = ['Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag','Zondag'];
  let text = '🍽️ MIJN WEEKMENU - DE WEEKHAP\n\n';
  
  state.menu.forEach((recipe, i) => {
    text += `${days[i]}: ${recipe.title}\n`;
    text += `Categorie: ${recipe.cat}\n\n`;
    text += 'Ingrediënten:\n';
    recipe.ingr.split('||').forEach(ing => text += `- ${ing}\n`);
    text += '\nBereidingswijze:\n';
    recipe.steps.split('||').forEach((step, j) => text += `${j+1}. ${step}\n`);
    text += '\n' + '='.repeat(50) + '\n\n';
  });
  
  const blob = new Blob([text], {type: 'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'weekmenu.txt';
  a.click();
}

async function loadMoreMealDB() {
  if (mealDBLoading) return;
  
  const meals = await fetchMealDBRecipes();
  if (meals.length > 0) {
    render();
  }
}

// Initialize
