    withChicken: false,
    withoutMeat: false,
    withFish: false,
    vegetarian: false
  },
  servings: 2,
  generatedMenu: [],
  savedRecipes: [],
  currentRecipe: null
};

// Load saved recipes met error handling

  const saved = localStorage.getItem('savedRecipes');
  if (saved) {
    state.savedRecipes = JSON.parse(saved);
  }
} catch (e) {
  console.log('LocalStorage niet beschikbaar');
  state.savedRecipes = [];
}

// UTILITY: Scale ingredients
function scaleIngredients(recipe, newServings) {
  const scale = newServings / recipe.servings;
  return recipe.ingredients.map(ing => ({
    ...ing,
    amount: Math.round(ing.amount * scale * 10) / 10
  }));
}

          </div>
          <div class="flex gap-4">
            <button onclick="navigateTo('generator')" class="px-4 py-2 rounded-lg font-semibold transition ${state.view === 'generator' ? 'bg-orange-500 text-white' : 'text-slate-600 hover:bg-slate-100'}">
              Generator
            </button>
            <button onclick="navigateTo('saved')" class="px-4 py-2 rounded-lg font-semibold transition ${state.view === 'saved' ? 'bg-orange-500 text-white' : 'text-slate-600 hover:bg-slate-100'}">
              Opgeslagen (${state.savedRecipes.length})
            </button>
          </div>
        </div>
      </div>
    </nav>
  `;
}

// RENDER GENERATOR
function renderGenerator() {
  // Count filtered recipes
  let availableCount = RECIPES.length;
  const anyFilterActive = Object.values(state.filters).some(f => f);
  
  if (anyFilterActive) {
    availableCount = RECIPES.filter(recipe => {
      if (state.filters.withChicken && recipe.tags.includes('kip')) return true;
      if (state.filters.withFish && recipe.tags.includes('vis')) return true;
      if (state.filters.vegetarian && recipe.tags.includes('vegetarisch')) return true;
      if (state.filters.withoutMeat && !recipe.tags.some(t => ['vlees', 'kip', 'vis'].includes(t))) return true;
      return false;
    }).length;
  }
  
  return `
    ${renderNav()}
    <div class="container mx-auto px-4 max-w-4xl">
      <h1 class="text-4xl font-black text-slate-800 mb-4">Genereer je Weekmenu</h1>
      <p class="text-lg text-slate-600 mb-8">Kies wat je WEL of NIET wilt eten</p>
      
      <!-- FILTERS -->
      <div class="bg-white rounded-2xl shadow-lg p-6 mb-8">
        <h2 class="text-xl font-bold mb-4">Wat wil je eten?</h2>
        <p class="text-sm text-slate-500 mb-4">Klik op een of meerdere opties (je kunt meerdere selecteren!)</p>
        <div class="grid grid-cols-2 gap-4">
          <button onclick="toggleFilter('withChicken')" class="filter-btn px-6 py-4 rounded-xl font-semibold ${state.filters.withChicken ? 'filter-active text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">
            🐔 Met Kip

          <button onclick="toggleFilter('withFish')" class="filter-btn px-6 py-4 rounded-xl font-semibold ${state.filters.withFish ? 'filter-active text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">
            🐟 Met Vis
          </button>
          <button onclick="toggleFilter('vegetarian')" class="filter-btn px-6 py-4 rounded-xl font-semibold ${state.filters.vegetarian ? 'filter-active text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">
            🥗 Vegetarisch
          </button>
          <button onclick="toggleFilter('withoutMeat')" class="filter-btn px-6 py-4 rounded-xl font-semibold ${state.filters.withoutMeat ? 'filter-active text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">
            🚫🥩 Geen Vlees/Vis
          </button>
        </div>
        ${anyFilterActive ? `
          <div class="mt-4 p-3 bg-orange-50 rounded-lg border border-orange-200">
            <p class="text-sm text-orange-800">✅ <strong>${availableCount} recepten</strong> beschikbaar met jouw filters</p>
          </div>
        ` : ''}
      </div>
      
      <!-- SERVINGS -->
      <div class="bg-white rounded-2xl shadow-lg p-6 mb-8">
        <h2 class="text-xl font-bold mb-4">Voor hoeveel personen?</h2>
        <div class="flex items-center gap-4">
          <button onclick="changeServings(-1)" class="w-12 h-12 rounded-full bg-slate-200 hover:bg-slate-300 font-bold text-2xl transition">-</button>
          <div class="flex-1 text-center">
            <div class="text-5xl font-black text-orange-600">${state.servings}</div>
            <div class="text-sm text-slate-600 mt-1">personen</div>
          </div>
          <button onclick="changeServings(1)" class="w-12 h-12 rounded-full bg-slate-200 hover:bg-slate-300 font-bold text-2xl transition">+</button>
        </div>
      </div>
      
      <!-- GENERATE BUTTON -->
      <button onclick="generateWeekMenu()" class="w-full bg-gradient-to-r from-orange-500 to-orange-600 text-white py-6 rounded-2xl text-2xl font-black shadow-xl hover:shadow-2xl hover:scale-105 transition transform">
        🎲 Genereer Weekmenu (7 dagen)
      </button>
      
      <!-- GENERATED MENU -->
      ${state.generatedMenu.length > 0 ? `
        <div class="mt-12">
          <h2 class="text-3xl font-black mb-6">Jouw Weekmenu</h2>
          <div class="space-y-4">
            ${state.generatedMenu.map((recipe, i) => {
              const days = ['Maandag', 'Dinsdag', 'Woensdag', 'Donderdag', 'Vrijdag', 'Zaterdag', 'Zondag'];
              return `
                <div class="bg-white rounded-xl shadow-md p-4 flex items-center gap-4 hover:shadow-lg transition">
                  <div class="w-16 h-16 bg-orange-500 rounded-full flex items-center justify-center text-white font-bold">
                    ${days[i].slice(0,2)}
                  </div>
                  <img src="${recipe.img}" class="w-20 h-20 rounded-lg object-cover">
                  <div class="flex-1">
                    <h3 class="font-bold text-lg">${recipe.title}</h3>
                    <p class="text-sm text-slate-600">⏱️ ${recipe.cookTime} min • 👥 ${state.servings} personen</p>
                  </div>
                  <button onclick="viewRecipe(${recipe.id})" class="px-6 py-2 bg-orange-500 text-white rounded-lg font-semibold hover:bg-orange-600 transition">
                    Bekijk
                  </button>
                </div>
              `;
            }).join('')}
          </div>
          <button onclick="downloadShoppingList()" class="w-full mt-6 bg-slate-700 text-white py-4 rounded-xl font-bold hover:bg-slate-800 transition">
            📝 Download Boodschappenlijst
          </button>
        </div>
      ` : ''}
    </div>
  `;
}

// RENDER SAVED
function renderSaved() {
  return `
    ${renderNav()}
    <div class="container mx-auto px-4 max-w-4xl">
      <h1 class="text-4xl font-black text-slate-800 mb-8">Opgeslagen Recepten</h1>
      ${state.savedRecipes.length === 0 ? `
        <div class="text-center py-16 bg-white rounded-2xl shadow-lg">
          <div class="text-6xl mb-4">📖</div>
          <p class="text-xl text-slate-500 mb-2">Je hebt nog geen recepten opgeslagen</p>
          <p class="text-sm text-slate-400">Klik op het hartje ❤️ bij een recept om op te slaan</p>
        </div>
      ` : `
        <div class="grid gap-4">
          ${state.savedRecipes.map(recipe => `
            <div class="bg-white rounded-xl shadow-md p-4 flex items-center gap-4 hover:shadow-lg transition">
              <img src="${recipe.img}" class="w-20 h-20 rounded-lg object-cover">
              <div class="flex-1">
                <h3 class="font-bold text-lg">${recipe.title}</h3>
                <p class="text-sm text-slate-600">⏱️ ${recipe.cookTime} min</p>
              </div>
              <button onclick="viewRecipe(${recipe.id})" class="px-6 py-2 bg-orange-500 text-white rounded-lg font-semibold hover:bg-orange-600 transition">
                Bekijk
              </button>
              <button onclick="unsaveRecipe(${recipe.id})" class="px-4 py-2 bg-red-500 text-white rounded-lg font-semibold hover:bg-red-600 transition">
                ✕
              </button>
            </div>
          `).join('')}
        </div>
      `}
    </div>
  `;
}

// RENDER RECIPE DETAIL
function renderRecipeDetail() {
  if (!state.currentRecipe) return '';
  
  const recipe = state.currentRecipe;
  const scaledIngredients = scaleIngredients(recipe, state.servings);
  const isSaved = state.savedRecipes.some(r => r.id === recipe.id);
  
  return `
    ${renderNav()}
    <div class="container mx-auto px-4 max-w-4xl">
      <button onclick="goBack()" class="mb-4 text-orange-600 font-semibold hover:underline flex items-center gap-2">
        ← Terug
      </button>
      
      <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
        <img src="${recipe.img}" class="w-full h-64 object-cover">
        
        <div class="p-8">
          <div class="flex justify-between items-start mb-6">
            <div>
              <h1 class="text-4xl font-black text-slate-800 mb-2">${recipe.title}</h1>
              <p class="text-slate-600">⏱️ ${recipe.cookTime} min • 👥 ${state.servings} personen</p>
            </div>
            <button onclick="toggleSaveRecipe(${recipe.id})" class="px-6 py-3 rounded-xl font-bold transition ${isSaved ? 'bg-red-500 hover:bg-red-600 text-white' : 'bg-orange-500 hover:bg-orange-600 text-white'}">
              ${isSaved ? '❤️ Opgeslagen' : '🤍 Opslaan'}
            </button>
          </div>
          
          <!-- INGREDIENTS -->
          <div class="mb-8">
            <h2 class="text-2xl font-bold mb-4">🛒 Ingrediënten</h2>
            <div class="bg-gradient-to-r from-orange-50 to-slate-50 rounded-xl p-6">
              ${scaledIngredients.map(ing => `
                <div class="flex justify-between py-2 border-b border-slate-200 last:border-0">
                  <span class="font-medium">${ing.item}</span>
                  <span class="text-orange-600 font-bold">${ing.amount} ${ing.unit}</span>
                </div>
              `).join('')}
            </div>
          </div>
          
          <!-- DETAILED STEPS -->
          <div>
            <h2 class="text-2xl font-bold mb-4">👨‍🍳 Bereiding (Stap voor Stap)</h2>
            <p class="text-sm text-slate-600 mb-4">Volg deze stappen nauwkeurig voor het beste resultaat</p>
            <div class="space-y-4">
              ${recipe.steps.map(step => `
                <div class="flex gap-4 bg-slate-50 rounded-xl p-4 hover:bg-slate-100 transition">
                  <div class="flex-shrink-0 w-10 h-10 bg-gradient-to-br from-orange-500 to-orange-600 text-white rounded-full flex items-center justify-center font-bold shadow-md">
                    ${step.num}
                  </div>
                  <div class="flex-1">
                    <p class="font-medium text-slate-800 mb-2">${step.action}</p>
                    <div class="flex flex-wrap gap-4 text-sm text-slate-600">
                      ${step.tools.length > 0 ? `<span class="bg-white px-2 py-1 rounded">🔧 ${step.tools.join(', ')}</span>` : ''}
                      <span class="bg-white px-2 py-1 rounded">⏱️ ${step.time}</span>
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      </div>
    </div>
  `;
}

// FUNCTIONS
function navigateTo(view) {
  state.view = view;
  state.currentRecipe = null;
  render();
  window.scrollTo(0, 0);
}

function toggleFilter(filter) {
  state.filters[filter] = !state.filters[filter];
  render();
}

function changeServings(delta) {
  state.servings = Math.max(1, Math.min(10, state.servings + delta));
  render();
}

function generateWeekMenu() {
  // Filter logic: OR tussen filters (als EEN filter actief is, match die)
  const anyFilterActive = Object.values(state.filters).some(f => f);
  
  let filtered = RECIPES.filter(recipe => {
    if (!anyFilterActive) return true; // Geen filters = alle recepten
    
    // Als filters actief zijn, check of recept aan EEN van de filters voldoet
    if (state.filters.withChicken && recipe.tags.includes('kip')) return true;
    if (state.filters.withFish && recipe.tags.includes('vis')) return true;
    if (state.filters.vegetarian && recipe.tags.includes('vegetarisch')) return true;
    if (state.filters.withoutMeat && !recipe.tags.some(t => ['vlees', 'kip', 'vis'].includes(t))) return true;
    
    return false;
  });
  
  if (filtered.length < 7) {
    alert(`Je filters geven maar ${filtered.length} recepten. Pas je filters aan voor meer variatie!`);
    return;
  }
  
  // Shuffle en selecteer 7
  const shuffled = filtered.sort(() => Math.random() - 0.5);
  state.generatedMenu = shuffled.slice(0, 7);
  render();
  
  // Scroll naar menu
  setTimeout(() => {
    const menuElement = document.querySelector('.mt-12');
    if (menuElement) {
      menuElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }, 100);
}

function viewRecipe(id) {
  state.currentRecipe = RECIPES.find(r => r.id === id);
  state.view = 'detail';
  render();
  window.scrollTo(0, 0);
}

function toggleSaveRecipe(id) {
  const recipe = RECIPES.find(r => r.id === id);
  const index = state.savedRecipes.findIndex(r => r.id === id);
  
  if (index > -1) {
    state.savedRecipes.splice(index, 1);
  } else {
    state.savedRecipes.push(recipe);
  }
  
  // Save to localStorage met error handling
  try {
    localStorage.setItem('savedRecipes', JSON.stringify(state.savedRecipes));
  } catch (e) {
    console.log('Kan niet opslaan in localStorage');
  }
  
  render();
}

function unsaveRecipe(id) {
  state.savedRecipes = state.savedRecipes.filter(r => r.id !== id);
  try {
    localStorage.setItem('savedRecipes', JSON.stringify(state.savedRecipes));
  } catch (e) {
    console.log('Kan niet opslaan');
  }
  render();
}

function goBack() {
  state.currentRecipe = null;
  state.view = state.generatedMenu.length > 0 ? 'generator' : 'generator';
  render();
}

function downloadShoppingList() {
  let text = '🛒 BOODSCHAPPENLIJST - DE WEEKHAP\n\n';
  text += `Voor ${state.servings} personen\n\n`;
  
  const allIngredients = {};
  
  state.generatedMenu.forEach(recipe => {
    const scaled = scaleIngredients(recipe, state.servings);
    scaled.forEach(ing => {
      const key = ing.item;
      if (allIngredients[key]) {
        allIngredients[key].amount += ing.amount;
      } else {
        allIngredients[key] = {...ing};
      }
    });
  });
  
  Object.values(allIngredients).forEach(ing => {
    text += `☐ ${ing.item}: ${Math.round(ing.amount * 10) / 10} ${ing.unit}\n`;
  });
  
  const blob = new Blob([text], {type: 'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'boodschappenlijst.txt';
  a.click();
}

function render() {
  const app = document.getElementById('app');
  if (state.view === 'generator') app.innerHTML = renderGenerator();
  else if (state.view === 'saved') app.innerHTML = renderSaved();
  else if (state.view === 'detail') app.innerHTML = renderRecipeDetail();
}

// INIT
render();
</script>

</body>
</html>
