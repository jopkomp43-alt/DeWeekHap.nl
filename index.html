async function hashPassword(password) {
  const msgBuffer = new TextEncoder().encode(password);
  const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

function filterByPrefs(recipes,extra=''){const key=currentUser?currentUser.email:'guest';const prefs=db.preferences[key]||{};return recipes.filter(r=>{const txt=`${r.title} ${r.cat} ${r.ingr}`.toLowerCase();if(extra&&!txt.includes(extra.toLowerCase()))return false;if(prefs.niet&&prefs.niet.toLowerCase().split(/\s+/).some(w=>w&&txt.includes(w)))return false;if(prefs.wel){const wanted=prefs.wel.toLowerCase().split(/\s+/).filter(Boolean);if(wanted.length&&!wanted.some(w=>txt.includes(w)))return false}return true})}

function adjustIngredients(ingrLines, factor) {
  if (factor === 1) return ingrLines;
  return ingrLines.map(i => i.replace(/(\d+(?:[.,]\d+)?)/g, (m) => {
    const n = parseFloat(m.replace(',', '.'));
    const r = n * factor;
    return Number.isInteger(r) ? r : r.toFixed(1);
  }));
}

  </div>`;
}
function renderMenu(){return `<div><div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 mb-8"><h2 class="text-3xl md:text-4xl font-black">Jouw Weekmenu</h2><div class="flex flex-wrap gap-3 w-full md:w-auto">${currentUser?`<button onclick="saveMenu()" class="flex-1 md:flex-initial bg-green-600 text-white px-4 md:px-6 py-3 rounded-xl font-bold">Opslaan</button>`:`<button onclick="changeView('login')" class="flex-1 md:flex-initial bg-orange-600 text-white px-4 md:px-6 py-3 rounded-xl font-bold">Inloggen om op te slaan</button>`}<button onclick="window.print()" class="flex-1 md:flex-initial bg-blue-600 text-white px-4 md:px-6 py-3 rounded-xl font-bold">Afdrukken</button></div></div><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6">${currentMenu.map(renderRecipeCard).join('')}</div></div>`}
function render(){document.getElementById('bootStatus')?.remove();const app=document.getElementById('app');if(view==='login'){app.innerHTML=`<div class="min-h-screen flex items-center justify-center p-4"><div class="bg-white rounded-3xl p-6 md:p-10 shadow-2xl max-w-md w-full"><img src="./logo.jpg" alt="DeWeekhap logo" class="w-48 max-w-full h-auto mx-auto mb-6 rounded-2xl object-contain" loading="eager"><h1 class="text-3xl md:text-4xl font-black text-center mb-8">DeWeekhap</h1><div id="loginForm"><input id="email" type="email" placeholder="E-mail" class="w-full p-3 md:p-4 mb-3 border-2 rounded-xl text-sm md:text-base"><input id="password" type="password" placeholder="Wachtwoord" class="w-full p-3 md:p-4 mb-4 border-2 rounded-xl text-sm md:text-base"><button onclick="login()" class="w-full bg-orange-600 text-white p-3 md:p-4 rounded-xl font-bold mb-3">Inloggen</button><button onclick="showRegister()" class="w-full bg-slate-200 text-slate-700 p-3 md:p-4 rounded-xl font-bold">Registreren</button></div><div id="registerForm" class="hidden"><input id="regName" type="text" placeholder="Naam" class="w-full p-3 md:p-4 mb-3 border-2 rounded-xl text-sm md:text-base"><input id="regEmail" type="email" placeholder="E-mail" class="w-full p-3 md:p-4 mb-3 border-2 rounded-xl text-sm md:text-base"><input id="regPassword" type="password" placeholder="Wachtwoord" class="w-full p-3 md:p-4 mb-4 border-2 rounded-xl text-sm md:text-base"><button onclick="register()" class="w-full bg-orange-600 text-white p-3 md:p-4 rounded-xl font-bold mb-3">Account aanmaken</button><button onclick="showLogin()" class="w-full bg-slate-200 text-slate-700 p-3 md:p-4 rounded-xl font-bold">Terug naar inloggen</button></div><button onclick="changeView('info')" class="w-full mt-4 text-orange-600 font-bold hover:underline text-sm md:text-base">Hoe werkt het?</button></div></div>`}else if(view==='info'){const guestPrefs=db.preferences['guest']||{};app.innerHTML=`${renderGuestNav()}<div class="max-w-4xl mx-auto p-4 py-8 md:py-12"><div class="bg-white rounded-3xl p-6 md:p-8 shadow-xl mb-6"><img src="./logo.jpg" alt="DeWeekhap logo" class="w-56 max-w-full h-auto mx-auto mb-6 rounded-2xl object-contain" loading="eager"><h1 class="text-3xl md:text-5xl font-black mb-4 text-center">Welkom bij DeWeekhap</h1><p class="text-lg md:text-xl text-center text-slate-600 mb-8">Jouw slimme weekmenu planner</p><div class="bg-orange-50 p-4 md:p-6 rounded-2xl mb-8"><h2 class="text-2xl md:text-3xl font-black mb-4 text-center">Probeer het gratis</h2><p class="text-sm md:text-base text-slate-600 mb-4 text-center">Geen account nodig. Genereer direct een weekmenu.</p><div class="max-w-lg mx-auto mb-4"><p class="text-xs md:text-sm text-slate-600 mb-2">Optionele voorkeuren</p><input id="prefWel" placeholder="WEL, bijv. kip pasta" value="${guestPrefs.wel||''}" class="w-full p-3 mb-2 border-2 rounded-xl text-sm"><input id="prefNiet" placeholder="NIET, bijv. vis noten" value="${guestPrefs.niet||''}" class="w-full p-3 mb-3 border-2 rounded-xl text-sm"><button onclick="savePrefs()" class="bg-green-600 text-white px-6 py-2 rounded-xl font-bold text-sm">Opslaan</button></div><div class="flex justify-center items-center gap-4 mb-6"><span class="text-base md:text-lg font-bold">Personen</span><button onclick="servings=Math.max(1,servings-1);render()" class="w-12 h-12 bg-white rounded-xl font-bold text-xl">−</button><span class="text-2xl md:text-3xl font-black">${servings}</span><button onclick="servings++;render()" class="w-12 h-12 bg-white rounded-xl font-bold text-xl">+</button></div><div class="text-center"><button onclick="showGenerateDialog()" class="bg-orange-600 text-white px-8 md:px-12 py-4 md:py-6 rounded-2xl font-black text-base md:text-xl shadow-xl">Weekmenu Genereren</button></div></div>${currentMenu.length?renderMenu():''}</div></div>`}else if(view==='home'){const prefs=db.preferences[currentUser.email]||{};app.innerHTML=`${renderNav()}<div class="max-w-6xl mx-auto p-4 py-8 md:py-12"><div class="text-center py-8 md:py-12 bg-white rounded-3xl shadow-xl mb-8 md:mb-12"><h1 class="text-3xl md:text-5xl font-black mb-4 px-4">Welkom, ${currentUser.name}!</h1><div class="max-w-2xl mx-auto mb-8 px-4"><p class="text-xs md:text-sm text-slate-600 mb-2">Typ wat je wel en niet wilt eten</p><input id="prefWel" placeholder="WEL, bijv. kip pasta" value="${prefs.wel||''}" class="w-full p-3 mb-2 border-2 rounded-xl text-sm"><input id="prefNiet" placeholder="NIET, bijv. vis noten" value="${prefs.niet||''}" class="w-full p-3 mb-3 border-2 rounded-xl text-sm"><button onclick="savePrefs()" class="bg-green-600 text-white px-6 py-2 rounded-xl font-bold text-sm">Opslaan</button></div><div class="flex justify-center items-center gap-4 mb-8"><span class="text-base md:text-lg font-bold">Personen</span><button onclick="servings=Math.max(1,servings-1);render()" class="w-12 h-12 bg-orange-100 rounded-xl font-bold text-xl">−</button><span class="text-2xl md:text-3xl font-black">${servings}</span><button onclick="servings++;render()" class="w-12 h-12 bg-orange-100 rounded-xl font-bold text-xl">+</button></div><button onclick="showGenerateDialog()" class="bg-orange-600 text-white px-8 md:px-12 py-4 md:py-6 rounded-2xl font-black text-base md:text-xl shadow-xl mx-4">Weekmenu Genereren</button></div>${currentMenu.length?renderMenu():''}</div>`}else if(view==='saved'){const saved=db.savedMenus[currentUser.email]?.recipes||[];app.innerHTML=`${renderNav()}<div class="max-w-6xl mx-auto p-4 py-8 md:py-12"><h1 class="text-3xl md:text-4xl font-black mb-8">Opgeslagen Weekmenu</h1>${saved.length?`<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6">${saved.map(renderRecipeCard).join('')}</div>`:`<div class="bg-white rounded-3xl p-8 md:p-12 text-center"><p class="text-lg md:text-xl text-slate-500">Nog geen weekmenu opgeslagen.</p></div>`}</div>`}else if(view==='shopping'){const saved=db.savedMenus[currentUser.email]?.recipes||[];const menu=saved.length?saved:currentMenu;if(!menu.length){app.innerHTML=`${renderNav()}<div class="max-w-4xl mx-auto p-4 py-8 md:py-12"><div class="bg-white rounded-3xl p-8 md:p-12 text-center"><h1 class="text-3xl md:text-4xl font-black mb-4">Boodschappenlijst</h1><p class="text-lg md:text-xl text-slate-500 mb-6">Genereer eerst een weekmenu.</p><button onclick="changeView('home')" class="bg-orange-600 text-white px-6 md:px-8 py-3 md:py-4 rounded-xl font-bold">Naar Home</button></div></div>`;return}const all=[];const factor=servings/2;menu.forEach(r=>r.ingr.split('\n').forEach(i=>{if(factor!==1){const adjusted=i.replace(/(\d+(?:[.,]\d+)?)/g,(match)=>{const num=parseFloat(match.replace(',','.'));const result=num*factor;return Number.isInteger(result)?result:result.toFixed(1)});all.push(adjusted)}else{all.push(i)}}));app.innerHTML=`${renderNav()}<div class="max-w-4xl mx-auto p-4 py-8 md:py-12"><div class="bg-white rounded-3xl p-6 md:p-8 shadow-xl"><div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 mb-6"><div><h1 class="text-3xl md:text-4xl font-black mb-2">Boodschappenlijst</h1><p class="text-sm md:text-base text-slate-600">Voor ${servings} personen · ${menu.length} recepten</p></div><button onclick="copyShoppingList()" class="w-full md:w-auto bg-orange-600 text-white px-6 py-3 rounded-xl font-bold whitespace-nowrap">Kopiëren</button></div><div class="bg-slate-50 p-4 md:p-6 rounded-2xl"><h2 class="text-lg md:text-xl font-bold mb-4">Alle ingrediënten (${all.length})</h2><ul class="space-y-2">${all.map(i=>`<li class="flex items-start gap-3 p-2 hover:bg-white rounded-lg transition-colors"><input type="checkbox" class="w-5 h-5 mt-0.5 accent-orange-600 flex-shrink-0"><span class="flex-1 text-sm md:text-base">${i}</span></li>`).join('')}</ul></div></div></div>`}else if(view==='myrecipes'){app.innerHTML=`${renderNav()}<div class="max-w-6xl mx-auto p-4 py-8 md:py-12"><div class="bg-white rounded-3xl p-8 md:p-12 text-center"><p class="text-lg md:text-xl text-slate-500">Favoriete recepten zijn niet beschikbaar in deze versie.</p></div></div>`}bindHelpers()}
function bindHelpers(){window.showLogin=()=>{document.getElementById('loginForm')?.classList.remove('hidden');document.getElementById('registerForm')?.classList.add('hidden')};window.showRegister=()=>{document.getElementById('loginForm')?.classList.add('hidden');document.getElementById('registerForm')?.classList.remove('hidden')}}
function setupPWA(){window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('installContainer')?.classList.remove('hidden')});document.getElementById('installBtn')?.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById('installContainer')?.classList.add('hidden')});if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(console.error)}
(function init(){try{document.getElementById('bootStatus').textContent='App starten…'}catch{}try{currentUser=JSON.parse(localStorage.getItem('currentUser')||'null')}catch(e){currentUser=null;localStorage.removeItem('currentUser')}view=currentUser?'home':'info';setupPWA();render()})()
</script>
</body>
</html>
